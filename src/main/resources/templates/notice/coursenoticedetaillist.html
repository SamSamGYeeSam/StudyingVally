<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Valley - 소식 상세</title>
    <!-- 폰트 및 외부 스타일 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <link rel="stylesheet" th:href="@{/css/coursenoticedetail.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <div class="school-header">
        <h2 class="pixel-title">📜 NOTICE DETAIL</h2>
    </div>

    <!-- 목록 페이지의 main-content-scroll과 동일한 스타일 적용 -->
    <div class="form-wrapper">
        <!-- 강의명 -->
        <div class="input-group">
            <label>COURSE</label>
            <div class="pixel-readonly" th:text="${courseNotice.courseName}">강의 제목</div>
        </div>

        <!-- 소식 제목 (수정 버튼 포함) -->
        <div class="input-group">
            <div class="label-row">
                <label>TITLE</label>
                <form action="/teacher/coursenotice/updatecoursenoticePage" method="post">
                    <input type="hidden" name="courseNoticeNo" th:value="${courseNotice.courseNoticeNo}">
                    <button type="submit" class="mini-edit-btn">✏️ EDIT</button>
                </form>
            </div>
            <div class="pixel-readonly highlight" th:text="${courseNotice.courseNoticeTitle}">소식 제목</div>
        </div>

        <!-- 소식 내용 -->
        <div class="input-group" style="flex: 1; display: flex; flex-direction: column;">
            <label>CONTENT</label>
            <div class="pixel-readonly detail-content">
                <span style="white-space: pre-line;" th:text="${courseNotice.courseNoticeDesc}">소식 내용이 표시됩니다.</span>
            </div>
        </div>

        <!-- 버튼 그룹 -->
        <div class="btn-group">
            <a href="/teacher/coursenotice" class="pixel-btn btn-back">이전으로</a>
        </div>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
