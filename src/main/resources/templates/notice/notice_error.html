<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="error-container">
    <div class="error-icon">⚠️</div>
    <h2 class="error-title">오류가 발생했습니다</h2>
    <p class="error-message" th:text="${errorMessage}">오류 메시지</p>
    <button class="back-button" onclick="history.back()">확인</button>
</div>

</body>
<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</html>
