<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>강의 소식 목록</title>
  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>

<body>
<h1>강의 소식 목록</h1>

<div class="course-notice-list">
  <div th:if="${!courseNotices.isEmpty()}">
    <table>
      <thead>
      <tr>
        <th>작성일</th>
        <th>강의명</th>
        <th>강의 소식 제목</th>
        <th>상세보기</th>
        <th>삭제하기</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="notice : ${courseNotices}">
        <td th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd')}">2024-01-01 10:00</td>
        <td th:text="${notice.courseName}">강의명</td>
        <td th:text="${notice.courseNoticeTitle}">강의 소식 제목</td>
        <td>
          <form th:action="@{/teacher/coursenotice/detail}" method="post" style="margin: 0;">
            <input type="hidden" name="courseNoticeNo" th:value="${notice.courseNoticeNo}">
            <button type="submit" class="detail-btn">상세보기</button>
          </form>
        </td>
        <td>
          <form th:action="@{/teacher/coursenotice/deletecheck}" method="post" style="margin: 0;">
            <input type="hidden" name="courseNoticeNo" th:value="${notice.courseNoticeNo}">
            <button type="submit">삭제하기</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- 강의 소식 없을 때 -->
  <div th:if="${courseNotices.isEmpty()}" class="no-data">
    등록된 강의 소식이 없습니다.
  </div>
</div>

<br>

<a href="/teacher/coursenotice/registcoursenoticePage">
  <button type="button">추가하기</button>
</a>

<a href="/teacher/teachermain">
  <button type="button">이전으로</button>
</a>
<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>

</html>
