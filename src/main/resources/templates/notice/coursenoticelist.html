<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Studying Valley - 강의 소식</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
  <link rel="stylesheet" th:href="@{/css/coursenoticelist.css}">
  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
  <div class="school-header">
    <h2 class="pixel-title">📣 NOTICE BOARD</h2>
    <div>
      <a href="/teacher/coursenotice/registcoursenoticePage" class="pixel-btn btn-add">추가하기</a>
      <a href="/teacher/teachermain" class="pixel-btn btn-exit">이전으로</a>
    </div>
  </div>

  <div class="main-content-scroll">
    <!-- 리스트가 비어있지 않을 때 -->
    <table class="course-table" th:if="${!courseNotices.isEmpty()}">
      <thead>
      <tr>
        <th style="width: 15%;">DATE</th>
        <th style="width: 20%;">COURSE</th>
        <th style="width: 35%;">TITLE</th>
        <th style="width: 15%;">VIEW</th>
        <th style="width: 15%;">DEL</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="notice : ${courseNotices}">
        <td th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd')}">2026-04-21</td>
        <td th:text="${notice.courseName}" style="color: #ffca28;">강의명</td>
        <td th:text="${notice.courseNoticeTitle}" style="text-align: left; padding-left: 15px;">소식 제목</td>
        <td>
          <form th:action="@{/teacher/coursenotice/detail}" method="post">
            <input type="hidden" name="courseNoticeNo" th:value="${notice.courseNoticeNo}">
            <button type="submit" class="pixel-btn btn-view">상세</button>
          </form>
        </td>
        <td>
          <form th:action="@{/teacher/coursenotice/deletecheck}" method="post">
            <input type="hidden" name="courseNoticeNo" th:value="${notice.courseNoticeNo}">
            <button type="submit" class="pixel-btn btn-delete">삭제</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <!-- 강의 소식 없을 때 -->
    <div th:if="${courseNotices.isEmpty()}" class="no-data">
      <p>📜 등록된 강의 소식이 없습니다.</p>
    </div>
  </div>
</div>

<!-- 모달 레이아웃 유지 -->
<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
