<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의 소식 등록</title>
</head>
<body>

<h1>강의 소식 등록 페이지</h1>

<form action="/teacher/coursenotice/registcoursenotice" method="post">

    <label>강의 선택</label><br>
    <select name="courseId" required>
        <option value="">강의를 선택하세요</option>
        <option th:each="course : ${courseList}"
                th:value="${course.courseId}"
                th:text="${course.courseTitle}"></option>
    </select><br><br>

    <label>소식 제목</label><br>
    <input type="text" name="courseNoticeTitle" placeholder="제목을 입력하세요" required><br><br>

    <label>소식 내용</label><br>
    <textarea rows="10" cols="50" name="courseNoticeDesc" placeholder="내용을 입력하세요" required></textarea><br><br>

    <button type="submit">소식 등록하기</button>
</form>

<br>

<form action="/teacher/coursenotice" method="get" style="display:inline;">
    <button type="submit">이전으로</button>
</form>

</body>
</html>
