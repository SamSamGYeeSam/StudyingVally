<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="container">
    <h2>강의 소식 삭제 확인</h2>

    <div class="notice-info">
        <div class="info-row">
            <span class="label">강의명:</span>
            <span th:text="${courseNotice.courseName}"></span>
        </div>
        <div class="info-row">
            <span class="label">소식 제목:</span>
            <span th:text="${courseNotice.courseNoticeTitle}"></span>
        </div>
        <div class="info-row">
            <span class="label">소식 내용:</span>
            <span th:text="${courseNotice.courseNoticeDesc}"></span>
        </div>
    </div>

    <div class="warning">
        <strong>⚠ 경고:</strong> 이 작업은 되돌릴 수 없습니다.<br>
        해당 강의 소식이 영구적으로 삭제됩니다.
    </div>

    <div class="button-group">
        <form th:action="@{/teacher/coursenotice/delete}" method="post" style="display:inline;">
            <input type="hidden" name="courseNoticeNo" th:value="${courseNotice.courseNoticeNo}">
            <button type="submit" class="btn-delete">삭제하기</button>
        </form>

        <form action="/teacher/coursenotice" method="get" style="display:inline;">
            <button type="submit" class="btn-cancel">취소</button>
        </form>
    </div>
</div>
</body>
</html>
