<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 상세</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 32px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .top-button,
        .submit-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table th,
        .form-table td {
            border: 2px solid #222;
            padding: 16px;
            vertical-align: middle;
        }

        .form-table th {
            width: 180px;
            background-color: #f3f3f3;
            text-align: center;
        }

        .form-input,
        .form-textarea,
        .readonly-input {
            width: 100%;
            border: 2px solid #222;
            padding: 12px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .readonly-input {
            background-color: #f7f7f7;
        }

        .form-textarea {
            min-height: 320px;
            resize: vertical;
        }

        .bottom-button-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .message-box {
            margin-bottom: 16px;
            padding: 14px 16px;
            font-weight: bold;
            background-color: #ffe0e0;
            border: 2px solid #d14d4d;
            color: #7a1111;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">공지사항 상세</h1>
</div>

<div class="container">
    <div class="content-box">

        <div th:if="${errorMessage}" class="message-box" th:text="${errorMessage}"></div>

        <div class="content-header">
            <h2 class="content-title">공지사항 상세</h2>
            <div class="button-group">
                <a th:href="@{/admin/callcenter/notice}" class="top-button">목록으로</a>
            </div>
        </div>

        <!-- 공지사항 수정 폼 -->
        <form th:action="@{/admin/callcenter/noticedetail}" method="post">
            <!-- 수정 대상을 구분하기 위한 hidden 값 -->
            <input type="hidden" name="noticeNo" th:value="${noticeDetail.noticeNo}">

            <table class="form-table">
                <tr>
                    <th>공지 번호</th>
                    <td>
                        <input type="text" class="readonly-input" th:value="${noticeDetail.noticeNo}" readonly>
                    </td>
                </tr>
                <tr>
                    <th>작성 일시</th>
                    <td>
                        <input type="text" class="readonly-input"
                               th:value="${#temporals.format(noticeDetail.createdDate, 'yyyy-MM-dd HH:mm:ss')}" readonly>
                    </td>
                </tr>
                <tr>
                    <th>수정 일시</th>
                    <td>
                        <input type="text" class="readonly-input"
                               th:value="${noticeDetail.modifiedDate != null ? #temporals.format(noticeDetail.modifiedDate, 'yyyy-MM-dd HH:mm:ss') : ''}" readonly>
                    </td>
                </tr>
                <tr>
                    <th>공지 제목</th>
                    <td>
                        <input type="text" name="noticeTitle" class="form-input" th:value="${noticeDetail.noticeTitle}">
                    </td>
                </tr>
                <tr>
                    <th>공지 내용</th>
                    <td>
                        <textarea name="noticeDesc" class="form-textarea" th:text="${noticeDetail.noticeDesc}"></textarea>
                    </td>
                </tr>
            </table>

            <div class="bottom-button-area">
                <button type="submit" class="submit-button">완료</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
