<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 목록</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .top-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .list-table {
            width: 100%;
            border-collapse: collapse;
        }

        .list-table th,
        .list-table td {
            border: 2px solid #222;
            padding: 12px;
            text-align: center;
        }

        .list-table th {
            background-color: #f3f3f3;
        }

        .left {
            text-align: left !important;
        }

        .empty-text {
            text-align: center;
            font-size: 20px;
            color: #666;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">공지사항 목록</h1>
</div>

<div class="container">
    <div class="content-box">
        <div class="content-header">
            <h2 class="content-title">공지사항 목록</h2>
            <div class="button-group">
                <a th:href="@{/admin/callcenter}" class="top-button">돌아가기</a>
                <a th:href="@{/admin/callcenter/noticeregist}" class="top-button">추가하기</a>
            </div>
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(noticeList)}">
            <table class="list-table">
                <thead>
                <tr>
                    <th style="width: 90px;">번호</th>
                    <th style="width: 280px;">공지 제목</th>
                    <th>공지 내용</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notice : ${noticeList}">
                    <td th:text="${notice.displayNo}">15</td>
                    <td class="left" th:text="${notice.noticeTitle}">사이트 오픈 안내</td>
                    <td class="left" th:text="${notice.noticeDesc}">환영합니다!</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-text" th:if="${#lists.isEmpty(noticeList)}">
            조회된 공지사항이 없습니다.
        </div>
    </div>
</div>

</body>
</html>
