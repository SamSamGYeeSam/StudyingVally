<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 목록</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .top-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .list-table {
            width: 100%;
            border-collapse: collapse;
        }

        .list-table th,
        .list-table td {
            border: 2px solid #222;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        .list-table th {
            background-color: #f3f3f3;
        }

        .left {
            text-align: left !important;
        }

        .empty-text {
            text-align: center;
            font-size: 20px;
            color: #666;
            padding: 40px 0;
        }

        .select-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .message-box {
            margin-bottom: 16px;
            padding: 14px 16px;
            font-weight: bold;
        }

        .success {
            background-color: #e8f5c8;
            border: 2px solid #86a83f;
            color: #2f3c10;
        }

        .error {
            background-color: #ffe0e0;
            border: 2px solid #d14d4d;
            color: #7a1111;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">공지사항 목록</h1>
</div>

<div class="container">
    <div class="content-box">

        <script>
            const params = new URLSearchParams(window.location.search);
            const result = params.get("result");

            if (result === "success") {
                // 여기 나중에 모달 UI 넣으면 됨
                alert("수정 완료");
            }
        </script>


        <!-- 실패 메시지 출력 영역 -->
        <div th:if="${errorMessage}" class="message-box error" th:text="${errorMessage}"></div>

        <div class="content-header">
            <h2 class="content-title">공지사항 목록</h2>
            <div class="button-group">
                <a th:href="@{/admin/callcenter}" class="top-button">돌아가기</a>
                <a th:href="@{/admin/callcenter/noticeregist}" class="top-button">추가하기</a>
            </div>
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(noticeList)}">
            <table class="list-table">
                <thead>
                <tr>
                    <th style="width: 90px;">번호</th>
                    <th>공지 제목</th>
                    <th style="width: 180px;">작성 일자</th>
                    <th style="width: 120px;">선택</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notice, status : ${noticeList}">
                    <!-- 프론트에서 순번 생성 -->
                    <td th:text="${status.count}">1</td>
                    <td class="left" th:text="${notice.noticeTitle}">환불 규정</td>
                    <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-17</td>
                    <td>
                        <a th:href="@{/admin/callcenter/noticedetail(noticeNo=${notice.noticeNo})}"
                           class="select-button">
                            선택
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-text" th:if="${#lists.isEmpty(noticeList)}">
            조회된 공지사항이 없습니다.
        </div>
    </div>
</div>

</body>
</html>
