<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 추가</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 32px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .top-button,
        .submit-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .submit-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table th,
        .form-table td {
            border: 2px solid #222;
            padding: 16px;
            vertical-align: middle;
        }

        .form-table th {
            width: 180px;
            background-color: #f3f3f3;
            text-align: center;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 2px solid #222;
            padding: 12px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .form-textarea {
            min-height: 320px;
            resize: vertical;
        }

        .bottom-button-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .message-box {
            margin-bottom: 16px;
            padding: 14px 16px;
            font-weight: bold;
            background-color: #ffe0e0;
            border: 2px solid #d14d4d;
            color: #7a1111;
        }
    </style>

    <script>
        function validateNoticeRegistForm(form) {
            const titleInput = form.querySelector('input[name="noticeTitle"]');
            const descTextarea = form.querySelector('textarea[name="noticeDesc"]');
            const button = form.querySelector('button[type="submit"]');

            if (!titleInput.value.trim()) {
                showModal("공지 제목을 입력하세요." , "error");
                titleInput.focus();
                return false;
            }

            if (!descTextarea.value.trim()) {
                showModal("공지 내용을 입력하세요." , "error");
                descTextarea.focus();
                return false;
            }

            if (button.dataset.submitted === "true") {
                return false;
            }

            button.dataset.submitted = "true";
            button.disabled = true;
            button.textContent = "등록 중...";
            return true;
        }
    </script>

    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">공지사항 추가</h1>
</div>

<div class="container">
    <div class="content-box">

        <div th:if="${errorMessage}" class="message-box" th:text="${errorMessage}"></div>

        <div class="content-header">
            <h2 class="content-title">공지사항 추가</h2>
            <div class="button-group">
                <a th:href="@{/admin/callcenter/notice}" class="top-button">목록으로</a>
            </div>
        </div>

        <form th:action="@{/admin/callcenter/noticeregist}" method="post"
              th:object="${noticeRegistRequest}"
              onsubmit="return validateNoticeRegistForm(this);">
            <table class="form-table">
                <tr>
                    <th>공지 제목</th>
                    <td>
                        <input type="text" th:field="*{noticeTitle}" class="form-input" placeholder="공지 제목을 입력하세요">
                    </td>
                </tr>
                <tr>
                    <th>공지 내용</th>
                    <td>
                        <textarea th:field="*{noticeDesc}" class="form-textarea" placeholder="공지 내용을 입력하세요"></textarea>
                    </td>
                </tr>
            </table>

            <div class="bottom-button-area">
                <button type="submit" class="submit-button">등록하기</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
