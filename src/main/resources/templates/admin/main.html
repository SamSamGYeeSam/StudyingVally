<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 메인 페이지</title>
    <style>
        /* comment.
         * 전체 페이지 기본 스타일
         */
        body {
            margin: 0;
            padding: 0;
            font-family: "Malgun Gothic", sans-serif;
            background: linear-gradient(to bottom, #cfeea6 0%, #bde08f 35%, #d7c39c 100%);
            min-height: 100vh;
            color: #2d2418;
        }

        /* comment.
         * 전체 컨텐츠 래퍼
         */
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px 70px;
        }

        /* comment.
         * 상단 액션 버튼 영역
         * 로그아웃 버튼을 우측 정렬하기 위한 영역이다.
         */
        .top-action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        /* comment.
         * 로그아웃 폼 기본 여백 제거
         */
        .logout-form {
            margin: 0;
        }

        /* comment.
         * 로그아웃 버튼 스타일
         */
        .logout-button {
            border: 3px solid #6b4f2a;
            background-color: #fff8e8;
            color: #4e3e2b;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
        }

        /* comment.
         * 상단 타이틀 박스
         */
        .title-box {
            background-color: rgba(255, 248, 220, 0.9);
            border: 4px solid #6b4f2a;
            border-radius: 18px;
            box-shadow: 0 8px 0 #8b6a3d;
            text-align: center;
            padding: 28px 20px;
            margin-bottom: 50px;
        }

        /* comment.
         * 관리자 메인 제목 스타일
         */
        .title-box h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* comment.
         * 관리자 메인 부제목 스타일
         */
        .title-box p {
            margin: 12px 0 0;
            font-size: 18px;
            color: #5a4a34;
        }

        /* comment.
         * 메뉴 카드 그리드
         */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(320px, 1fr));
            gap: 28px;
            justify-content: center;
        }

        /* comment.
         * 마지막 카드(고객센터)를 아래 가운데 정렬
         */
        .menu-card:last-child {
            grid-column: 1 / span 2;
            max-width: 580px;
            justify-self: center;
            width: 100%;
        }

        /* comment.
         * 메뉴 카드 기본 스타일
         */
        .menu-card {
            display: block;
            text-decoration: none;
            color: #fff8e8;
            background: linear-gradient(to bottom, #9b6b3f 0%, #7a522f 100%);
            border: 4px solid #53351b;
            border-radius: 22px;
            box-shadow: 0 10px 0 #5f3f22;
            padding: 32px 28px;
            min-height: 180px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        /* comment.
         * 카드 상단 하이라이트 효과
         */
        .menu-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        /* comment.
         * 카드 호버 효과
         */
        .menu-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 0 #5f3f22;
        }

        /* comment.
         * 카드 제목 스타일
         */
        .menu-title {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        /* comment.
         * 카드 설명 스타일
         */
        .menu-desc {
            font-size: 17px;
            line-height: 1.7;
            color: #f9edd3;
        }

        /* comment.
         * 하단 안내 박스
         */
        .footer-note {
            margin-top: 45px;
            background-color: rgba(255, 248, 220, 0.92);
            border: 3px solid #6b4f2a;
            border-radius: 16px;
            padding: 18px 20px;
            text-align: center;
            font-size: 17px;
            color: #4e3e2b;
        }

        /* comment.
         * 반응형 처리
         */
        @media (max-width: 900px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .menu-card:last-child {
                grid-column: auto;
                max-width: none;
            }

            .title-box h1 {
                font-size: 34px;
            }

            .menu-title {
                font-size: 26px;
            }

            .top-action-bar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- comment.
         관리자 메인 화면 상단 로그아웃 영역
         Spring Security 로그아웃 URL로 POST 요청을 보낸다.
         주의:
         - 로그아웃은 GET 링크가 아니라 form submit 방식으로 보내는 것이 안전하다.
         - CSRF가 활성화된 경우 hidden CSRF 토큰을 반드시 포함해야 한다.
    -->
    <div class="top-action-bar">
        <form th:action="@{/auth/logout}" method="post" class="logout-form">
            <!-- comment.
                 CSRF 활성화 환경에서 필요한 토큰 값
                 Security 설정에서 CSRF를 끄지 않았다면 반드시 필요하다.
            -->
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="logout-button">로그아웃</button>
        </form>
    </div>

    <!-- comment.
         관리자 메인 상단 제목 영역
    -->
    <div class="title-box">
        <h1>관리자 메인 페이지</h1>
        <p>운영에 필요한 기능을 선택해 관리할 수 있는 관리자 전용 메뉴 화면</p>
    </div>

    <!-- comment.
         관리자 주요 메뉴 카드 영역
    -->
    <div class="menu-grid">

        <a th:href="@{/admin/usercare}" class="menu-card">
            <div class="menu-title">사용자 관리</div>
            <div class="menu-desc">
                강사와 학생 계정을 조회하고,<br>
                계정 상태를 확인하며 관리할 수 있는 메뉴
            </div>
        </a>

        <a th:href="@{/admin/coursecare}" class="menu-card">
            <div class="menu-title">강의 관리</div>
            <div class="menu-desc">
                강의 목록을 확인하고,<br>
                공개 상태 및 승인 여부를 관리하는 메뉴
            </div>
        </a>

        <a th:href="@{/admin/callcenter}" class="menu-card">
            <div class="menu-title">고객센터</div>
            <div class="menu-desc">
                공지사항, 문의함, 신고함을 확인하고<br>
                운영 응답을 처리하는 메뉴
            </div>
        </a>

    </div>

    <div class="footer-note">
        관리자 기능은 실제 운영에 필요한 메뉴만 제공되며,
        기능별 화면에서 상세 조회 및 처리 작업을 수행할 수 있습니다.
    </div>

</div>

</body>
</html>
