<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>관리자 메인 페이지</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css"
    />
    <style>
        :root {
          --wood-dark: #3e2723;
          --wood-medium: #5d4037;
          --wood-light: #8d6e63;
          --gold: #ffca28;
          --paper: #fff8e1;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: 'DungGeunMo', sans-serif;
          background-color: #f5efe6;
          height: 100vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 40px 0 50px;
          position: relative;
        }

        .top-action-bar {
          position: fixed;
          top: 38px;
          right: 50px;
          z-index: 100;
        }

        .logout-form {
          margin: 0;
        }

        .logout-button {
          background: var(--paper);
          color: var(--wood-dark);
          border: 3px solid var(--wood-dark);
          padding: 10px 18px;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
          font-family: 'DungGeunMo';
          transition: 0.1s;
          width: 120px;
        }
        .logout-button:hover {
          transform: translate(-2px, -2px);
          box-shadow: 5px 5px 0 var(--wood-dark);
        }
        .logout-button:active {
          transform: translate(1px, 1px);
          box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .title-box {
          width: 80%;
          background: var(--paper);
          border: 3px solid var(--wood-medium);
          outline: 2px solid var(--wood-dark);
          text-align: center;
          padding: 40px 20px;
          flex-shrink: 0;
        }

        .title-box h1 {
          font-size: 53px;
          color: var(--wood-dark);
          text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
          letter-spacing: 1px;
        }

        .menu-grid {
          width: 80%;
          display: flex;
          flex-direction: row;
          gap: 14px;
          margin-top: 20px;
          flex: 1;
        }

        .menu-card {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          background: var(--paper);
          border: 3px solid var(--wood-medium);
          outline: 1px solid var(--wood-dark);
          padding: 22px 28px;
          text-decoration: none !important;
          color: var(--wood-dark);
          transition: 0.1s;
        }
        .menu-card:hover {
          transform: translate(-3px, -3px);
          box-shadow: 7px 7px 0 var(--wood-dark);
          color: var(--wood-dark);
        }
        .menu-card:active {
          transform: translate(2px, 2px);
          box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .menu-title {
          font-size: 35px;
          font-weight: 700;
          color: var(--wood-dark);
          text-align: center;
        }

        .card-icon svg {
          width: 80px;
          height: 80px;
        }
    </style>
</head>
<body>
<div class="top-action-bar">
    <form th:action="@{/auth/logout}" method="post" class="logout-form">
        <input
                type="hidden"
                th:if="${_csrf != null}"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
        />
        <button type="submit" class="logout-button">로그아웃</button>
    </form>
</div>

<div class="title-box">
    <h1>관리자 메인 페이지</h1>
</div>

<div class="menu-grid">
    <!-- 사용자 관리 -->
    <a th:href="@{/admin/usercare}" class="menu-card">
        <div class="card-icon">
            <svg
                    viewBox="0 0 60 60"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <circle
                        cx="30"
                        cy="18"
                        r="12"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                />
                <path
                        d="M6 54 C6 36 54 36 54 54"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                        stroke-linecap="round"
                />
            </svg>
        </div>
        <div class="menu-title">사용자 관리</div>
    </a>

    <!-- 강의 관리 -->
    <a th:href="@{/admin/coursecare}" class="menu-card">
        <div class="card-icon">
            <svg
                    viewBox="0 0 60 60"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <rect
                        x="4"
                        y="6"
                        width="52"
                        height="34"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                />
                <line
                        x1="14"
                        y1="18"
                        x2="28"
                        y2="18"
                        stroke="#5d4037"
                        stroke-width="2.5"
                        stroke-linecap="round"
                />
                <line
                        x1="14"
                        y1="26"
                        x2="22"
                        y2="26"
                        stroke="#5d4037"
                        stroke-width="2.5"
                        stroke-linecap="round"
                />
                <line
                        x1="34"
                        y1="16"
                        x2="46"
                        y2="28"
                        stroke="#5d4037"
                        stroke-width="2.5"
                        stroke-linecap="round"
                />
                <line
                        x1="46"
                        y1="16"
                        x2="34"
                        y2="28"
                        stroke="#5d4037"
                        stroke-width="2.5"
                        stroke-linecap="round"
                />
                <line
                        x1="22"
                        y1="40"
                        x2="18"
                        y2="54"
                        stroke="#5d4037"
                        stroke-width="3"
                        stroke-linecap="round"
                />
                <line
                        x1="38"
                        y1="40"
                        x2="42"
                        y2="54"
                        stroke="#5d4037"
                        stroke-width="3"
                        stroke-linecap="round"
                />
                <line
                        x1="14"
                        y1="54"
                        x2="46"
                        y2="54"
                        stroke="#5d4037"
                        stroke-width="3"
                        stroke-linecap="round"
                />
            </svg>
        </div>
        <div class="menu-title">강의 관리</div>
    </a>

    <!-- 고객센터 -->
    <a th:href="@{/admin/callcenter}" class="menu-card">
        <div class="card-icon">
            <svg
                    viewBox="0 0 60 60"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <path
                        d="M10 30 C10 14 50 14 50 30"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                        stroke-linecap="round"
                />
                <rect
                        x="5"
                        y="28"
                        width="10"
                        height="14"
                        rx="2"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                />
                <rect
                        x="45"
                        y="28"
                        width="10"
                        height="14"
                        rx="2"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                />
                <path
                        d="M45 40 C45 48 36 50 30 50"
                        stroke="#5d4037"
                        stroke-width="3"
                        fill="none"
                        stroke-linecap="round"
                />
            </svg>
        </div>
        <div class="menu-title">고객센터</div>
    </a>
</div>
</body>
</html>
