<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 메인 페이지</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, "맑은 고딕", sans-serif;
            background-color: #f5f7fa;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #222;
            margin-bottom: 50px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .menu-card {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            background-color: white;
            border-radius: 16px;
            text-decoration: none;
            color: #222;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .menu-sub-text {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: normal;
            color: #666;
            text-align: center;
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 28px;
            }

            .menu-card {
                min-height: 140px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1 class="page-title">관리자 메인 페이지</h1>

    <div class="menu-grid">
        <a th:href="@{/admin/usercare}" class="menu-card">
            <div>
                사용자 관리
                <span class="menu-sub-text">회원 조회 및 상태 관리</span>
            </div>
        </a>

        <a th:href="@{/admin/coursecare}" class="menu-card">
            <div>
                강의 관리
                <span class="menu-sub-text">강의 조회 및 승인/비활성화 관리</span>
            </div>
        </a>

        <a th:href="@{/admin/callcenter}" class="menu-card">
            <div>
                고객센터
                <span class="menu-sub-text">공지사항, 문의함, 신고함 관리</span>
            </div>
        </a>

        <a th:href="@{/admin/datacare}" class="menu-card">
            <div>
                데이터 관리
                <span class="menu-sub-text">운영 데이터 확인</span>
            </div>
        </a>
    </div>
</div>

</body>
</html>
