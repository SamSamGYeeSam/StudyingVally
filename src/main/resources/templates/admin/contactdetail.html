<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리 상세 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
        }

        .container {
            padding: 30px 40px 50px;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .left-panel {
            width: 25%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .center-panel {
            width: 47%;
            border: 3px solid #111;
            background-color: #fff;
            min-height: 550px;
            padding: 24px;
        }

        .right-panel {
            width: 28%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box {
            border: 3px solid #111;
            background-color: #fff;
            padding: 22px;
            text-align: center;
        }

        .photo-box {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .info-box {
            min-height: 80px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .count-box {
            min-height: 90px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .course-title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .course-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .course-list li {
            border: 2px solid #111;
            margin-bottom: 12px;
            padding: 14px 18px;
            font-size: 18px;
            background-color: #f9f9f9;
        }

        .empty-course {
            text-align: center;
            font-size: 20px;
            margin-top: 80px;
        }

        .button-form {
            margin: 0;
        }

        .action-btn {
            width: 100%;
            padding: 18px 0;
            border: 3px solid #111;
            background-color: #c9ef7a;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 18px 0;
            border: 3px solid #111;
            background-color: #c9ef7a;
            color: #111;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .status-text {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 16px;
            border: 3px solid #111;
            background-color: #fff;
        }

        .bottom-description {
            margin-top: 26px;
            font-size: 18px;
            text-align: center;
        }
    </style>

    <script>
        function submitOnce(form) {
            const button = form.querySelector('button[type="submit"]');

            if (button.dataset.submitted === "true") {
                return false;
            }

            button.dataset.submitted = "true";
            button.disabled = true;
            button.textContent = "처리 중...";
            return true;
        }
    </script>
</head>
<body>

<div class="header">
    <h1>사용자 관리 상세 페이지</h1>
</div>

<div class="container">
    <div class="layout">

        <div class="left-panel">
            <div class="box photo-box">사진</div>
            <div class="box info-box" th:text="${userDetail.userName}">이름</div>
            <div class="box info-box" th:text="${userDetail.userNickname}">닉네임</div>
            <div class="box info-box" th:text="${userDetail.userPhoneNumber}">전화번호</div>
        </div>

        <div class="center-panel">
            <div class="course-title" th:text="${userDetail.courseSectionTitle}">강의 목록</div>

            <ul class="course-list" th:if="${not #lists.isEmpty(userDetail.courseTitleList)}">
                <li th:each="courseTitle : ${userDetail.courseTitleList}" th:text="${courseTitle}">
                    강의 제목
                </li>
            </ul>

            <div class="empty-course" th:if="${#lists.isEmpty(userDetail.courseTitleList)}">
                조회된 강의가 없습니다.
            </div>
        </div>

        <div class="right-panel">
            <div class="box count-box">
                <div>문의 내역 수</div>
                <div th:text="${userDetail.inquiryCount}">0</div>
            </div>

            <div class="box count-box">
                <div>신고 내역 수</div>
                <div th:text="${userDetail.reportCount}">0</div>
            </div>

            <div class="status-text">
                역할:
                <span th:text="${userDetail.userRoleLabel}">학생</span>
            </div>

            <div class="status-text">
                계정 상태:
                <span th:text="${userDetail.userStatusLabel}">활성화</span>
            </div>

            <form th:action="@{/admin/usercare/enable}" method="post" class="button-form" onsubmit="return submitOnce(this);">
                <input type="hidden" name="userNo" th:value="${userDetail.userNo}">
                <button type="submit" class="action-btn">활성화</button>
            </form>

            <form th:action="@{/admin/usercare/disable}" method="post" class="button-form" onsubmit="return submitOnce(this);">
                <input type="hidden" name="userNo" th:value="${userDetail.userNo}">
                <button type="submit" class="action-btn">비활성화</button>
            </form>

            <a th:href="@{/admin/usercare}" class="back-link">목록으로</a>
        </div>
    </div>

    <div class="bottom-description">
        사용자 기본 정보와 강의 이력, 문의/신고 내역 수를 확인하고 계정 상태를 변경할 수 있습니다.
    </div>
</div>

</body>
</html>
