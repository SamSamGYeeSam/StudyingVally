<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의 관리 상세 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
        }

        .container {
            padding: 30px 40px 60px;
        }

        .top-layout {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .left-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .right-panel {
            width: 65%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box {
            border: 3px solid #111;
            background-color: #fff;
            padding: 22px;
        }

        .info-box {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .desc-box {
            min-height: 302px;
            font-size: 18px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .status-box {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .chapter-title {
            margin: 0 0 16px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            table-layout: fixed;
        }

        th, td {
            border: 3px solid #111;
            text-align: center;
            padding: 14px 10px;
            font-size: 16px;
            vertical-align: middle;
        }

        th {
            background-color: #f7f7f7;
        }

        .chapter-desc {
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .button-wrap {
            display: flex;
            gap: 18px;
            margin-top: 24px;
            justify-content: center;
        }

        .button-form {
            margin: 0;
        }

        .action-btn, .back-link {
            display: inline-block;
            min-width: 160px;
            text-align: center;
            padding: 16px 22px;
            border: 3px solid #111;
            background-color: #c9ef7a;
            color: #111;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .bottom-description {
            margin-top: 30px;
            font-size: 18px;
            text-align: center;
        }
    </style>

    <script>
        function submitOnce(form) {
            const button = form.querySelector('button[type="submit"]');

            if (button.dataset.submitted === "true") {
                return false;
            }

            button.dataset.submitted = "true";
            button.disabled = true;
            button.textContent = "처리 중...";
            return true;
        }
    </script>
</head>
<body>

<div class="header">
    <h1>강의 관리 상세 페이지</h1>
</div>

<div class="container">

    <div class="top-layout">
        <div class="left-panel">

            <div class="box info-box" th:text="${courseDetail.courseTitle}">
                강의명
            </div>

            <div class="box info-box">
                강사명 :
                <span th:text="${courseDetail.teacherName}" style="margin-left: 8px;">김철수</span>
            </div>

            <div class="box info-box">
                개설일 :
                <span th:text="${courseDetail.courseCreatedAt}" style="margin-left: 8px;">2026-04-15 11:00</span>
            </div>

            <div class="box info-box status-box">
                상태 :
                <span th:text="${courseDetail.courseStatusLabel}" style="margin-left: 8px;">활성화</span>
            </div>
        </div>

        <div class="right-panel">
            <div class="box desc-box">
                <strong>강의 설명</strong>
                <hr style="border: 1px solid #111; margin: 14px 0;">
                <div th:text="${courseDetail.courseDescription}">
                    강의 설명
                </div>
            </div>
        </div>
    </div>

    <div class="box">
        <h2 class="chapter-title">챕터 정보</h2>

        <table>
            <thead>
            <tr>
                <th style="width: 10%;">번호</th>
                <th style="width: 18%;">챕터명</th>
                <th style="width: 42%;">챕터 설명</th>
                <th style="width: 30%;">첨부 경로</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(courseDetail.chapterList)}">
                <td colspan="4">등록된 챕터가 없습니다.</td>
            </tr>

            <tr th:each="chapter, stat : ${courseDetail.chapterList}">
                <td th:text="${stat.index + 1}">1</td>
                <td th:text="${chapter.chapTitle}">챕터명</td>
                <td th:text="${chapter.chapDesc}" class="chapter-desc">챕터 설명</td>
                <td th:text="${chapter.chapUrl}">/video/sample.mp4</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="button-wrap">
        <form th:action="@{/admin/coursecare/open}" method="post" class="button-form" onsubmit="return submitOnce(this);">
            <input type="hidden" name="courseId" th:value="${courseDetail.courseId}">
            <button type="submit" class="action-btn">활성화</button>
        </form>

        <form th:action="@{/admin/coursecare/close}" method="post" class="button-form" onsubmit="return submitOnce(this);">
            <input type="hidden" name="courseId" th:value="${courseDetail.courseId}">
            <button type="submit" class="action-btn">비활성화</button>
        </form>

        <a th:href="@{/admin/coursecare}" class="back-link">목록으로</a>
    </div>

    <div class="bottom-description">
        강의 상세 정보와 챕터 목록을 확인하고, 강의 공개 상태를 변경할 수 있습니다.
    </div>
</div>

</body>
</html>
