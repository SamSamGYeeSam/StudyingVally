<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의 관리 상세 페이지</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css"
    />
    <style>
        :root {
          --wood-dark: #3e2723;
          --wood-medium: #5d4037;
          --wood-light: #8d6e63;
          --gold: #ffca28;
          --paper: #fff8e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DungGeunMo', sans-serif;
            background-color: #f5efe6;
            margin: 0;
        }

        .header {
            background: var(--paper);
            border-bottom: 3px solid var(--wood-medium);
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 53px;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            display: inline-block;
            padding: 14px 28px;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
            text-decoration: none !important;
            font-weight: bold;
            font-size: 20px;
            font-family: 'DungGeunMo';
            transition: 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .back-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .container {
            padding: 30px 40px 60px;
        }

        .top-layout {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .left-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .right-panel {
            width: 65%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box {
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
            background: var(--paper);
            padding: 22px;
        }

        .info-box {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            color: var(--wood-dark);
        }

        .desc-box {
            min-height: 302px;
            font-size: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
            color: var(--wood-dark);
        }

        .desc-box strong {
            color: var(--wood-dark);
        }

        .desc-box hr {
            border: 1px solid var(--wood-dark);
            margin: 14px 0;
        }

        .status-box {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .chapter-title {
            margin: 0 0 16px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: var(--wood-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--paper);
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
            table-layout: fixed;
        }

        th, td {
            border: 2px solid var(--wood-dark);
            text-align: center;
            padding: 14px 10px;
            font-size: 18px;
            vertical-align: middle;
            color: var(--wood-dark);
        }

        th {
            background: var(--wood-light);
            color: var(--paper);
            font-weight: bold;
        }

        .chapter-desc {
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .button-wrap {
            display: flex;
            gap: 18px;
            margin-top: 24px;
            justify-content: center;
        }

        .button-form {
            margin: 0;
        }

        .action-btn, .back-link {
            display: inline-block;
            min-width: 160px;
            text-align: center;
            padding: 16px 22px;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
            font-size: 20px;
            font-weight: bold;
            text-decoration: none !important;
            cursor: pointer;
            font-family: 'DungGeunMo';
            transition: 0.1s;
        }

        .action-btn:hover, .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .action-btn:active, .back-link:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .bottom-description {
            margin-top: 30px;
            font-size: 20px;
            text-align: center;
            color: var(--wood-dark);
        }
    </style>

    <script>
        function submitOnce(form) {
            const button = form.querySelector('button[type="submit"]');

            if (button.dataset.submitted === "true") {
                return false;
            }

            button.dataset.submitted = "true";
            button.disabled = true;
            button.textContent = "처리 중...";
            return true;
        }
    </script>
</head>
<body>

<div class="header">
    <h1>강의 관리 상세 페이지</h1>
    <a th:href="@{/admin/coursecare}" class="back-btn">이전으로</a>
</div>

<div class="container">

    <div class="top-layout">
        <div class="left-panel">

            <div class="box info-box" th:text="${courseDetail.courseTitle}">
                강의명
            </div>

            <div class="box info-box">
                강사명 :
                <span th:text="${courseDetail.teacherName}" style="margin-left: 8px;">김철수</span>
            </div>

            <div class="box info-box">
                개설일 :
                <span th:text="${courseDetail.courseCreatedAt}" style="margin-left: 8px;">2026-04-15 11:00</span>
            </div>

            <div class="box info-box status-box">
                상태 :
                <span th:text="${courseDetail.courseStatusLabel}" style="margin-left: 8px;">활성화</span>
            </div>
        </div>

        <div class="right-panel">
            <div class="box desc-box">
                <strong>강의 설명</strong>
                <hr>
                <div th:text="${courseDetail.courseDescription}">
                    강의 설명
                </div>
            </div>
        </div>
    </div>

    <div class="box">
        <h2 class="chapter-title">챕터 정보</h2>

        <table>
            <thead>
            <tr>
                <th style="width: 10%;">번호</th>
                <th style="width: 18%;">챕터명</th>
                <th style="width: 42%;">챕터 설명</th>
                <th style="width: 30%;">첨부 경로</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(courseDetail.chapterList)}">
                <td colspan="4">등록된 챕터가 없습니다.</td>
            </tr>

            <tr th:each="chapter, stat : ${courseDetail.chapterList}">
                <td th:text="${stat.index + 1}">1</td>
                <td th:text="${chapter.chapTitle}">챕터명</td>
                <td th:text="${chapter.chapDesc}" class="chapter-desc">챕터 설명</td>
                <td th:text="${chapter.chapUrl}">/video/sample.mp4</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="button-wrap">
        <form th:action="@{/admin/coursecare/open}" method="post" class="button-form" onsubmit="return submitOnce(this);">
            <input type="hidden" name="courseId" th:value="${courseDetail.courseId}">
            <button type="submit" class="action-btn">활성화</button>
        </form>

        <form th:action="@{/admin/coursecare/close}" method="post" class="button-form" onsubmit="return submitOnce(this);">
            <input type="hidden" name="courseId" th:value="${courseDetail.courseId}">
            <button type="submit" class="action-btn">비활성화</button>
        </form>
    </div>

</div>

</body>
</html>
