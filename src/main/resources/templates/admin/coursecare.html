<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>강의 관리 페이지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #efefef;
    }

    .header {
      background-color: #c9ef7a;
      padding: 30px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 42px;
    }

    .back-btn {
      display: inline-block;
      padding: 14px 28px;
      border: 3px solid #111;
      background-color: #c9ef7a;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    .container {
      padding: 30px 40px 60px;
    }

    .filter-wrap {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .filter-btn {
      display: inline-block;
      width: 160px;
      text-align: center;
      padding: 22px 0;
      background-color: #e7d466;
      color: #111;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid transparent;
    }

    .filter-btn.active {
      border: 3px solid #111;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      table-layout: fixed;
    }

    th, td {
      border: 3px solid #111;
      text-align: center;
      padding: 16px 12px;
      font-size: 16px;
      vertical-align: middle;
    }

    th {
      background-color: #f7f7f7;
    }

    .description-cell {
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-form {
      margin: 0;
    }

    .select-btn {
      padding: 10px 18px;
      border: 2px solid #111;
      background-color: #c9ef7a;
      font-weight: bold;
      cursor: pointer;
    }

    .description {
      margin-top: 40px;
      font-size: 18px;
    }
  </style>

  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="header">
  <h1>강의 관리 페이지</h1>
  <a th:href="@{/admin/main}" class="back-btn">돌아가기</a>
</div>

<div class="container">

  <div class="filter-wrap">
    <a th:href="@{/admin/coursecare}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'ALL'} ? ' active' : ''">
      전체
    </a>

    <a th:href="@{/admin/coursecare(status='OPEN')}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'OPEN'} ? ' active' : ''">
      활성화
    </a>

    <a th:href="@{/admin/coursecare(status='CLOSED')}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'CLOSED'} ? ' active' : ''">
      비활성화
    </a>
  </div>

  <table>
    <thead>
    <tr>
      <th style="width: 8%;">번호</th>
      <th style="width: 16%;">강의명</th>
      <th style="width: 12%;">강사명</th>
      <th style="width: 34%;">강의 설명</th>
      <th style="width: 16%;">개설일</th>
      <th style="width: 8%;">공개 상태</th>
      <th style="width: 6%;">선택</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(courseList)}">
      <td colspan="7">조회된 강의가 없습니다.</td>
    </tr>

    <tr th:each="course, stat : ${courseList}">
      <td th:text="${stat.index + 1}">1</td>
      <td th:text="${course.courseTitle}">자바 기초</td>
      <td th:text="${course.teacherName}">김철수</td>
      <td th:text="${course.courseDescription}" class="description-cell">강의 설명</td>
      <td th:text="${course.courseCreatedAt}">2026-04-15 11:00</td>
      <td th:text="${course.courseStatusLabel}">활성화</td>
      <td>
        <form th:action="@{/admin/coursecare/detail}" method="post" class="select-form">
          <input type="hidden" name="courseId" th:value="${course.courseId}">
          <button type="submit" class="select-btn">선택</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
