<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>강의 관리 페이지</title>
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css"
  />
  <style>
    :root {
      --wood-dark: #3e2723;
      --wood-medium: #5d4037;
      --wood-light: #8d6e63;
      --gold: #ffca28;
      --paper: #fff8e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DungGeunMo', sans-serif;
      background-color: #f5efe6;
      margin: 0;
    }

    .header {
      background: var(--paper);
      border-bottom: 3px solid var(--wood-medium);
      padding: 30px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 53px;
      color: var(--wood-dark);
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
    }

    .back-btn {
      display: inline-block;
      padding: 14px 28px;
      border: 3px solid var(--wood-dark);
      background: var(--paper);
      color: var(--wood-dark);
      text-decoration: none !important;
      font-weight: bold;
      font-size: 20px;
      font-family: 'DungGeunMo';
      transition: 0.1s;
    }

    .back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--wood-dark);
    }

    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--wood-dark);
    }

    .container {
      padding: 30px 40px 60px;
    }

    .filter-wrap {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .filter-btn {
      display: inline-block;
      width: 160px;
      text-align: center;
      padding: 22px 0;
      background: var(--paper);
      color: var(--wood-dark);
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid var(--wood-medium);
      outline: 1px solid transparent;
      transition: 0.1s;
      font-family: 'DungGeunMo';
    }

    .filter-btn.active {
      outline: 1px solid var(--wood-dark);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--wood-dark);
    }

    .filter-btn:hover:not(.active) {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--wood-dark);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper);
      border: 3px solid var(--wood-medium);
      outline: 1px solid var(--wood-dark);
      table-layout: fixed;
    }

    th, td {
      border: 2px solid var(--wood-dark);
      text-align: center;
      padding: 16px 12px;
      font-size: 18px;
      vertical-align: middle;
      color: var(--wood-dark);
    }

    th {
      background: var(--wood-light);
      color: var(--paper);
      font-weight: bold;
    }

    .description-cell {
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-form {
      margin: 0;
    }

    .select-btn {
      padding: 10px 18px;
      border: 3px solid var(--wood-dark);
      background: var(--paper);
      font-weight: bold;
      cursor: pointer;
      font-family: 'DungGeunMo';
      color: var(--wood-dark);
      transition: 0.1s;
    }

    .select-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--wood-dark);
    }

    .select-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--wood-dark);
    }

    .description {
      margin-top: 40px;
      font-size: 20px;
      color: var(--wood-dark);
    }
  </style>

  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="header">
  <h1>강의 관리 페이지</h1>
  <a th:href="@{/admin/main}" class="back-btn">메인으로</a>
</div>

<div class="container">

  <div class="filter-wrap">
    <a th:href="@{/admin/coursecare}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'ALL'} ? ' active' : ''">
      전체
    </a>

    <a th:href="@{/admin/coursecare(status='OPEN')}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'OPEN'} ? ' active' : ''">
      활성화
    </a>

    <a th:href="@{/admin/coursecare(status='CLOSED')}"
       class="filter-btn"
       th:classappend="${selectedStatus == 'CLOSED'} ? ' active' : ''">
      비활성화
    </a>
  </div>

  <table>
    <thead>
    <tr>
      <th style="width: 8%;">번호</th>
      <th style="width: 16%;">강의명</th>
      <th style="width: 12%;">강사명</th>
      <th style="width: 34%;">강의 설명</th>
      <th style="width: 16%;">개설일</th>
      <th style="width: 8%;">공개 상태</th>
      <th style="width: 6%;">상세 보기</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(courseList)}">
      <td colspan="7">조회된 강의가 없습니다.</td>
    </tr>

    <tr th:each="course, stat : ${courseList}">
      <td th:text="${stat.index + 1}">1</td>
      <td th:text="${course.courseTitle}">자바 기초</td>
      <td th:text="${course.teacherName}">김철수</td>
      <td th:text="${course.courseDescription}" class="description-cell">강의 설명</td>
      <td th:text="${course.courseCreatedAt}">2026-04-15 11:00</td>
      <td th:text="${course.courseStatusLabel}">활성화</td>
      <td>
        <form th:action="@{/admin/coursecare/detail}" method="post" class="select-form">
          <input type="hidden" name="courseId" th:value="${course.courseId}">
          <button type="submit" class="select-btn">선택</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
