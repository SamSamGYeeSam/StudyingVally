<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
        }

        .back-btn {
            display: inline-block;
            padding: 14px 28px;
            border: 3px solid #111;
            background-color: #c9ef7a;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .container {
            padding: 30px 40px 60px;
        }

        .filter-wrap {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .filter-btn {
            display: inline-block;
            width: 140px;
            text-align: center;
            padding: 22px 0;
            background-color: #e7d466;
            color: #111;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid transparent;
        }

        .filter-btn.active {
            border: 3px solid #111;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }

        th, td {
            border: 3px solid #111;
            text-align: center;
            padding: 18px 12px;
            font-size: 18px;
        }

        th {
            background-color: #f7f7f7;
        }

        .select-form {
            margin: 0;
        }

        .select-btn {
            padding: 10px 18px;
            border: 2px solid #111;
            background-color: #c9ef7a;
            font-weight: bold;
            cursor: pointer;
        }

        .description {
            margin-top: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>사용자 관리 페이지</h1>
    <a th:href="@{/admin/main}" class="back-btn">돌아가기</a>
</div>

<div class="container">

    <div class="filter-wrap">
        <a th:href="@{/admin/usercare}"
           class="filter-btn"
           th:classappend="${selectedFilter == 'ALL'} ? ' active' : ''">
            전체
        </a>

        <a th:href="@{/admin/usercare/teacher}"
           class="filter-btn"
           th:classappend="${selectedFilter == 'TEACHER'} ? ' active' : ''">
            선생님
        </a>

        <a th:href="@{/admin/usercare/student}"
           class="filter-btn"
           th:classappend="${selectedFilter == 'STUDENT'} ? ' active' : ''">
            학생
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>회원번호</th>
            <th>이름</th>
            <th>닉네임</th>
            <th>전화번호</th>
            <th>역할</th>
            <th>계정 상태</th>
            <th>선택</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(userList)}">
            <td colspan="7">조회된 사용자가 없습니다.</td>
        </tr>

        <tr th:each="user : ${userList}">
            <td th:text="${user.userNo}">1</td>
            <td th:text="${user.userName}">홍길동</td>
            <td th:text="${user.userNickname}">닉네임</td>
            <td th:text="${user.userPhoneNumber}">010-0000-0000</td>
            <td th:text="${user.userRoleLabel}">학생</td>
            <td th:text="${user.userStatusLabel}">활성화</td>
            <td>
                <form th:action="@{/admin/usercare/detail}" method="post" class="select-form">
                    <input type="hidden" name="userNo" th:value="${user.userNo}">
                    <button type="submit" class="select-btn">선택</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="description">
        사용자 관리 페이지에서는 전체 회원을 조회할 수 있으며, 선생님과 학생 기준으로 필터링할 수 있습니다.
        계정 상태 변경은 상세 페이지에서 처리합니다.
    </div>
</div>

</body>
</html>
