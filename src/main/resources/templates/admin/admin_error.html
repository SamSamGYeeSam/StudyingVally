<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>관리자 오류</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #efefef;
    }

    .wrapper {
      width: 95%;
      max-width: 900px;
      margin: 80px auto;
      background-color: #fff;
      border: 4px solid #111;
      padding: 40px;
      text-align: center;
    }

    .title {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .message {
      font-size: 22px;
      color: #c62828;
      margin-bottom: 32px;
      white-space: pre-wrap;
    }

    .btn-back {
      display: inline-block;
      background-color: #111;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="title">관리자 오류</div>
  <div class="message" th:text="${errorMessage}">오류 메시지</div>
  <a th:href="@{/admin/main}" class="btn-back">관리자 메인으로 돌아가기</a>
</div>
</body>
</html>
