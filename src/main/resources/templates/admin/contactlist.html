<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>문의함 목록</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .top-button,
        .select-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .select-button {
            padding: 8px 16px;
            font-size: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .list-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        .list-table th,
        .list-table td {
            border: 2px solid #222;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        .list-table th {
            background-color: #f3f3f3;
        }

        .left {
            text-align: left !important;
        }

        .empty-text {
            text-align: center;
            font-size: 20px;
            color: #666;
            padding: 40px 0;
        }

        .status-pending {
            font-weight: bold;
        }

        .status-resolved {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">문의함 목록</h1>
</div>

<div class="container">
    <div class="content-box">
        <div class="content-header">
            <h2 class="content-title">문의함 목록</h2>
            <a th:href="@{/admin/callcenter}" class="top-button">돌아가기</a>
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(contactList)}">
            <table class="list-table">
                <thead>
                <tr>
                    <th style="width: 90px;">번호</th>
                    <th>문의 제목</th>
                    <th style="width: 140px;">유저 이름</th>
                    <th style="width: 140px;">유저 닉네임</th>
                    <th style="width: 120px;">처리 상태</th>
                    <th style="width: 180px;">답변 일시</th>
                    <th style="width: 120px;">선택</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contact, status : ${contactList}">
                    <td th:text="${status.count}">1</td>

                    <td class="left" th:text="${contact.questionTitle}">문의 제목</td>
                    <td th:text="${contact.userName}">홍길동</td>
                    <td th:text="${contact.userNickname}">길동이</td>

                    <td th:text="${contact.questionStatusLabel}"
                        th:classappend="${contact.questionStatusLabel == '완료'} ? ' status-resolved' : ' status-pending'">
                        대기
                    </td>

                    <td th:text="${contact.questionAnsweredAt != null ? #temporals.format(contact.questionAnsweredAt, 'yyyy-MM-dd HH:mm') : '-'}">
                        -
                    </td>

                    <td>
                        <a th:href="@{/admin/callcenter/contactdetail(questionTechNo=${contact.questionTechNo})}"
                           class="select-button">
                            선택
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-text" th:if="${#lists.isEmpty(contactList)}">
            조회된 문의가 없습니다.
        </div>
    </div>
</div>

</body>
</html>
