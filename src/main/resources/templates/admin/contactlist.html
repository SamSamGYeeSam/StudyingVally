<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>문의함 목록</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css"
    />
    <style>
        :root {
          --wood-dark: #3e2723;
          --wood-medium: #5d4037;
          --wood-light: #8d6e63;
          --gold: #ffca28;
          --paper: #fff8e1;
        }

        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DungGeunMo', sans-serif;
            background-color: #f5efe6;
            margin: 0;
        }

        .header {
            background: var(--paper);
            border-bottom: 3px solid var(--wood-medium);
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 53px;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            display: inline-block;
            padding: 14px 28px;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
            text-decoration: none !important;
            font-weight: bold;
            font-size: 20px;
            font-family: 'DungGeunMo';
            transition: 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .back-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .container {
            padding: 30px 40px 60px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--paper);
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
        }

        th, td {
            border: 2px solid var(--wood-dark);
            text-align: center;
            padding: 18px 12px;
            font-size: 20px;
            color: var(--wood-dark);
        }

        th {
            background: var(--wood-light);
            color: var(--paper);
            font-weight: bold;
        }

        .left {
            text-align: left !important;
        }

        .select-btn {
            padding: 10px 18px;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            font-weight: bold;
            cursor: pointer;
            font-family: 'DungGeunMo';
            color: var(--wood-dark);
            transition: 0.1s;
            text-decoration: none !important;
            display: inline-block;
        }

        .select-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--wood-dark);
        }

        .select-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .status-pending {
            font-weight: bold;
            color: var(--wood-dark);
        }

        .status-resolved {
            font-weight: bold;
            color: var(--wood-dark);
        }

        .description {
            margin-top: 40px;
            font-size: 20px;
            color: var(--wood-dark);
        }
    </style>

    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="header">
    <h1>문의함 목록</h1>
    <a th:href="@{/admin/callcenter}" class="back-btn">이전으로</a>
</div>

<div class="container">

    <table>
        <thead>
        <tr>
            <th style="width: 8%;">번호</th>
            <th>문의 제목</th>
            <th style="width: 12%;">유저 이름</th>
            <th style="width: 12%;">유저 닉네임</th>
            <th style="width: 10%;">처리 상태</th>
            <th style="width: 16%;">답변 일시</th>
            <th style="width: 8%;">상세 보기</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(contactList)}">
            <td colspan="7">조회된 문의가 없습니다.</td>
        </tr>

        <tr th:each="contact, status : ${contactList}">
            <td th:text="${status.count}">1</td>

            <td class="left" th:text="${contact.questionTitle}">문의 제목</td>
            <td th:text="${contact.userName}">홍길동</td>
            <td th:text="${contact.userNickname}">길동이</td>

            <td th:text="${contact.questionStatusLabel}"
                th:classappend="${contact.questionStatusLabel == '완료'} ? ' status-resolved' : ' status-pending'">
                대기
            </td>

            <td th:text="${contact.questionAnsweredAt != null ? #temporals.format(contact.questionAnsweredAt, 'yyyy-MM-dd HH:mm') : '-'}">
                -
            </td>

            <td>
                <a th:href="@{/admin/callcenter/contactdetail(questionTechNo=${contact.questionTechNo})}"
                   class="select-btn">
                    선택
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
