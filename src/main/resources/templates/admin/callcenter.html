<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객센터 관리 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header-inner {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-path {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
        }

        .header-title {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        /* 🔥 추가된 버튼 영역 */
        .header-buttons {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 10px;
        }

        .back-button {
            background-color: #666;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-main-button {
            background-color: #111;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .menu-link {
            display: flex;
            text-decoration: none;
            color: black;
        }

        .menu-left {
            width: 360px;
            background-color: #e7d469;
            min-height: 160px;
            padding: 18px 24px;
        }

        .menu-right {
            flex: 1;
            background-color: white;
            border: 4px solid #111;
            min-height: 160px;
            padding: 24px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-path {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .menu-title {
            font-size: 54px;
            font-weight: bold;
        }

        .menu-desc-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .menu-desc {
            font-size: 20px;
            color: #333;
        }

        .move-button {
            background-color: #111;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .bottom-text {
            text-align: center;
            font-size: 28px;
            margin: 28px 0 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">

        <h1 class="header-title" th:text="${pageTitle}">
            고객센터 관리 페이지
        </h1>

        <div class="header-buttons">
            <a th:href="@{/admin/main}" class="back-button">
                뒤로가기
            </a>

        </div>

    </div>
</div>

<div class="container">

    <a th:href="@{/admin/callcenter/notice}" class="menu-link">
        <div class="menu-left">
            <div class="menu-title">1. 공지사항</div>
        </div>
        <div class="menu-right">
            <div>
                <div class="menu-desc-title">공지사항</div>
            </div>
            <span class="move-button">이동</span>
        </div>
    </a>

    <a th:href="@{/admin/callcenter/contact}" class="menu-link">
        <div class="menu-left">
            <div class="menu-title">2. 문의함</div>
        </div>
        <div class="menu-right">
            <div>
                <div class="menu-desc-title">문의함</div>
            </div>
            <span class="move-button">이동</span>
        </div>
    </a>

    <a th:href="@{/admin/callcenter/report}" class="menu-link">
        <div class="menu-left">
            <div class="menu-title">3. 신고함</div>
        </div>
        <div class="menu-right">
            <div>
                <div class="menu-desc-title">신고함</div>
            </div>
            <span class="move-button">이동</span>
        </div>
    </a>

</div>


</body>
</html>
