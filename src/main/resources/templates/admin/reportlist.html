<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신고함 목록</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efefef;
        }

        .header {
            background-color: #c9ef7a;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 52px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1500px;
            margin: 30px auto;
        }

        .content-box {
            border: 4px solid #111;
            background-color: #fff;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .top-button {
            display: inline-block;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .list-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        .list-table th,
        .list-table td {
            border: 2px solid #222;
            padding: 12px;
            text-align: center;
        }

        .list-table th {
            background-color: #f3f3f3;
        }

        .left {
            text-align: left !important;
        }

        .empty-text {
            text-align: center;
            font-size: 20px;
            color: #666;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${pageTitle}">신고함 목록</h1>
</div>

<div class="container">
    <div class="content-box">
        <div class="content-header">
            <h2 class="content-title">신고함 목록</h2>
            <a th:href="@{/admin/callcenter}" class="top-button">돌아가기</a>
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(reportList)}">
            <table class="list-table">
                <thead>
                <tr>
                    <th style="width: 90px;">번호</th>
                    <th style="width: 220px;">신고 제목</th>
                    <th>신고 내용</th>
                    <th style="width: 110px;">신고자 번호</th>
                    <th style="width: 120px;">처리상태</th>
                    <th>처리 답변</th>
                    <th style="width: 120px;">처리 관리자</th>
                    <th style="width: 180px;">처리일시</th>
                    <th style="width: 180px;">답변수정일시</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reportList}">
                    <td th:text="${report.displayNo}">15</td>
                    <td class="left" th:text="${report.reportTitle}">욕설 신고</td>
                    <td class="left" th:text="${report.reportDesc}">게시판에서 욕설 사용</td>
                    <td th:text="${report.userNo}">6</td>
                    <td th:text="${report.reportStatus}">PENDING</td>
                    <td class="left" th:text="${report.reportAnswer}">처리 답변</td>
                    <td th:text="${report.processedAdminNo}">1</td>
                    <td th:text="${report.reportProcessedAt}">2026-04-16T10:00</td>
                    <td th:text="${report.reportAnswerUpdatedAt}">2026-04-16T10:30</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-text" th:if="${#lists.isEmpty(reportList)}">
            조회된 신고 내역이 없습니다.
        </div>
    </div>
</div>

</body>
</html>
