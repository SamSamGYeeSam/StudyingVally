<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리 상세 페이지</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css"
    />
    <style>
        :root {
          --wood-dark: #3e2723;
          --wood-medium: #5d4037;
          --wood-light: #8d6e63;
          --gold: #ffca28;
          --paper: #fff8e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DungGeunMo', sans-serif;
            background-color: #f5efe6;
            margin: 0;
        }

        .header {
            background: var(--paper);
            border-bottom: 3px solid var(--wood-medium);
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 53px;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            display: inline-block;
            padding: 14px 28px;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
            text-decoration: none !important;
            font-weight: bold;
            font-size: 20px;
            font-family: 'DungGeunMo';
            transition: 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .back-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .container {
            padding: 30px 40px 50px;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .left-panel {
            width: 25%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .center-panel {
            width: 47%;
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
            background: var(--paper);
            min-height: 550px;
            padding: 24px;
        }

        .right-panel {
            width: 28%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box {
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
            background: var(--paper);
            padding: 22px;
            text-align: center;
        }

        .photo-box {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--wood-dark);
        }

        .info-box {
            min-height: 80px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--wood-dark);
        }

        .count-box {
            min-height: 90px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            color: var(--wood-dark);
        }

        .course-title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--wood-dark);
        }

        .course-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .course-list li {
            border: 2px solid var(--wood-dark);
            margin-bottom: 12px;
            padding: 14px 18px;
            font-size: 20px;
            background: #fff;
            color: var(--wood-dark);
        }

        .empty-course {
            text-align: center;
            font-size: 20px;
            margin-top: 80px;
            color: var(--wood-dark);
        }

        .button-form {
            margin: 0;
        }

        .action-btn {
            width: 100%;
            padding: 18px 0;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'DungGeunMo';
            color: var(--wood-dark);
            transition: 0.1s;
        }

        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 18px 0;
            border: 3px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
            text-decoration: none !important;
            font-size: 22px;
            font-weight: bold;
            transition: 0.1s;
        }

        .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--wood-dark);
        }

        .back-link:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--wood-dark);
        }

        .status-text {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 16px;
            border: 3px solid var(--wood-medium);
            outline: 1px solid var(--wood-dark);
            background: var(--paper);
            color: var(--wood-dark);
        }

        .bottom-description {
            margin-top: 26px;
            font-size: 20px;
            text-align: center;
            color: var(--wood-dark);
        }


.photo-box {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.user-photo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
}
    </style>

    <script>
        function submitOnce(form) {
            const button = form.querySelector('button[type="submit"]');

            if (button.dataset.submitted === "true") {
                return false;
            }

            button.dataset.submitted = "true";
            button.disabled = true;
            button.textContent = "처리 중...";
            return true;
        }
    </script>

    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="header">
    <h1>사용자 관리 상세 페이지</h1>
    <a th:href="@{/admin/usercare}" class="back-btn">이전으로</a>
</div>

<div class="container">
    <div class="layout">

        <div class="left-panel">
            <div class="box photo-box">
                <img th:if="${userDetail != null and 'F'.equals(#strings.trim(userDetail.userGender))}"
                     th:src="@{/image/f-front.png}" alt="Female" class="user-photo">

                <img th:if="${userDetail != null and 'M'.equals(#strings.trim(userDetail.userGender))}"
                     th:src="@{/image/m-front.png}" alt="Male" class="user-photo">
            </div>
            <div class="box info-box" th:text="${userDetail.userName}">이름</div>
            <div class="box info-box"
                 th:text="${userDetail.userGender == 'M' ? '남성' : '여성'}">
                성별
            </div>
            <div class="box info-box" th:text="${userDetail.userNickname}">닉네임</div>
            <div class="box info-box" th:text="${userDetail.userPhoneNumber}">전화번호</div>
        </div>

        <div class="center-panel">
            <div class="course-title" th:text="${userDetail.courseSectionTitle}">강의 목록</div>

            <ul class="course-list" th:if="${not #lists.isEmpty(userDetail.courseTitleList)}">
                <li th:each="courseTitle : ${userDetail.courseTitleList}" th:text="${courseTitle}">
                    강의 제목
                </li>
            </ul>

            <div class="empty-course" th:if="${#lists.isEmpty(userDetail.courseTitleList)}">
                조회된 강의가 없습니다.
            </div>
        </div>

        <div class="right-panel">
            <div class="box count-box">
                <div>문의 내역 수</div>
                <div th:text="${userDetail.inquiryCount}">0</div>
            </div>

            <div class="box count-box">
                <div>신고 내역 수</div>
                <div th:text="${userDetail.reportCount}">0</div>
            </div>

            <div class="status-text">
                역할:
                <span th:text="${userDetail.userRoleLabel}">학생</span>
            </div>

            <div class="status-text">
                계정 상태:
                <span th:text="${userDetail.userStatusLabel}">활성화</span>
            </div>

            <form th:action="@{/admin/usercare/enable}" method="post" class="button-form" onsubmit="return submitOnce(this);">
                <input type="hidden" name="userNo" th:value="${userDetail.userNo}">
                <button type="submit" class="action-btn">활성화</button>
            </form>

            <form th:action="@{/admin/usercare/disable}" method="post" class="button-form" onsubmit="return submitOnce(this);">
                <input type="hidden" name="userNo" th:value="${userDetail.userNo}">
                <button type="submit" class="action-btn">비활성화</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
