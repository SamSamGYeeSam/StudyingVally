<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 상세 조회</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        /* 메인 테마 색상 변수 */
        :root {
            --primary-color: #ff3333;
            --primary-glow: rgba(255, 51, 51, 0.6);
            --bg-color: #0f0f13;
            --card-bg: rgba(30, 30, 35, 0.85);
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #2a0808 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e0e0e0;
        }

        /* 상세 정보 카드 디자인 */
        .detail-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 550px;
            animation: fadeUp 0.5s ease-out; /* 등장 애니메이션 */
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 15px var(--primary-glow);
            letter-spacing: 1px;
        }

        /* 테이블 디자인 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden; /* 모서리 둥글게 적용하기 위함 */
        }

        th, td {
            padding: 18px 12px;
            text-align: center;
        }

        th {
            background-color: rgba(255, 51, 51, 0.1);
            color: var(--primary-color);
            font-weight: 700;
            font-size: 14px;
            border-bottom: 2px solid rgba(255, 51, 51, 0.3);
            white-space: nowrap;
        }

        td {
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s ease;
        }

        /* 행 마우스 오버 효과 */
        tr:hover td {
            background-color: rgba(255, 255, 255, 0.03);
            color: #ffffff;
        }

        /* 뒤로 가기 버튼 */
        .btn-back {
            display: block;
            width: 100%;
            background: transparent;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            color: #ffffff;
            border-color: var(--primary-color);
            background: rgba(255, 51, 51, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="detail-card">
    <h1>😈 메뉴 상세 정보 😈</h1>

    <table>
        <tr>
            <th>메뉴번호</th>
            <th>메뉴이름</th>
            <th>메뉴가격</th>
            <th>카테고리</th>
            <th>판매상태</th>
        </tr>
        <tr>
            <td th:text="${result.menuCode}"></td>
            <td th:text="${result.menuName}"></td>
            <td th:text="${result.menuPrice}"></td>
            <td th:text="${result.categoryCode}"></td>
            <td th:text="${result.orderableStatus}"></td>
        </tr>
    </table>

    <button class="btn-back" onclick="history.back()">뒤로 가기</button>
</div>

</body>
</html>
