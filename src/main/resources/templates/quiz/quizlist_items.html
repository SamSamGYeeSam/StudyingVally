<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 퀴즈 문제 목록</title>
    <link rel="stylesheet" th:href="@{/css/quizitemlist.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <h2 class="pixel-title">📋 퀴즈 상세 문제 리스트</h2>

    <!-- 배점 합계 패널 -->
    <div th:with="totalScore=${#aggregates.sum(quizItems.![quizScore]) ?: 0}" class="total-score-panel">
        현재 배점 합계 :
        <span th:class="${totalScore == 100 ? 'score-ok' : 'score-warn'}"
              th:text="${totalScore} + ' / 100점'"></span>
    </div>

    <div class="list-wrapper">
        <ul th:if="${not #lists.isEmpty(quizItems)}">
            <li th:each="item, stat : ${quizItems}" class="quiz-item">
                <div>
                    <strong th:text="'Q' + ${stat.count} + '. '" style="color: #ffca28;"></strong>
                    <span th:text="${item.quizTitle}"></span>
                </div>
                <span class="quiz-score-tag" th:text="${item.quizScore} + '점'"></span>
            </li>
        </ul>

        <div th:if="${#lists.isEmpty(quizItems)}" style="color: #999; text-align: center; padding-top: 80px;">
            등록된 문제가 없습니다. 🌵
        </div>
    </div>

    <div class="footer-area">
        <button type="button" class="pixel-btn" onclick="location.href='/teacher/quiz/find-quiz-by-chap'">
            🔙 이전으로
        </button>

        <!-- 문제가 없을 때 등록 버튼 -->
        <form th:if="${#lists.isEmpty(quizItems)}" action="/teacher/quiz/regist-quizlist-form-post" method="post">
            <input type="hidden" name="quizNo" th:value="${quizNo}">
            <button type="submit" class="pixel-btn btn-add">+ 새 문제 일괄 등록</button>
        </form>

        <!-- 문제가 있을 때 수정 버튼 -->
        <form th:if="${not #lists.isEmpty(quizItems)}" action="/teacher/quiz/update-quizlist-form-post" method="post">
            <input type="hidden" name="quizNo" th:value="${quizNo}">
            <button type="submit" class="pixel-btn btn-edit">전체 문제 일괄 수정</button>
        </form>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
