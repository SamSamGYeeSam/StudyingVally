<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 문제 목록</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 퀴즈 목록으로 돌아가기</button>
<h2>퀴즈 상세 (문제 리스트)</h2>

<ul>
    <li th:each="item : ${quizItems}">
        <form action="/teacher/quiz/update-quizlist-form-post" method="post" style="display:inline;">
            <input type="hidden" name="quizListNo" th:value="${item.quizListNo}">
            <button type="submit" style="cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:16px;" th:text="${item.quizTitle}"></button>
        </form>
    </li>
</ul>

<div th:if="${#lists.isEmpty(quizItems)}" style="color: gray; margin-bottom: 20px;">등록된 문제가 없습니다.</div>

<form action="/teacher/quiz/regist-quizlist-form-post" method="post">
    <input type="hidden" name="quizNo" th:value="${quizNo}">
    <button type="submit">+ 새 문제 등록하기</button>
</form>
</body>
</html>
