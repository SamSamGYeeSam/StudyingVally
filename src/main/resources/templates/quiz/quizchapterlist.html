<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 챕터 목록</title>
</head>
<body>
<button type="button" onclick="location.href='/teacher/teachermain'" style="margin-bottom: 20px; padding: 10px; cursor: pointer;">
    메인페이지로 돌아가기
</button>
<h2>해당 강의의 챕터 목록</h2>

<ul>
    <li th:each="quizChapter : ${quizChapterList}">
        <form action="/teacher/quiz/find-quiz-by-chap-post" method="post" style="display:inline;">
            <input type="hidden" name="chapNo" th:value="${quizChapter.chapNo}">
            <button type="submit" style="cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:16px;" th:text="${quizChapter.chapTitle}"></button>
        </form>
    </li>
</ul>

<div th:if="${#lists.isEmpty(quizChapterList)}" style="color: gray;">등록된 챕터가 없습니다.</div>
</body>
</html>
