<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 퀴즈 챕터 선택</title>
    <link rel="stylesheet" th:href="@{/css/quizchapterlist.css}">
</head>
<body>

<div class="room-container">
    <h2 class="pixel-title">📝 퀴즈 관리 - 챕터 선택</h2>

    <div class="list-wrapper">
        <ul th:if="${not #lists.isEmpty(quizChapterList)}">
            <li th:each="quizChapter : ${quizChapterList}">
                <form action="/teacher/quiz/find-quiz-by-chap-post" method="post">
                    <input type="hidden" name="chapNo" th:value="${quizChapter.chapNo}">
                    <button type="submit" class="chapter-item-btn">
                        <span th:text="${quizChapter.chapTitle}"></span>
                    </button>
                </form>
            </li>
        </ul>

        <!-- 데이터가 없을 경우 -->
        <div th:if="${#lists.isEmpty(quizChapterList)}" class="empty-msg">
            등록된 챕터가 없습니다. 🏜️
        </div>
    </div>

    <div class="footer-area">
        <button type="button" class="pixel-btn" onclick="location.href='/teacher/teachermain'">
            🏠 메인으로
        </button>
    </div>
</div>

</body>
</html>
