<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 던전 입장</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 퀴즈방 배경 컨테이너 */
        .dungeon-container {
            position: relative;
            width: 900px;
            height: 550px;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            background-image: url('/image/quiz-bg.png');
            background-size: cover;
            background-position: center;
        }

        /* 드래곤 캐릭터 */
        .dragon-npc {
            position: absolute;
            bottom: 160px; /* 버튼 공간 확보 */
            right: 150px;
            width: 280px;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.4));
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-5px); }
        }

        /* 말풍선 영역 */
        .dialogue-box {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #000;
            border-radius: 40px 40px 5px 40px;
            padding: 20px 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .dialogue-text {
            font-size: 19px;
            line-height: 1.5;
            color: #1a1a1a;
            margin: 0;
        }

        .npc-name {
            position: absolute;
            top: -15px;
            left: 50px;
            background: #000;
            color: #ff4500;
            padding: 5px 15px;
            font-size: 16px;
            border: 2px solid #fff;
        }

        /* 하단 버튼 그룹 스타일 수정 (요청하신 스타일 반영) */
        .btn-group {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn-group button {
            font-family: 'DungGeunMo';
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: 3px solid #000; /* 테두리 3px */
            box-shadow: 4px 4px 0 #000; /* 그림자 4px */
            transition: 0.1s;
        }

        /* 클릭 시 애니메이션 */
        .btn-group button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .btn-group button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000;
        }

        /* 도망치기 버튼 (보조) */
        .btn-escape {
            background: #263238; /* 뒤로가기 버튼 색상 통일 */
            color: white;
        }
        .btn-escape:hover { background: #37474f; }

        /* 퀴즈 확인하기 버튼 (강조) */
        .btn-submit {
            background: #b71c1c; /* 시련의 붉은색 */
            color: white;
        }
        .btn-submit:hover { background: #d32f2f; }

        /* 상단 하트(라이프) 표시 */
        .life-container {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
        }
        .heart { width: 60px; image-rendering: pixelated; }

    </style>
</head>
<body>

<div class="dungeon-container">
    <div class="life-container">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
    </div>

    <img src="/image/dragon-icon.png" class="dragon-npc" alt="드래곤">

    <div class="dialogue-box">
        <span class="npc-name">붉은 용의 수호자</span>
        <p class="dialogue-text">
            "강의는 다 들었나? 문제를 풀면 상품을 주지.<br>
            대신 틀리면... 네 캐릭터는 이 던전에서 삭제될 것이다."
        </p>
    </div>

    <div class="btn-group">
        <button type="button" class="btn-escape" onclick="location.href='/student/main'">
            🏃 도망치기 (뒤로가기)
        </button>

        <form action="/student/quiz/course" method="get" style="margin: 0;">
            <button type="submit" class="btn-submit">
                ⚔️ 퀴즈 확인하기
            </button>
        </form>
    </div>
</div>

</body>
</html>
