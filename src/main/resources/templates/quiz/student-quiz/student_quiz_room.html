<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 던전 입장</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 퀴즈방 배경 컨테이너 */
        .dungeon-container {
            position: relative;
            width: 900px;
            height: 550px;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            background-image: url('/image/quiz-bg.png'); /* 던전 배경 이미지 */
            background-size: cover;
            background-position: center;
        }

        /* 드래곤 캐릭터 (가만히 앉아있는 효과) */
        .dragon-npc {
            position: absolute;
            bottom: 120px;
            right: 150px;
            width: 280px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.4));
            animation: breathe 3s ease-in-out infinite;
        }

        /* 숨쉬는 듯한 움직임 애니메이션 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-5px); }
        }

        .dragon-npc:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.8));
        }

        /* 말풍선/물음표 영역 */
        .dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #000;
            border-radius: 40px 40px 5px 40px; /* 말풍선 꼬리 느낌 */
            padding: 25px 40px;
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .dialogue-box:hover {
            background: #fff;
            transform: translateX(-50%) translateY(-5px);
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.6;
            color: #1a1a1a;
            margin: 0;
        }

        .npc-name {
            position: absolute;
            top: -15px;
            left: 50px;
            background: #000;
            color: #ff4500;
            padding: 5px 15px;
            font-size: 16px;
            border: 2px solid #fff;
        }

        /* 상단 하트(라이프) 표시 */
        .life-container {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 0;
        }
        .heart {
            width: 60px;
            image-rendering: pixelated;
        }

        /* 투명 버튼 (용과 말풍선 전체 클릭 영역) */
        .hidden-submit {
            position: absolute;
            width: 100%;
            height: 100%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="dungeon-container">
    <!-- 라이프 표시 (이미지 느낌 살리기) -->
    <div class="life-container">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
        <img src="/image/pixel-heart.png" class="heart" alt="life">
    </div>

    <!-- 퀴즈 리스트로 이동하는 폼 -->
    <form action="/student/quiz/course" method="get">
        <!-- 용 이미지 -->
        <button type="submit" class="hidden-submit">
            <img src="/image/dragon-icon.png" class="dragon-npc" alt="드래곤">

            <!-- 말풍선 -->
            <div class="dialogue-box">
                <span class="npc-name">붉은 용의 수호자</span>
                <p class="dialogue-text">
                    "강의는 다 들었나? 문제를 풀면 상품을 주지.<br>
                    대신 틀리면... 네 캐릭터는 이 던전에서 삭제될 것이다."
                </p>
                <p style="font-size: 14px; color: #666; margin-top: 10px; text-align: right;">
                    [ 클릭하여 퀴즈 확인하기 ]
                </p>
            </div>
        </button>
    </form>
</div>

</body>
</html>
