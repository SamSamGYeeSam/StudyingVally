<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 던전 입장</title>
    <style>
        /* 기본 폰트 사용, 사진 배제, 무채색/어두운 톤 적용 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .dungeon-container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 2px solid #555;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 이미지 대신 텍스트 기호로 라이프 표현 */
        .life-container {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 24px;
            color: #ff5252;
            letter-spacing: 5px;
        }

        .npc-area {
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }

        .npc-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .dialogue-box {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 25px;
            border-radius: 8px;
            width: 70%;
            margin: 0 auto;
            text-align: left;
        }

        .npc-name {
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            font-size: 1.1em;
        }

        .dialogue-text {
            line-height: 1.6;
            margin: 0;
            font-size: 16px;
        }

        .btn-group {
            margin-top: 40px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: sans-serif;
        }

        button:hover {
            background-color: #555;
        }

        .btn-submit {
            background-color: #4a4a4a;
            border-color: #666;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: #666;
        }
    </style>
</head>
<body>

<div class="dungeon-container">
    <div class="life-container" id="lifeDisplay">
        ♥♥♥
    </div>

    <div class="npc-area">
        <div class="npc-icon">🐉</div>
        <div class="dialogue-box">
            <span class="npc-name">붉은 용의 수호자</span>
            <p class="dialogue-text">
                "강의는 다 들었나? 문제를 풀면 상품을 주지.<br>
                대신 틀리면... 네 캐릭터는 이 던전에서 삭제될 것이다."
            </p>
        </div>
    </div>

    <div class="btn-group">
        <button type="button" onclick="location.href='/student/main'">도망치기 (뒤로가기)</button>

        <form action="/student/quiz/course" method="get" style="margin: 0;">
            <button type="submit" class="btn-submit">퀴즈 확인하기</button>
        </form>
    </div>
</div>

</body>
</html>
