<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의 챕터 선택</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 강의 목록으로 돌아가기</button>
<h2>해당 강의의 챕터 목록</h2>
<p>문제를 풀 챕터를 선택해 주세요.</p>

<ul>
    <li th:each="chapter : ${chapterList}">
        <form action="/student/quiz/chapter-post" method="post" style="display:inline;">
            <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
            <button type="submit"
                    style="cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:18px; color:blue;"
                    th:text="${chapter.chapTitle}"></button>
        </form>
    </li>
</ul>

<div th:if="${#lists.isEmpty(chapterList)}" style="color: gray;">
    등록된 챕터가 없습니다.
</div>
</body>
</html>
