<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>챕터 선택 - Valley Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 던전 배경 유지 */
        .dungeon-container {
            position: relative;
            width: 900px;
            height: 550px;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            background-image: url('/image/quiz-bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 챕터 선택 패널 */
        .chapter-panel {
            width: 600px;
            max-height: 420px;
            background: rgba(26, 26, 26, 0.9);
            border: 4px solid #78909c;
            outline: 2px solid #000;
            padding: 30px;
            box-sizing: border-box;
            color: #eceff1;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #78909c;
            padding-bottom: 15px;
        }

        .header h2 { margin: 0; font-size: 22px; color: #4fc3f7; text-shadow: 2px 2px 0 #000; }
        .header p { margin: 8px 0 0; font-size: 14px; color: #cfd8dc; }

        /* 리스트 영역 */
        .chapter-list {
            overflow-y: auto;
            max-height: 280px;
            padding-right: 10px;
        }

        .chapter-list::-webkit-scrollbar { width: 6px; }
        .chapter-list::-webkit-scrollbar-thumb { background: #4fc3f7; }

        ul { list-style: none; padding: 0; margin: 0; }

        .chapter-item { margin-bottom: 10px; }

        /* 스테이지 버튼 스타일 */
        .stage-btn {
            width: 100%;
            padding: 15px 20px;
            background: #263238;
            border: 2px solid #455a64;
            color: #fff;
            font-family: 'DungGeunMo';
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }

        .stage-btn:hover {
            background: #37474f;
            border-color: #4fc3f7;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.3);
        }

        .stage-btn::before {
            content: 'STEP';
            font-size: 10px;
            color: #4fc3f7;
            margin-right: 15px;
            border: 1px solid #4fc3f7;
            padding: 2px 4px;
        }

        /* 뒤로가기 버튼 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: #263238;
            color: #fff;
            border: 2px solid #000;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 3px 3px 0 #000;
            z-index: 20;
        }
        .back-btn:hover { background: #37474f; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #90a4ae;
        }
    </style>
</head>
<body>

<div class="dungeon-container">
    <a href="javascript:history.back();" class="back-btn">⬅ 강의 목록으로</a>

    <div class="chapter-panel">
        <div class="header">
            <h2>🧭 세부 관문 선택</h2>
            <p>시련을 시작할 챕터를 결정하십시오.</p>
        </div>

        <div class="chapter-list">
            <ul>
                <li th:each="chapter : ${chapterList}" class="chapter-item">
                    <form action="/student/quiz/chapter-post" method="post">
                        <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
                        <button type="submit" class="stage-btn">
                            <span th:text="${chapter.chapTitle}">챕터 제목</span>
                        </button>
                    </form>
                </li>
            </ul>

            <!-- 데이터가 없을 때 -->
            <div th:if="${#lists.isEmpty(chapterList)}" class="empty-msg">
                <p>🌑 이 구역에는 준비된 시련이 없습니다.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
