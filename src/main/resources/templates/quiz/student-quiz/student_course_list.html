<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수강 중인 강의</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 뒤로 가기</button>
<h2><span th:text="${displayName}">사용자</span>님의 수강 강의</h2>
<p>퀴즈를 풀 강의를 선택해 주세요.</p>

<ul>
  <li th:each="course : ${enrolledCourses}">
    <form action="/student/quiz/course-post" method="post" style="display:inline;">
      <input type="hidden" name="courseId" th:value="${course.courseId}">
      <button type="submit"
              style="cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:18px; color:blue;"
              th:text="${course.courseTitle}"></button>
    </form>
  </li>
</ul>

<div th:if="${#lists.isEmpty(enrolledCourses)}" style="color: gray;">
  현재 수강 중인 강의가 없습니다.
</div>
</body>
</html>
