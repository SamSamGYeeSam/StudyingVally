<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 목록 선택</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 챕터 목록으로 돌아가기</button>
<h2>선택한 챕터의 퀴즈 목록</h2>
<p>도전할 퀴즈를 선택해 주세요.</p>

<ul style="list-style: none; padding-left: 0;">
    <li th:each="quiz : ${quizList}" style="margin-bottom: 15px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee;">
        <form action="/student/quiz/solve-post" method="post" style="display: flex; align-items: center; gap: 15px; margin: 0;">
            <input type="hidden" name="quizNo" th:value="${quiz.quizNo}">

            <button type="submit"
                    style="cursor:pointer; font-weight:bold; background:none; border:none; padding:0; font-size:18px; color:#1976d2; text-decoration:underline;">
                <span th:text="${quiz.quizTitle}">퀴즈 제목</span>
            </button>

            <span th:if="${scoreMap != null and scoreMap.containsKey(quiz.quizNo)}"
                  th:text="'💯 내 점수 : ' + ${scoreMap.get(quiz.quizNo)} + '점'"
                  style="color: #e65100; font-size: 15px; font-weight: bold; background: #fff3e0; padding: 4px 10px; border-radius: 20px;"></span>

            <span th:unless="${scoreMap != null and scoreMap.containsKey(quiz.quizNo)}"
                  style="color: #999; font-size: 14px; font-weight: bold; background: #eee; padding: 4px 10px; border-radius: 20px;">(미응시)</span>
        </form>
    </li>
</ul>

<div th:if="${#lists.isEmpty(quizList)}" style="color: gray;">
    등록된 퀴즈가 없습니다.
</div>
</body>
</html>
