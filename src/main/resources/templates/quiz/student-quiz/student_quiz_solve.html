<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 서바이벌</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; color: #333; background-color: #f4f4f4; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-container { width: 100%; max-width: 600px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; text-align: center; }

        /* 헤더: 목숨 및 진행도 */
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .lives { font-size: 24px; letter-spacing: 5px; }
        .progress { font-size: 14px; color: #888; font-weight: bold; }

        /* 문제 카드 영역 */
        .question-card { display: none; text-align: left; }
        .question-card.active { display: block; animation: fadeIn 0.4s ease-out; }

        .q-title { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #000; }
        .q-desc { font-size: 16px; color: #666; background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; line-height: 1.6; }

        /* 입력창 및 버튼 */
        .answer-input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border-color 0.3s; outline: none; margin-bottom: 20px; }
        .answer-input:focus { border-color: #333; }
        .next-btn { width: 100%; padding: 18px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .next-btn:hover { background: #333; }

        /* 결과 화면 */
        #game-screen { display: block; }
        #result-screen { display: none; padding: 30px 0; }
        .status-msg { font-size: 35px; font-weight: 900; margin-bottom: 10px; }
        .character-img { font-size: 80px; margin: 20px 0; animation: bounce 1s infinite alternate; }
        .result-text { font-size: 20px; font-weight: bold; line-height: 1.5; margin-bottom: 40px; color: #444; }
        .action-btn { padding: 15px 40px; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-screen">
        <div class="game-header">
            <div class="progress">QUESTION <span id="current-idx-text">1</span> / <span th:text="${#lists.size(quizItems)}">0</span></div>
            <div class="lives" id="lives-display">❤️❤️❤️</div>
        </div>

        <div th:if="${#lists.isEmpty(quizItems)}" style="color: gray;">문제가 없습니다.</div>

        <div th:each="item, stat : ${quizItems}" class="question-card" th:classappend="${stat.first} ? 'active' : ''" th:id="'card-' + ${stat.index}">
            <div class="q-title" th:text="${item.quizTitle}">문제 제목</div>
            <div class="q-desc" th:text="${item.quizDesc}">문제 설명</div>
            <input type="text" th:id="'input-' + ${stat.index}" class="answer-input" placeholder="정답을 입력하세요" onkeypress="if(event.keyCode==13) checkAnswer()">
            <input type="hidden" th:id="'correct-' + ${stat.index}" th:value="${item.quizAnswer}">

            <button type="button" class="next-btn" onclick="checkAnswer()">정답 확인 / 다음 문제</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="status-msg" id="status-title"></div>
        <div class="character-img" id="status-character"></div>
        <div class="result-text" id="status-desc"></div>
        <a href="#" id="action-link" class="action-btn">돌아가기</a>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    let currentIndex = 0;
    let lives = 3;
    let correctCount = 0; // 맞힌 문제 수를 저장할 변수 추가

    const totalQuestions = /*[[${#lists.size(quizItems)}]]*/ 0;
    const currentQuizNo = /*[[${quizNo}]]*/ ''; // 현재 풀고 있는 퀴즈 번호

    function checkAnswer() {
        if (currentIndex >= totalQuestions) return;

        const userInput = document.getElementById('input-' + currentIndex).value.trim();
        const correctAnswer = document.getElementById('correct-' + currentIndex).value.trim();

        if (userInput === correctAnswer) {
            alert("⭕ 정답입니다!");
            correctCount++; // 정답일 경우 점수 +1
            nextQuestion();
        } else {
            reduceLife();
        }
    }

    function reduceLife() {
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
            // 서버에 'GAME_OVER'로 점수 저장 후 화면 전환
            saveScoreToServer("GAME_OVER", function() {
                showGameOver();
            });
        } else {
            alert("❌ 틀렸습니다! 목숨이 " + lives + "개 남았습니다.\n다음 문제로 넘어갑니다.");
            nextQuestion();
        }
    }

    function updateLivesDisplay() {
        document.getElementById('lives-display').innerText = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    }

    function nextQuestion() {
        document.getElementById('card-' + currentIndex).classList.remove('active');
        currentIndex++;

        if (currentIndex < totalQuestions) {
            document.getElementById('card-' + currentIndex).classList.add('active');
            document.getElementById('current-idx-text').innerText = currentIndex + 1;
            document.getElementById('input-' + currentIndex).focus();
        } else {
            // 끝까지 풀었다면 'CLEAR'로 점수 저장 후 화면 전환
            saveScoreToServer("CLEAR", function() {
                showVictory();
            });
        }
    }

    // 서버로 점수를 전송하는 AJAX 함수
    function saveScoreToServer(resultStatus, callbackFunc) {
        fetch('/student/quiz/submit-score', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                quizScore: correctCount, // 맞힌 개수
                quizResult: resultStatus, // "CLEAR" or "GAME_OVER"
                quizNo: currentQuizNo    // 현재 퀴즈 번호
            })
        })
            .then(response => response.text())
            .then(data => {
                console.log("점수 저장 완료:", data);
                callbackFunc(); // 저장이 끝나면 화면(게임오버/빅토리)을 띄움
            })
            .catch(error => {
                console.error("점수 저장 실패:", error);
                callbackFunc(); // 에러가 나도 화면은 띄워줌
            });
    }

    function showGameOver() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('status-title').innerText = 'GAME OVER';
        document.getElementById('status-title').style.color = '#e74c3c';
        document.getElementById('status-character').innerText = '🐯💢';
        document.getElementById('status-desc').innerHTML = '"이 녀석! 기초가 턱없이 부족하구나!"<br>"메인으로 가서 다시 처음부터 공부하고 와라!"<br><br>맞힌 문제: ' + correctCount + '개';

        const btn = document.getElementById('action-link');
        btn.innerText = '메인으로 쫓겨나기 🏃‍♂️💨';
        btn.href = '/student/main';
        btn.style.background = '#e74c3c';
    }

    function showVictory() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('status-title').innerText = 'MISSION COMPLETE';
        document.getElementById('status-title').style.color = '#2ecc71';
        document.getElementById('status-character').innerText = '🦉🎉';
        document.getElementById('status-desc').innerHTML = '훌륭합니다!<br>끝까지 살아남아 모든 퀴즈를 정복하셨습니다.<br><br>맞힌 문제: ' + correctCount + '개';

        const btn = document.getElementById('action-link');
        btn.innerText = '다른 퀴즈 풀러 가기';
        btn.href = '/student/quiz/list';
        btn.style.background = '#2ecc71';
    }
    /*]]>*/
</script>

</body>
</html>
