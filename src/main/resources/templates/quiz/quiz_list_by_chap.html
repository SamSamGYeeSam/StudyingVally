<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>챕터별 퀴즈 목록</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 챕터 목록으로 돌아가기</button>
<h2>선택한 챕터의 퀴즈 목록</h2>

<ul>
    <li th:each="quiz : ${quizList}">
        <form action="/teacher/quiz/find-quizlist-by-quiz-post" method="post" style="display:inline;">
            <input type="hidden" name="quizNo" th:value="${quiz.quizNo}">
            <button type="submit" style="cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:16px;" th:text="${quiz.quizTitle}"></button>
        </form>
    </li>
</ul>

<div th:if="${#lists.isEmpty(quizList)}" style="color: gray; margin-bottom: 20px;">등록된 퀴즈가 없습니다.</div>

<form action="/teacher/chapter/regist-quiz-form-post" method="post">
    <input type="hidden" name="chapNo" th:value="${chapNo}">
    <button type="submit">+ 새 퀴즈 생성하기</button>
</form>
</body>
</html>
