<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 퀴즈 목록</title>
    <link rel="stylesheet" th:href="@{/css/quizlistbychapter.css}">
</head>
<body>

<div class="room-container">
    <h2 class="pixel-title">❓ 챕터별 퀴즈 목록</h2>

    <div class="list-wrapper">
        <ul th:if="${not #lists.isEmpty(quizList)}">
            <li th:each="quiz : ${quizList}">
                <form action="/teacher/quiz/find-quizlist-by-quiz-post" method="post">
                    <input type="hidden" name="quizNo" th:value="${quiz.quizNo}">
                    <button type="submit" class="quiz-item-btn">
                        <span th:text="${quiz.quizTitle}"></span>
                    </button>
                </form>
            </li>
        </ul>

        <!-- 퀴즈가 없을 경우 -->
        <div th:if="${#lists.isEmpty(quizList)}" style="color: #999; text-align: center; padding-top: 100px;">
            등록된 퀴즈가 없습니다. 🌵
        </div>
    </div>

    <div class="footer-area">
        <button type="button" class="pixel-btn" onclick="location.href='/teacher/quiz/course'">
            🔙 이전으로
        </button>

        <form action="/teacher/chapter/regist-quiz-form-post" method="post" style="display:inline;">
            <input type="hidden" name="chapNo" th:value="${chapNo}">
            <button type="submit" class="pixel-btn btn-add">+ 새 퀴즈 생성하기</button>
        </form>
    </div>
</div>

</body>
</html>
