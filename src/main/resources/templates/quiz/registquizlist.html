<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문제 신규 등록</title>
</head>
<body>
<button type="button" onclick="history.back();" style="margin-bottom: 20px;">⬅ 작성 취소하고 돌아가기</button>

<h2>새 문제 만들기</h2>
<div th:if="${message}" th:text="${message}" style="color: blue; margin-bottom: 15px;"></div>

<form action="/teacher/quiz/create-quizlist" method="post" id="quizForm">
    <input type="hidden" name="quizNo" th:value="${quizNo}">

    <label>문제 제목 :</label>
    <input type="text" name="quizTitle" required><br><br>

    <label>문제 지문 :</label>
    <textarea name="quizDesc" rows="4"></textarea><br><br>

    <label>정답 :</label>
    <input type="text" name="quizAnswer"><br><br>

    <label>정답 해설 :</label>
    <textarea name="quizAnswerDesc" rows="4"></textarea><br><br>

    <button type="submit">문제 등록 완료</button>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if(sessionStorage.getItem("draft_quizTitle")) document.querySelector("input[name='quizTitle']").value = sessionStorage.getItem("draft_quizTitle");
        if(sessionStorage.getItem("draft_quizDesc")) document.querySelector("textarea[name='quizDesc']").value = sessionStorage.getItem("draft_quizDesc");
        if(sessionStorage.getItem("draft_quizAnswer")) document.querySelector("input[name='quizAnswer']").value = sessionStorage.getItem("draft_quizAnswer");
        if(sessionStorage.getItem("draft_quizAnswerDesc")) document.querySelector("textarea[name='quizAnswerDesc']").value = sessionStorage.getItem("draft_quizAnswerDesc");
    });

    document.querySelector("input[name='quizTitle']").addEventListener("input", function() { sessionStorage.setItem("draft_quizTitle", this.value); });
    document.querySelector("textarea[name='quizDesc']").addEventListener("input", function() { sessionStorage.setItem("draft_quizDesc", this.value); });
    document.querySelector("input[name='quizAnswer']").addEventListener("input", function() { sessionStorage.setItem("draft_quizAnswer", this.value); });
    document.querySelector("textarea[name='quizAnswerDesc']").addEventListener("input", function() { sessionStorage.setItem("draft_quizAnswerDesc", this.value); });

    document.getElementById("quizForm").addEventListener("submit", function() {
        sessionStorage.removeItem("draft_quizTitle");
        sessionStorage.removeItem("draft_quizDesc");
        sessionStorage.removeItem("draft_quizAnswer");
        sessionStorage.removeItem("draft_quizAnswerDesc");
    });
</script>
</body>
</html>
