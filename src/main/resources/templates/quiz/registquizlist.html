<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문제 신규 일괄 등록</title>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #333; }
        .question-block { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; background-color: #fcfcfc; position: relative; }
        .remove-btn { color: red; cursor: pointer; font-weight: bold; border: 1px solid red; background: #fff; padding: 5px 10px; border-radius: 4px; position: absolute; right: 20px; top: 20px; }
        .remove-btn:hover { background: #ffebee; }
        .add-btn { padding: 12px 20px; background-color: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: block; width: 100%; font-size: 16px; }
        .add-btn:hover { background-color: #333; }
        .score-display { font-size: 18px; font-weight: bold; padding: 15px; background: #f9f9f9; border-left: 5px solid #000; margin-bottom: 20px; border-radius: 4px; }
        .submit-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        .submit-btn:hover { background: #1565c0; }
        label { font-weight: bold; display: inline-block; margin-top: 10px; margin-bottom: 5px; }
        input[type="text"], textarea, input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
<button type="button" onclick="location.href='/teacher/quiz/find-quizlist-by-quiz'" style="margin-bottom: 20px; padding: 10px; cursor: pointer;">
    ⬅ 작성 취소하고 퀴즈 목록으로 돌아가기
</button>

<h2>새 문제 일괄 만들기 (100점 맞추기)</h2>

<div class="score-display">
    현재 배점 합계: <span id="totalScoreText" style="color: #d32f2f;">0</span> / 100점
    <span style="font-size: 14px; font-weight: normal; color: #666; display: block; margin-top: 5px;">* 모든 문제의 배점 합계가 정확히 100점이 되어야 등록할 수 있습니다.</span>
</div>

<form action="/teacher/quiz/create-quizlist-batch" method="post" id="quizForm" novalidate>
    <input type="hidden" name="quizNo" th:value="${quizNo}">

    <div id="quizContainer">
        <div class="question-block" data-index="0">
            <h4 class="q-number" style="margin-top: 0; color: #1976d2;">문제 1</h4>

            <label>문제 제목 :</label>
            <input type="text" name="quizList[0].quizTitle" required placeholder="예: 자바의 창시자는?">

            <label>문제 지문 (선택) :</label>
            <textarea name="quizList[0].quizDesc" rows="3" placeholder="보기나 상세 설명을 적어주세요."></textarea>

            <label>정답 :</label>
            <input type="text" name="quizList[0].quizAnswer" required placeholder="정답을 입력하세요.">

            <label>정답 해설 (선택) :</label>
            <textarea name="quizList[0].quizAnswerDesc" rows="2" placeholder="문제에 대한 해설을 적어주세요."></textarea>

            <label style="color: #d32f2f;">배점 :</label>
            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="number" name="quizList[0].quizScore" class="quiz-score-input" value="0" min="1" max="100" required oninput="calculateTotalScore()" style="width: 150px;"> 점
            </div>
        </div>
    </div>

    <button type="button" class="add-btn" onclick="addQuestionBlock()">+ 문제 하나 더 추가하기</button>

    <button type="submit" class="submit-btn">최종 등록 완료 (100점 검사)</button>
</form>

<script>
    let questionCount = 1;

    function calculateTotalScore() {
        let inputs = document.querySelectorAll('.quiz-score-input');
        let total = 0;
        inputs.forEach(function(input) {
            total += parseInt(input.value) || 0;
        });

        let textElement = document.getElementById('totalScoreText');
        textElement.innerText = total;
        textElement.style.color = (total === 100) ? 'green' : '#d32f2f';
    }

    function addQuestionBlock() {
        const container = document.getElementById('quizContainer');
        const currentIndex = questionCount;

        const newBlock = document.createElement('div');
        newBlock.className = 'question-block';
        newBlock.setAttribute('data-index', currentIndex);

        newBlock.innerHTML = `
            <button type="button" class="remove-btn" onclick="removeQuestionBlock(this)">삭제</button>
            <h4 class="q-number" style="margin-top: 0; color: #1976d2;">문제 ${currentIndex + 1}</h4>

            <label>문제 제목 :</label>
            <input type="text" name="quizList[${currentIndex}].quizTitle" required placeholder="예: 자바의 창시자는?">

            <label>문제 지문 (선택) :</label>
            <textarea name="quizList[${currentIndex}].quizDesc" rows="3" placeholder="보기나 상세 설명을 적어주세요."></textarea>

            <label>정답 :</label>
            <input type="text" name="quizList[${currentIndex}].quizAnswer" required placeholder="정답을 입력하세요.">

            <label>정답 해설 (선택) :</label>
            <textarea name="quizList[${currentIndex}].quizAnswerDesc" rows="2" placeholder="문제에 대한 해설을 적어주세요."></textarea>

            <label style="color: #d32f2f;">배점 :</label>
            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="number" name="quizList[${currentIndex}].quizScore" class="quiz-score-input" value="0" min="1" max="100" required oninput="calculateTotalScore()" style="width: 150px;"> 점
            </div>
        `;

        container.appendChild(newBlock);
        questionCount++;
    }

    function removeQuestionBlock(buttonElement) {
        const block = buttonElement.closest('.question-block');
        block.remove();
        reindexQuestions();
        calculateTotalScore();
    }

    function reindexQuestions() {
        const blocks = document.querySelectorAll('.question-block');
        questionCount = blocks.length;

        blocks.forEach((block, index) => {
            block.setAttribute('data-index', index);
            block.querySelector('.q-number').innerText = '문제 ' + (index + 1);

            block.querySelector('input[name*=".quizTitle"]').name = `quizList[${index}].quizTitle`;
            block.querySelector('textarea[name*=".quizDesc"]').name = `quizList[${index}].quizDesc`;
            block.querySelector('input[name*=".quizAnswer"]').name = `quizList[${index}].quizAnswer`;
            block.querySelector('textarea[name*=".quizAnswerDesc"]').name = `quizList[${index}].quizAnswerDesc`;
            block.querySelector('input[name*=".quizScore"]').name = `quizList[${index}].quizScore`;
        });
    }
</script>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
