<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 마을 - 첫 화면</title>
  <style>
    :root {
    --sky-top: #7cc7ff;
    --sky-bottom: #dff6ff;
    --grass-1: #97d95c;
    --grass-2: #6ebf4b;
    --grass-3: #4c9d3f;
    --wood-light: #f3d49a;
    --wood-main: #c98a3d;
    --wood-dark: #7b4c1f;
    --panel-bg: #f7e7bf;
    --panel-line: #8d5a2b;
    --btn-main: #d9852f;
    --btn-hover: #f29a38;
    --btn-shadow: #8f4e1c;
    --text-main: #4b2f17;
    --white: #fffdf5;
    --danger: #d9534f;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: "Verdana", "Geneva", sans-serif;
    background: url('/image/mainbackground.png') no-repeat center center fixed;
    background-size: cover;

    min-height: 100vh;
    overflow: hidden;
    color: var(--text-main);
    image-rendering: pixelated;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

.game-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 200px; /* 상단 하늘 영역 */
    pointer-events: none;
    z-index: 1;
}

.cloud {
    position: absolute;
    background: #ffffffd9;
    width: 120px;
    height: 28px;
    box-shadow:
            28px -16px 0 0 #ffffffd9,
            62px -6px 0 0 #ffffffd9,
            88px 0 0 0 #ffffffd9,
            15px 8px 0 0 #ffffffd9,
            52px 10px 0 0 #ffffffd9;
}

.cloud.c1 { top: 70px; left: 70px; }
.cloud.c2 { top: 120px; left: 330px; transform: scale(1.1); }
.cloud.c3 { top: 90px; right: 260px; transform: scale(0.95); }


.cloud {
    animation: cloud-drift 55s linear infinite;
}

.cloud.c1 { animation-duration: 80s; --scale: 1; }
.cloud.c2 { animation-duration: 80s; --scale: 1.1; }
.cloud.c3 { animation-duration: 80s; --scale: 0.95; }

@keyframes cloud-drift {
    0%   { transform: translateX(0) scale(var(--scale, 1)); }
    100% { transform: translateX(100vw) scale(var(--scale, 1)); }
}

/* 나머지는 그대로 */


.panel-wrap {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 50px;
}

.panel {
    width: 1200px;
    padding: 28px 24px 24px;
    position: relative;
}


.title-container {
    text-align: center;
    padding-bottom: 20px;
}

.main-title-img {
    height: auto;
    width: 70%;
    margin-bottom: 15px;
}

.button-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 1000px;
    margin: 7px auto 0;
    justify-content: center;
}

.button-row form {
    flex: 1;
    margin: 0;
}

.button-row form .pixel-btn {
    width: 100%;
    margin: 0;
    font-size: 20px;
}

.pixel-btn {
    display: block;
    width: 100%;
    cursor: pointer;
    background: var(--btn-main);
    color: var(--white);
    font-size: 18px;
    font-weight: bold;
    padding: 20px 10px;
    margin: 12px 0;
    border: 4px solid var(--btn-shadow);
    box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.08s ease, background 0.15s ease;
}

.pixel-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-2px);
}

.pixel-btn:active {
    transform: translateY(1px);
}

.find-account-link-wrap {
    margin-top: 10px;
    width: 100%;
    text-align: center;
}

.find-account-link {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: #000;
    text-decoration: none;
    border-bottom: 2px solid transparent;
}

.find-account-link:hover {
    border-bottom: 2px solid #000;
}
  </style>

</head>
<body>

<div class="game-screen">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<div class="panel-wrap">
  <div class="panel">
    <section id="menuScreen" class="menu-screen active">
      <!-- Studying Valley Title -->
      <div class="title-container">
        <img th:src="@{/image/studying_valley_title.png}"
             alt="STUDYING VALLEY"
             class="main-title-img">
      </div>

      <div class="button-row">
        <form th:action="@{/auth/login}" method="get">
          <button type="submit" class="pixel-btn">로그인</button>
        </form>
        <form th:action="@{/auth/signuptype}" method="get">
          <button type="submit" class="pixel-btn">회원가입</button>
        </form>
      </div>

      <div class="find-account-link-wrap">
        <a th:href="@{/auth/find}" class="find-account-link">
          아이디 / 비밀번호를 잊으셨나요?
        </a>
      </div>

    </section>
  </div>
</div>

</body>
</html>
