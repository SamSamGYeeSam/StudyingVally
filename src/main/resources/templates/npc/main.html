<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NPC 센터 - Valley Guild</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 배경 컨테이너 */
        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 6px solid #5d4037;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            background-image: url('/image/npc-bg.png');
            background-position: center;
            background-size: cover;
        }

        /* 맵 위에 배치된 NPC (클릭 대상) */
        #npc-wizard {
            position: absolute;
            left:240px; /* npc-bg 내 마법사 위치에 맞춰 조정하세요 */
            top: 100px;
            cursor: pointer;
            text-align: center;
            z-index: 10;
            transition: transform 0.2s;
        }
        #npc-wizard:hover { transform: scale(1.1); }

        .wizard-img { width: 320px; image-rendering: pixelated; }
        .click-label {
            background: rgba(0,0,0,0.7);
            color: #ffca28;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 5px;
            margin-top: 5px;
        }

        /* 하단 대화창 (처음엔 숨김) */
        #dialogueModal {
            display: none; /* 클릭 전까지 숨김 */
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(46, 34, 30, 0.95);
            border: 4px solid #795548;
            outline: 2px solid #000;
            border-radius: 10px;
            padding: 20px;
            z-index: 100;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .dialogue-content { display: flex; align-items: center; }
        .portrait { font-size: 50px; margin-right: 20px; border: 3px solid #ffca28; padding: 5px; background: #fff; }

        .text-area { flex: 1; }
        .npc-name { color: #ffca28; font-size: 18px; margin-bottom: 5px; display: block; }
        .npc-msg { color: #fff; font-size: 14px; margin: 0; }

        /* 버튼 그룹 */
        .choice-group { display: flex; gap: 8px; margin-top: 12px; }
        .pixel-btn {
            padding: 6px 12px;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 12px;
            color: white;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
        }
        .btn-blue { background: #2196f3; }
        .btn-red { background: #e74c3c; }
        .btn-gray { background: #78909c; }
        .btn-close { background: #5d4037; margin-left: auto; }

        .pixel-btn:hover { transform: translateY(-2px); }
        .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

        /* 나가기 버튼 (우측 상단 별도) */
        .exit-room {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #c0392b;
            color: white;
            padding: 8px 15px;
            border: 2px solid #000;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 3px 3px 0 #000;
        }
    </style>
</head>
<body>

<div class="room-container">

    <!-- 방 나가기 버튼 -->
    <a th:href="${role == 'TEACHER' ? '/teacher/teachermain' : '/student/main'}" class="exit-room">🚪 나가기</a>

    <!-- 클릭 가능한 NPC 마법사 -->
    <div id="npc-wizard" onclick="openDialogue()">
        <img src="/image/wizard-npc.png" class="wizard-img" alt="마법사"> <!-- 수정 완료 -->
        <div class="click-label">TALK</div>
    </div>

    <!-- 하단 팝업 대화창 -->
    <div id="dialogueModal">
        <div class="dialogue-content">
            <div class="portrait">
                <img src="/image/wizard-npc.png" style="width: 50px; height: 50px; image-rendering: pixelated;" alt="NPC"> <!-- 수정 완료 -->
            </div>
            <div class="text-area">
                <strong class="npc-name">안내소장 마법사</strong>
                <p class="npc-msg">반갑네! 이 마을(Valley)의 질서를 지키는 마법사라네. 무엇을 도와줄까?</p>

                <div class="choice-group">
                    <a href="/npc/inquiry" class="pixel-btn btn-blue">✉️ 1:1 문의하기</a>
                    <a href="/npc/my-inquiries" class="pixel-btn btn-gray">📜 내 문의 내역</a>
                    <a href="/npc/report" class="pixel-btn btn-red">🚨 불량 유저 신고</a>
                    <a href="/npc/report/my-reports" class="pixel-btn btn-gray">📁 신고 처리 결과</a>
                    <button class="pixel-btn btn-close" onclick="closeDialogue()">닫기</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    function openDialogue() {
        document.getElementById('dialogueModal').style.display = 'block';
    }

    function closeDialogue() {
        document.getElementById('dialogueModal').style.display = 'none';
    }

    // ESC 키를 누르면 대화창 닫기
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeDialogue();
        }
    });
</script>

</body>
</html>
