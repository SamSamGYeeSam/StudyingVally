<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>불량 사용자 신고 - Valley Justice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 배경 컨테이너 */
        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 6px solid #5d4037;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            background-image: url('/image/npc-bg.png');
            background-position: center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 신고 폼 패널 */
        .form-panel {
            width: 550px;
            background: rgba(253, 241, 213, 0.95); /* 양피지색 반투명 */
            border: 5px solid #4e342e;
            outline: 2px solid #000;
            padding: 30px;
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: #c0392b;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px double #c0392b;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        .notice {
            color: #5d4037;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
            background: rgba(192, 57, 43, 0.1);
            padding: 10px;
            border: 1px dashed rgba(192, 57, 43, 0.3);
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #3e2723;
        }

        /* 픽셀 느낌의 입력창 */
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #5d4037;
            background: rgba(255, 255, 255, 0.7);
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'DungGeunMo';
            outline: none;
            image-rendering: pixelated;
        }

        input[type="text"]:focus, textarea:focus {
            background: #fff;
            border-color: #c0392b;
            box-shadow: 0 0 5px rgba(192, 57, 43, 0.2);
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .pixel-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
            display: inline-block;
        }

        .save-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border: 2px solid #000;
        }

        .cancel-btn {
            background: #78909c;
            color: #fff;
        }

        .pixel-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        /* 장식용 도장 */
        .stamp {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 40px;
            color: #c0392b;
            opacity: 0.15;
            transform: rotate(-20deg);
            pointer-events: none;
            border: 4px solid #c0392b;
            padding: 5px 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="room-container">
    <!-- 고발 서류 패널 -->
    <div class="form-panel">
        <h2>⚠️ 불량 사용자 고발장</h2>

        <p class="notice">
            욕설, 도배, 부적절한 행위를 한 사용자를 기록해 주세요.<br>
            <strong>허위 신고 시 마을 법전에 따라 처벌받을 수 있습니다.</strong>
        </p>

        <form action="/npc/report" method="post">
            <label>📜 신고 대상 및 제목</label>
            <input type="text" name="reportTitle" required
                   placeholder="예: [욕설] 홍길동 유저를 고발합니다.">

            <label>📝 상세 내용 (증거 및 상황)</label>
            <textarea name="reportDesc" rows="7" required
                      placeholder="발생 시각, 상황 등을 상세히 적어주세요."></textarea>

            <div class="btn-group">
                <a href="/npc" class="pixel-btn cancel-btn">작성 취소</a>
                <button type="submit" class="pixel-btn save-btn">NPC에게 제출하기</button>
            </div>
        </form>

        <!-- 디자인 포인트: जस्टिस (Justice) 도장 -->
        <div class="stamp">VALLEY</div>
    </div>
</div>

</body>
</html>
