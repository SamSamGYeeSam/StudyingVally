<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<h1>챕터 등록 페이지</h1>
<p><strong>강의명: <span th:text="${course.courseTitle}"></span></strong></p>

<form th:action="@{/teacher/course/registchapter}" method="post" enctype="multipart/form-data" novalidate>

    <input type="hidden" name="courseId" th:value="${courseId}" th:if="${courseId != null}">
    <input type="hidden" name="courseTitle" th:value="${courseTitle}">
    <input type="hidden" name="courseDescription" th:value="${courseDescription}">

    <div id="chaptersContainer">
        <div class="chapter-section">
            <h3 th:text="'챕터 ' + ${startChapterNumber}">챕터 1</h3>
            <label>챕터 제목</label><br>
            <input type="text" name="chapTitle" placeholder="제목을 입력하십시오" required><br>
            <label>챕터 설명</label><br>
            <textarea rows="10" name="chapDesc" cols="50" placeholder="챕터 설명을 입력하십시오" required></textarea><br>
            <label>강의 영상</label><br>
            <h6> * 영상은 500MB 이하만 업로드 가능합니다 *</h6>
            <input type="file" name="videoFile" accept="video/*" required><br><br>
        </div>
    </div>

    <button type="button" onclick="addChapter()">챕터 추가하기</button><br><br>
    <button type="submit">등록 완료하기</button>
</form>

<a href="/teacher/course">
    <button type="button">이전으로</button>
</a>

<div th:replace="~{modal/modal :: modalHtml}"></div>

<script th:replace="~{modal/modal :: modalScript}"></script>

<script th:inline="javascript">
    // 챕터 갯수 세기 -> 챕터 추가하기 전 기본적으로 1개는 작석ㅇ
    let chapterCount = /*[[${startChapterNumber}]]*/ 1;


  // 챕터 추가
  function addChapter() {
      const container = document.getElementById('chaptersContainer');
      const newIndex = chapterCount;

      const chapterHtml = `
          <div class="chapter-section">
              <h3>챕터 ${chapterCount + 1}</h3>
              <button type="button" onclick="removeChapter(this)">삭제</button><br>
              <label>챕터 제목</label><br>
              <input type="text" name="chapTitle" placeholder="제목을 입력하십시오" required><br>
              <label>챕터 설명</label><br>
              <textarea rows="10" name="chapDesc" cols="50" placeholder="챕터 설명을 입력하십시오" required></textarea><br>
              <label>강의 영상</label><br>
              <h6> * 영상은 500MB 이하만 업로드 가능합니다 *</h6>
              <input type="file" name="videoFile" accept="video/*" required><br><br>
          </div>
      `;

      container.insertAdjacentHTML('beforeend', chapterHtml);
      chapterCount++;
  }

  function removeChapter(button) {
      const chapterSection = button.closest('.chapter-section');
      const container = document.getElementById('chaptersContainer');

      chapterSection.remove();
      updateChapterNumbers();
  }

  function updateChapterNumbers() {
        const startNum = /*[[${startChapterNumber}]]*/ 1;
        const chapters = document.querySelectorAll('.chapter-section');
        chapters.forEach((chapter, index) => {
            const h3 = chapter.querySelector('h3');
            h3.textContent = `챕터 ${startNum + index}`;
        });
        chapterCount = startNum + chapters.length - 1;
    }
</script>

</body>
</html>
