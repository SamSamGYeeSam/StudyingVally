<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 챕터 등록</title>
    <link rel="stylesheet" th:href="@{/css/registchapter.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">

    <div class="header-area">
        <h1 class="pixel-title">📜 챕터 등록 페이지</h1>
        <p style="color: white; text-align: center; margin-bottom: 10px;">
            <strong>강의명: <span th:text="${course.courseTitle}"></span></strong>
        </p>
    </div>

    <div class="form-wrapper">
        <form th:action="@{/teacher/course/registchapter}" method="post" enctype="multipart/form-data" id="registForm" novalidate>
            <input type="hidden" name="courseId" th:value="${courseId}" th:if="${courseId != null}">
            <input type="hidden" name="courseTitle" th:value="${courseTitle}">
            <input type="hidden" name="courseDescription" th:value="${courseDescription}">

            <div id="chaptersContainer">
                <div class="chapter-section">
                    <h3 th:text="'챕터 ' + ${startChapterNumber}">챕터 1</h3>
                    <label>챕터 제목</label>
                    <input type="text" name="chapTitle" placeholder="제목을 입력하십시오" required>

                    <label>챕터 설명</label>
                    <textarea rows="5" name="chapDesc" placeholder="챕터 설명을 입력하십시오" required></textarea>

                    <label>강의 영상</label>
                    <p style="font-size: 12px; color: #ffca28; margin: 5px 0;">* 영상은 500MB 이하만 업로드 가능합니다 *</p>
                    <input type="file" name="videoFile" accept="video/*" required>
                </div>
            </div>

            <button type="button" class="pixel-btn" style="width: 100%;" onclick="addChapter()">＋ 새로운 챕터 추가</button>
        </form>
    </div>

    <div class="footer-btns">
        <a href="/teacher/course">
            <button type="button" class="pixel-btn">🏠 이전으로</button>
        </a>
        <button type="submit" form="registForm" class="pixel-btn btn-submit">✅ 모든 챕터 등록 완료</button>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

<script th:inline="javascript">
    let chapterCount = /*[[${startChapterNumber}]]*/ 1;

    function addChapter() {
        const container = document.getElementById('chaptersContainer');
        const nextNum = chapterCount + 1;

        const chapterHtml = `
          <div class="chapter-section">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                  <h3>챕터 ${nextNum}</h3>
                  <button type="button" class="pixel-btn danger" style="padding: 2px 10px; font-size: 11px;" onclick="removeChapter(this)">삭제</button>
              </div>
              <label>챕터 제목</label>
              <input type="text" name="chapTitle" placeholder="제목을 입력하십시오" required>
              <label>챕터 설명</label>
              <textarea rows="5" name="chapDesc" placeholder="챕터 설명을 입력하십시오" required></textarea>
              <label>강의 영상</label>
              <input type="file" name="videoFile" accept="video/*" required>
          </div>
      `;

        container.insertAdjacentHTML('beforeend', chapterHtml);
        chapterCount++;

        // 추가 시 자동으로 스크롤을 맨 아래로 이동
        const wrapper = document.querySelector('.form-wrapper');
        wrapper.scrollTop = wrapper.scrollHeight;
    }

    function removeChapter(button) {
        const chapterSection = button.closest('.chapter-section');
        chapterSection.remove();
        updateChapterNumbers();
    }

    function updateChapterNumbers() {
        const startNum = /*[[${startChapterNumber}]]*/ 1;
        const chapters = document.querySelectorAll('.chapter-section');
        chapters.forEach((chapter, index) => {
            const h3 = chapter.querySelector('h3');
            h3.textContent = `챕터 ${startNum + index}`;
        });
        chapterCount = startNum + chapters.length - 1;
    }
</script>

</body>
</html>
