<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>챕터 수정</title>
</head>
<body>

<h1>챕터 수정 페이지</h1>

<form action="/teacher/course/updatechapter" method="post" enctype="multipart/form-data">

    <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
    <input type="hidden" name="courseId" th:value="${courseId}">

    <label>챕터 제목</label><br>
    <input type="text" name="chapTitle" th:value="${chapter.chapTitle}" required><br><br>

    <label>챕터 설명</label><br>
    <textarea rows="10" cols="50" name="chapDesc" th:text="${chapter.chapDesc}" required></textarea><br><br>

    <label>영상 URL</label><br>
    <input type="file" name="videoFile" accept="video/*"><br>
    <p style="color: #999; font-size: 12px;">* 영상을 변경하지 않으려면 파일을 선택하지 마세요</p>
    <br>

    <button type="submit">수정하기</button>
</form>

<form action="/teacher/course/update" method="post" style="display:inline; margin-left: 10px;">
    <input type="hidden" name="courseId" th:value="${courseId}">
    <button type="submit">이전으로</button>
</form>

</body>
</html>
