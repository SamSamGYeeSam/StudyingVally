<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="field">

    <form action="/notice" method="get" style="display:inline;">
        <button type="submit" class="entity" id="notice">
            <div class="entity-label">공지 사항</div>
        </button>
    </form>

    <form action="/teacher/register" method="get" style="display:inline;">
        <button type="submit" class="entity" id="register">
            <div class="entity-label">강의 등록</div>
        </button>
    </form>

    <form action="/teacher/notice" method="get" style="display:inline;">
        <button type="submit" class="entity" id="teachernotice">
            <div class="entity-label">강의 소식</div>
        </button>
    </form>

    <form action="/teacher/course" method="get" style="display:inline;">
        <button type="submit" class="entity" id="course">
            <div class="entity-label">강의 목록 조회</div>
        </button>
    </form>

    <form action="/teacher/mypage" method="get" style="display:inline;">
        <button type="submit" class="entity" id="mypage">
            <div class="entity-label">마이페이지</div>
        </button>
    </form>

    <form action="/npc" method="get" style="display:inline;">
        <button type="submit" class="entity" id="npc">
            <div class="entity-label">npc</div>
        </button>
    </form>

    <form action="/logout" method="post" style="display:inline;">
        <button type="submit" class="entity" id="logout">
            <div class="entity-label">로그아웃</div>
        </button>
    </form>

    <div id="character">🧙‍♂️</div>
</div>
</body>
</html>
