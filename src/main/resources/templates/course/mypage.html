<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Valley - 설정</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <!-- 좌측 상단 타이틀 -->
    <h1 class="pixel-title">⚙️ USER SETTINGS</h1>

    <!-- 중앙 메인 박스 -->
    <div class="main-wrapper">
        <div class="scroll-content">
            <h3 class="section-title">회원 관리</h3>

            <div class="info-card">
                <p class="pixel-text-small">본인 확인 및 계정 관리 메뉴입니다.</p>

                <!-- 내 정보 보기 -->
                <div class="settings-item">
                    <div class="item-desc">
                        <strong>내 정보 조회</strong>
                        <span>가입된 상세 정보를 확인하고 수정합니다.</span>
                    </div>
                    <form onsubmit="openInfoPasswordPopup(); return false;">
                        <button type="submit" class="pixel-btn">조회하기</button>
                    </form>
                </div>

                <hr class="pixel-hr">

                <!-- 회원 탈퇴 -->
                <div class="settings-item">
                    <div class="item-desc">
                        <strong>계정 탈퇴</strong>
                        <span class="danger-text">탈퇴 시 모든 학습 데이터가 삭제됩니다.</span>
                    </div>
                    <form action="/deleteaccount" method="post" onsubmit="return confirm('정말로 탈퇴하시겠습니까?');">
                        <button type="submit" class="pixel-btn danger">회원 탈퇴</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div class="footer-area">
            <a href="/teacher/teachermain" class="pixel-btn grey">🔙 이전으로</a>
        </div>
    </div>

    <!-- 비밀번호 확인용 숨은 form -->
    <form id="infoPasswordForm" action="/showinformation/check-password" method="post" style="display:none;">
        <input type="hidden" name="userPassword" id="infoPasswordInput">
    </form>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

<script>
    function openInfoPasswordPopup() {
        const password = prompt("내 정보 조회를 위해 비밀번호를 입력해주세요.");
        if (password === null) return;
        if (password.trim() === "") {
            alert("비밀번호를 입력해주세요.");
            return;
        }
        document.getElementById("infoPasswordInput").value = password;
        document.getElementById("infoPasswordForm").submit();
    }
</script>

</body>
</html>
