<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 챕터 목록</title>
    <link rel="stylesheet" th:href="@{/css/chapterlist.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <h1 class="pixel-title">📜 강의 상세 챕터</h1>

    <p style="color: #ffca28; text-align: center; margin-bottom: 10px;">
        <strong th:if="${courseTitle}" th:text="|강의명: ${courseTitle}|"></strong>
    </p>

    <div class="table-wrapper">
        <table class="chapter-table" th:if="${chapterList != null and !chapterList.isEmpty()}">
            <thead>
            <tr>
                <th>챕터명</th>
                <th style="width: 30%;">설명</th>
                <th>퀴즈</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="chapter : ${chapterList}">
                <td th:text="${chapter.chapTitle}" style="color: #ffca28; font-weight: bold;"></td>
                <td th:text="${chapter.chapDesc}" style="font-size: 12px; text-align: left;"></td>
                <td>
                    <form action="/teacher/quiz/course-post" method="post" style="display:inline;">
                        <input type="hidden" name="courseId" th:value="${courseId}">
                        <button type="submit" class="pixel-btn success">등록</button>
                    </form>
                </td>
                <td>
                    <form action="/teacher/course/chapterupdate" method="post" style="display:inline;">
                        <input type="hidden" name="courseId" th:value="${courseId}">
                        <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
                        <button type="submit" class="pixel-btn">수정</button>
                    </form>
                </td>
                <td>
                    <form action="/teacher/course/deletechaptercheck" method="post" style="display:inline;">
                        <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
                        <input type="hidden" name="courseId" th:value="${courseId}">
                        <button type="submit" class="pixel-btn danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- 데이터 없을 때 -->
        <div th:if="${chapterList == null or chapterList.isEmpty()}"
             style="text-align: center; color: #ffca28; padding: 100px;">
            등록된 챕터가 없습니다. 🌵
        </div>
    </div>

    <div class="footer-btns">
        <a href="/teacher/course">
            <button type="button" class="pixel-btn">🏠 이전으로</button>
        </a>

        <form action="/teacher/course/registchapterPage" method="post" style="display:inline;">
            <input type="hidden" name="courseId" th:value="${courseId}">
            <button type="submit" class="pixel-btn success">➕ 챕터 추가하기</button>
        </form>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
