<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Valley - 강의 수정</title>
    <link rel="stylesheet" th:href="@{/css/updatecourse.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <!-- 좌측 상단 타이틀 영역 (챕터 수정 페이지 형식) -->
    <h1 class="pixel-title">🛠️ <span th:text="${course.courseTitle}">강의</span> 수정 중...</h1>

    <div class="form-wrapper">
        <!-- 메인 수정 폼 -->
        <form id="updateForm" action="/teacher/course/updatecourse" method="post" novalidate>
            <input type="hidden" name="courseId" th:value="${course.courseId}">

            <label>📍 강의 제목</label>
            <input type="text" name="courseTitle" th:value="${course.courseTitle}"
                   class="pixel-input" required placeholder="강의 제목을 입력하세요">

            <label>📝 강의 설명</label>
            <textarea rows="10" name="courseDescription" th:text="${course.courseDescription}"
                      class="pixel-textarea" required placeholder="강의 상세 설명을 입력하세요"></textarea>
        </form>
    </div>

    <div class="footer-area">
        <!-- 취소 버튼 (이전 페이지로 이동) -->
        <form action="/teacher/course/update" method="post">
            <input type="hidden" name="courseId" th:value="${course.courseId}">
            <button type="submit" class="pixel-btn">🔙 취소하기</button>
        </form>

        <!-- 수정 완료 버튼 -->
        <button type="submit" form="updateForm" class="pixel-btn success">✅ 수정 완료 저장</button>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
