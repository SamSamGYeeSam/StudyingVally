<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 강의 수정</title>
    <link rel="stylesheet" th:href="@{/css/updatecourse.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <h2 class="pixel-title">🛠️ 강의 정보 수정</h2>

    <div class="form-wrapper">
        <!-- 수정 폼 -->
        <form id="updateForm" action="/teacher/course/updatecourse" method="post" novalidate>
            <input type="hidden" name="courseId" th:value="${course.courseId}">

            <label>📍 강의 제목</label>
            <input type="text" name="courseTitle" th:value="${course.courseTitle}" required placeholder="강의 제목을 입력하세요">

            <label>📝 강의 설명</label>
            <textarea rows="8" name="courseDescription" th:text="${course.courseDescription}" required placeholder="강의에 대한 상세 설명을 입력하세요"></textarea>
        </form>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="footer-area">
        <!-- 이전으로 폼 (기존 방식 유지) -->
        <form action="/teacher/course/update" method="post">
            <input type="hidden" name="courseId" th:value="${course.courseId}">
            <button type="submit" class="pixel-btn prev-btn">🔙 이전으로</button>
        </form>

        <!-- 수정 완료 버튼 -->
        <button type="submit" form="updateForm" class="pixel-btn submit-btn">✅ 수정 완료 저장</button>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
