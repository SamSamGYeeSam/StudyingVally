<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - 강의평 목록</title>
    <link rel="stylesheet" th:href="@{/css/evaluationlist.css}">
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <h2 class="pixel-title">⭐ 수강생 강의평 목록</h2>

    <div class="list-wrapper">
        <div th:if="${!evaluations.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>등록일</th>
                    <th>이름</th>
                    <th>닉네임</th>
                    <th>별점</th>
                    <th>강의평 내용</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evaluation : ${evaluations}">
                    <td th:text="${#temporals.format(evaluation.createdDate, 'yyyy-MM-dd')}">2024-01-01</td>
                    <td th:text="${evaluation.userName}">이름</td>
                    <td th:text="${evaluation.userNickname}">닉네임</td>
                    <td class="star-rating" th:text="${evaluation.evaluationScore} + ' ★'">5.0 ★</td>
                    <td style="text-align: left;" th:text="${evaluation.evaluationDesc}">강의평 내용</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${evaluations.isEmpty()}" class="no-data">
            등록된 강의평이 없습니다. 🌵
        </div>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="footer-area">
        <a href="/teacher/course" class="pixel-btn">
            🔙 이전으로
        </a>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
