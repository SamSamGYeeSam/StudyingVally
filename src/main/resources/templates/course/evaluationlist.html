<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>강의평 목록</title>

</head>

<body>
<h1>강의평 목록</h1>

<div class="evaluation-list">
    <div th:if="${!evaluations.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>등록일</th>
                <th>이름</th>
                <th>닉네임</th>
                <th>별점</th>
                <th>강의평 내용</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evaluation : ${evaluations}">
                <td th:text="${#temporals.format(evaluation.createdDate, 'yyyy-MM-dd')}">2024-01-01 10:00</td>
                <td th:text="${evaluation.userName}">이름</td>
                <td th:text="${evaluation.userNickname}">닉네임</td>
                <td class="star-rating" th:text="${evaluation.evaluationScore} + ' ★'">5.0 ★</td>
                <td th:text="${evaluation.evaluationDesc}">강의평 내용</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${evaluations.isEmpty()}" class="no-data">
        등록된 강의평이 없습니다.
    </div>
</div>

<form action="/teacher/course" method="get" style="display:inline;">
    <button type="submit">이전으로</button>
</form>


</body>

</html>
