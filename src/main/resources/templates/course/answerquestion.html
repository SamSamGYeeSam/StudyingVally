<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>질문 답변</title>
  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<h1>질문 답변 페이지</h1>

<div>
  <label>강의명</label><br>
  <span th:text="${question.courseTitle}"></span>
</div>
<br>

<div>
  <label>질문 제목</label><br>
  <span th:text="${question.questionCourseTitle}"></span>
</div>
<br>

<div>
  <label>질문 내용</label><br>
  <span th:text="${question.questionCourseDesc}"></span>
</div>
<br>

<form action="/teacher/course/question/answer" method="post" novalidate>

  <input type="hidden" name="questionCourseNo" th:value="${question.questionCourseNo}">
  <input type="hidden" name="courseId" th:value="${courseId}">

  <label>답변 내용</label><br>
  <textarea rows="10" cols="50" name="questionCourseAnswer" placeholder="답변을 입력하세요" required></textarea><br><br>

  <button type="submit">답변 등록하기</button>
</form>

<form action="/teacher/course/question" method="post" style="display:inline;">
  <input type="hidden" name="courseId" th:value="${courseId}">
  <button type="submit">이전으로</button>
</form>

<div th:replace="~{modal/modal :: modalHtml}"></div>

<script th:replace="~{modal/modal :: modalScript}"></script>
</body>
</html>
