<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Studying Vally - 질문 답변</title>
  <link rel="stylesheet" th:href="@{/css/questionanswer.css}">
  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
  <h2 class="pixel-title">💬 질문 답변하기</h2>

  <div class="content-wrapper">
    <!-- 질문 내용 섹션 -->
    <div class="question-info">
      <div class="info-item">
        <label>📖 강의명</label>
        <span class="info-text" th:text="${question.courseTitle}">강의 제목</span>
      </div>
      <div class="info-item">
        <label>❓ 질문 제목</label>
        <span class="info-text" th:text="${question.questionCourseTitle}">질문 제목</span>
      </div>
      <div class="info-item">
        <label>📝 질문 내용</label>
        <span class="info-text" th:text="${question.questionCourseDesc}">질문 상세 내용</span>
      </div>
    </div>

    <!-- 답변 입력 폼 -->
    <form id="answerForm" action="/teacher/course/question/answer" method="post" novalidate>
      <input type="hidden" name="questionCourseNo" th:value="${question.questionCourseNo}">
      <input type="hidden" name="courseId" th:value="${courseId}">

      <label>✒️ 답변 작성</label>
      <textarea rows="8" name="questionCourseAnswer" placeholder="수강생에게 전달할 답변을 입력하세요..." required th:text="${question.questionCourseAnswer}"></textarea>
    </form>
  </div>

  <!-- 하단 버튼 영역 -->
  <div class="footer-area">
    <form action="/teacher/course/question" method="post">
      <input type="hidden" name="courseId" th:value="${courseId}">
      <button type="submit" class="pixel-btn prev-btn">🔙 이전으로</button>
    </form>

    <button type="submit" form="answerForm" class="pixel-btn submit-btn">🚀 답변 등록하기</button>
  </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
