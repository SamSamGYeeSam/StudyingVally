<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Studying Valley - 답변 수정</title>
  <link rel="stylesheet" th:href="@{/css/updateanswer.css}">
  <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
  <!-- 좌측 상단 타이틀 (통일된 형식) -->
  <h1 class="pixel-title">⚙️ EDIT ANSWER</h1>

  <div class="form-wrapper">
    <div class="scroll-content">
      <h3 class="section-title">✏️ 답변 내용 수정</h3>

      <!-- 기존 질문 정보 (상세 정보 카드) -->
      <div class="question-info-card">
        <div class="info-row">
          <label>COURSE</label>
          <div class="text-display" th:text="${question.courseTitle}">강의명</div>
        </div>
        <div class="info-row">
          <label>TITLE</label>
          <div class="text-display highlight" th:text="${question.questionCourseTitle}">질문 제목</div>
        </div>
        <div class="info-row">
          <label>QUESTION</label>
          <div class="text-display desc-area" th:text="${question.questionCourseDesc}">질문 내용</div>
        </div>
      </div>

      <!-- 답변 수정 폼 -->
      <form id="updateAnswerForm" action="/teacher/course/question/updateanswer" method="post" novalidate>
        <input type="hidden" name="questionCourseNo" th:value="${question.questionCourseNo}">
        <input type="hidden" name="courseId" th:value="${courseId}">

        <div class="input-group">
          <label for="answerContent">MY ANSWER</label>
          <textarea id="answerContent" rows="7" name="questionCourseAnswer"
                    class="pixel-textarea" required
                    th:text="${question.questionCourseAnswer}"></textarea>
        </div>
      </form>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="footer-area">
      <form action="/teacher/course/question" method="post">
        <input type="hidden" name="courseId" th:value="${courseId}">
        <button type="submit" class="pixel-btn danger">🔙 취소하기</button>
      </form>

      <button type="submit" form="updateAnswerForm" class="pixel-btn success">✅ 수정 완료</button>
    </div>
  </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

</body>
</html>
