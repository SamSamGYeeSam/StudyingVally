<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의 삭제 확인</title>

</head>
<body>

<div class="container">
    <h2>강의 삭제 확인</h2>

    <div class="course-info">
        <div class="info-row">
            <span class="label">강의명:</span>
            <span th:text="${course.courseTitle}"></span>
        </div>
        <div class="info-row">
            <span class="label">강의 설명:</span>
            <span th:text="${course.courseDescription}"></span>
        </div>
        <div class="info-row">
            <span class="label">상태:</span>
            <span th:text="${course.courseStatus == 'OPEN' ? '개설' : '미개설'}"></span>
        </div>
    </div>

    <div class="warning">
        <strong>⚠ 경고:</strong> 이 작업은 되돌릴 수 없습니다.<br>
        강의와 관련된 모든 데이터 함께 삭제됩니다.
    </div>

    <div>

        <form th:action="@{/teacher/course/delete}" method="post" style="display:inline;">
            <input type="hidden" name="courseId" th:value="${course.courseId}">
            <button type="submit">삭제하기</button>
        </form>


        <form action="/teacher/course" method="get" style="display:inline;">
            <button type="submit">취소</button>
        </form>
    </div>
</div>

</body>
</html>
