<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>

        #courseTable tbody tr {
            cursor: pointer;
        }

        /* 선택창 */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 300px;
        }

        .popup.active {
            display: block;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        .popup-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .popup-menu li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .popup-menu li:hover {
            background-color: #f0f0f0;
        }

        .popup-menu li:last-child {
            border-bottom: none;
        }

        .empty-message {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 18px;
           }

        /* 메일함 */

        #notificationModal {
            width: auto;
            min-width: 300px;
            max-width: 600px;
            white-space: nowrap;
        }

        .notification-button {
            position: relative;
            padding: 8px 15px;
            cursor: pointer;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

    </style>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>

</head>
<body>

<h3>전체 강의 목록</h3>
<table id="courseTable" th:if="${courseList != null and !courseList.isEmpty()}">
    <thead>
    <tr>
        <th>강의명</th>
        <th>강의설명</th>
        <th>상태</th>
        <th>개설일</th>
        <th>승인여부</th>
    </tr>
    </thead>
    <tbody>
<!--  각 행 누르면 그 강의번호를 유지하면서 선택창 실행  -->
    <tr th:each="course : ${courseList}"
        th:attr="data-id=${course.courseId}, data-title=${course.courseTitle}"
        onclick="showPopup(this.dataset.id, this.dataset.title)">
        <td th:text="${course.courseTitle}"></td>
        <td th:text="${course.courseDescription}"></td>
        <td th:text="${course.courseStatus == 'OPEN' ? '개설' : '미개설'}"></td>
        <td th:text="${#temporals.format(course.courseCreatedAt, 'yyyy. M. d')}"></td>
        <td th:text="${course.courseSendApprove == 1 ? '승인' : '미승인'}"></td>
    </tr>
    </tbody>
</table>

<div class="empty-message" th:if="${courseList == null or courseList.isEmpty()}">
    등록된 강의가 없습니다.
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>

<div class="popup" id="popup">
    <h4 id="popupTitle">강의 메뉴</h4>
    <ul class="popup-menu">
        <li onclick="submitTo('/teacher/course/chapter')">챕터 보기</li>
        <li onclick="submitTo('/teacher/course/registchapterPage')">챕터 추가하기</li>
        <li onclick="submitTo('/teacher/course/review')">강의평 보기</li>
        <li onclick="submitTo('/teacher/course/studentlist')">수강생 보기</li>
        <li onclick="submitTo('/teacher/course/update')">강의 수정하기</li>
        <li onclick="submitTo('/teacher/course/deletecheck')">강의 삭제하기</li>
        <li onclick="submitTo('/teacher/course/question')">질문 보기</li>
        <li onclick="submitTo('/teacher/quiz/course-post')">퀴즈 보기</li>
        <li onclick="closePopup()">이전으로</li>
    </ul>
</div>

<form id="commonForm" method="post">
    <input type="hidden" name="courseId" id="commonCourseId">
</form>

<a href="/teacher/teachermain">
    <button type="button">이전으로</button>
</a>

<!--답변 안 한 질문 안내용-->
<button onclick="showNotificationModal()" class="notification-button">
    메일함
    <span id="notificationBadge" class="notification-badge" style="display: none;"></span>
</button>

<!-- 알림 모달 -->
<div class="overlay" id="notificationOverlay" onclick="closeNotificationModal()"></div>

<div class="popup" id="notificationModal">
    <h4>알림</h4>
    <p id="notificationMessage"></p>
    <button onclick="closeNotificationModal()" >확인</button>
</div>

<!-- 모달 HTML 포함 -->
<div th:replace="~{modal/modal :: modalHtml}"></div>

<!-- 모달 스크립트 포함 -->
<script th:replace="~{modal/modal :: modalScript}"></script>

<script th:inline="javascript">

      // 선택한 강의 번호
      let selectedCourseId = null;
      // 답변 안 한 질문 갯수 세는 용
      const unansweredQuestions = /*[[${unansweredQuestions}]]*/ {};

      window.onload = function() {
        updateMailCount();
      };

      //  배지 개수 업데이트
        function updateMailCount() {
        let totalCount = 0;
        for (const count of Object.values(unansweredQuestions)) {
            totalCount += count;
        }

        const badge = document.getElementById('notificationBadge');
        if (totalCount > 0) {
            badge.textContent = totalCount;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }


      function showNotificationModal() {
          let message = '';

          if (Object.keys(unansweredQuestions).length === 0) {
              message = '알림이 없습니다.';
          } else {
              for (const [courseTitle, count] of Object.entries(unansweredQuestions)) {
                  message += '• '+ courseTitle + ' 강의에 답변 대기 중인 질문이 ' + count + '개 있습니다.\n';
              }
          }

          document.getElementById('notificationMessage').innerText = message;
          document.getElementById('notificationModal').classList.add('active');
          document.getElementById('notificationOverlay').classList.add('active');
      }

      function closeNotificationModal() {
          document.getElementById('notificationModal').classList.remove('active');
          document.getElementById('notificationOverlay').classList.remove('active');
      }

      function showPopup(courseId, courseTitle) {
          selectedCourseId = courseId;
          document.getElementById('popupTitle').textContent = courseTitle;
          document.getElementById('popup').classList.add('active');
          document.getElementById('overlay').classList.add('active');
      }

      function closePopup() {
          document.getElementById('popup').classList.remove('active');
          document.getElementById('overlay').classList.remove('active');
          selectedCourseId = null;
      }

      function submitTo(action) {
          const form = document.getElementById('commonForm');
          form.action = action;
          document.getElementById('commonCourseId').value = selectedCourseId;
          form.submit();
      }
</script>

</body>
</html>
