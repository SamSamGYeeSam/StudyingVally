<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>

        #courseTable tbody tr {
            cursor: pointer;
        }

        /* 선택창 */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 300px;
        }

        .popup.active {
            display: block;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        .popup-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .popup-menu li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .popup-menu li:hover {
            background-color: #f0f0f0;
        }

        .popup-menu li:last-child {
            border-bottom: none;
        }

        .empty-message {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 18px;
           }


    </style>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>

</head>
<body>

<h3>전체 강의 목록</h3>
<table id="courseTable" th:if="${courseList != null and !courseList.isEmpty()}">
    <thead>
    <tr>
        <th>강의명</th>
        <th>강의설명</th>
        <th>상태</th>
        <th>개설일</th>
        <th>승인요청</th>
    </tr>
    </thead>
    <tbody>
<!--  각 행 누르면 그 강의번호를 유지하면서 선택창 실행  -->
    <tr th:each="course : ${courseList}"
        th:attr="data-id=${course.courseId}, data-title=${course.courseTitle}"
        onclick="showPopup(this.dataset.id, this.dataset.title)">
        <td th:text="${course.courseTitle}"></td>
        <td th:text="${course.courseDescription}"></td>
        <td th:text="${course.courseStatus == 'OPEN' ? '개설' : '미개설'}"></td>
        <td th:text="${#temporals.format(course.courseCreatedAt, 'yyyy. M. d.')}"></td>
        <td></td>
    </tr>
    </tbody>
</table>

<div class="empty-message" th:if="${courseList == null or courseList.isEmpty()}">
    등록된 강의가 없습니다.
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>

<div class="popup" id="popup">
    <h4 id="popupTitle">강의 메뉴</h4>
    <ul class="popup-menu">
        <li onclick="submitForm('chapter')">강의 상세 챕터 보기</li>
        <li onclick="submitForm('registchapter')">챕터 추가하기</li>
        <li onclick="submitForm('review')">강의평 보기</li>
        <li onclick="submitForm('studentlist')">수강생 보기</li>
        <li onclick="submitForm('update')">강의 수정하기</li>
        <li onclick="submitForm('deletecheck')">강의 삭제하기</li>
        <li onclick="submitForm('quiz')">퀴즈 보기</li>
        <li onclick="closePopup()">이전으로</li>
    </ul>
</div>

<form id="chapterForm" action="/teacher/course/chapter" method="post">
    <input type="hidden" name="courseId" id="chapterCourseId">
</form>
<form id="registchapterForm" action="/teacher/course/registchapterPage" method="post">
    <input type="hidden" name="courseId" id="registchapterCourseId">
</form>
<form id="reviewForm" action="/teacher/course/review" method="post">
    <input type="hidden" name="courseId" id="reviewCourseId">
</form>
<form id="studentlistForm" action="/teacher/course/studentlist" method="post">
    <input type="hidden" name="courseId" id="studentlistCourseId">
</form>
<form id="updateForm" action="/teacher/course/update" method="post">
    <input type="hidden" name="courseId" id="updateCourseId">
</form>
<form id="deletecheckForm" action="/teacher/course/deletecheck" method="post">
    <input type="hidden" name="courseId" id="deletecheckCourseId">
</form>
<form id="quizForm" action="/teacher/quiz/course-post" method="post">
    <input type="hidden" name="courseId" id="quizCourseId">
</form>


<form action="/teacher/teachermain" method="get">
    <button type="submit">이전으로</button>
</form>


<!-- 모달 HTML 포함 -->
<div th:replace="~{modal/modal :: modalHtml}"></div>

<!-- 모달 스크립트 포함 -->
<script th:replace="~{modal/modal :: modalScript}"></script>

<script th:inline="javascript">

      let selectedCourseId = null;

      function showPopup(courseId, courseTitle) {
          selectedCourseId = courseId;
          document.getElementById('popupTitle').textContent = courseTitle;
          document.getElementById('popup').classList.add('active');
          document.getElementById('overlay').classList.add('active');
      }

      function closePopup() {
          document.getElementById('popup').classList.remove('active');
          document.getElementById('overlay').classList.remove('active');
          selectedCourseId = null;
      }

      function submitForm(type) {
          document.getElementById(type + 'CourseId').value = selectedCourseId;
          document.getElementById(type + 'Form').submit();
      }
</script>

</body>
</html>
