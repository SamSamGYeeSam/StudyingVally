<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - Chapter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 기존 강의실 배경 설정 그대로 유지 */
        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #f0f0f0;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background-image: url('/image/room-bg.png'); /* 기존 배경 사용 */
            background-position: center;
            background-size: cover;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 반투명 오버레이 패널 */
        .glass-panel {
            width: 90%;
            height: 85%;
            background: rgba(46, 34, 30, 0.85); /* 짙은 갈색 반투명 */
            border: 4px solid #ffca28;
            outline: 2px solid #000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px); /* 배경 살짝 흐리게 */
            z-index: 100;
        }

        /* 헤더 섹션 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 202, 40, 0.3);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .title-text {
            color: #ffca28;
            font-size: 24px;
            margin: 0;
            text-shadow: 2px 2px 0 #000;
        }

        /* 프로그레스 바 (반투명 버전) */
        .progress-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #5d4037;
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            background: #444;
            height: 14px;
            border: 2px solid #000;
            margin-top: 5px;
        }

        .progress-bar-fill {
            background: #4caf50;
            height: 100%;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);
            transition: width 0.5s ease;
        }

        /* 테이블 스크롤 영역 */
        .scroll-list {
            flex: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: rgba(93, 64, 55, 0.9);
            color: #ffca28;
            padding: 10px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #000;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #eee;
            text-align: center;
        }

        tr:hover { background: rgba(255, 255, 255, 0.05); }

        /* 픽셀 버튼 */
        .pixel-btn {
            padding: 6px 12px;
            background: #8d6e63;
            color: white;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 12px;
            text-decoration: none;
            box-shadow: 2px 2px 0 #000;
        }

        .pixel-btn:hover { background: #6d4c41; transform: translateY(-1px); }
        .pixel-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 #000; }

        .btn-back { background: #e74c3c; padding: 8px 16px; font-size: 14px; }
        .btn-study { background: #2196f3; }

        .status-done { color: #4caf50; font-weight: bold; }
        .status-yet { color: #999; }

        /* 스크롤바 커스텀 */
        .scroll-list::-webkit-scrollbar { width: 8px; }
        .scroll-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .scroll-list::-webkit-scrollbar-thumb { background: #5d4037; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="room-container">
    <!-- 강의실 배경 위에 떠 있는 반투명 창 -->
    <div class="glass-panel">

        <div class="header-area">
            <h2 class="title-text">📜 챕터 가이드</h2>
            <form th:action="@{/student/course}" method="get">
                <button type="submit" class="pixel-btn btn-back">나가기 [ESC]</button>
            </form>
        </div>

        <div class="progress-box">
            <div style="display: flex; justify-content: space-between; color: #fff; font-size: 13px;">
                <span>현재 모험 진행도</span>
                <span th:text="${progress} + '%'">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" th:style="'width: ' + ${progress} + '%;'"></div>
            </div>
        </div>

        <div class="scroll-list">
            <table>
                <thead>
                <tr>
                    <th style="width: 30%;">챕터</th>
                    <th style="width: 40%;">내용</th>
                    <th style="width: 15%;">수강</th>
                    <th style="width: 15%;">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="chapter : ${chapters}">
                    <td th:text="${chapter.chapTitle}" style="text-align: left; color: #ffca28;">챕터 제목</td>
                    <td th:text="${chapter.chapDesc}" style="text-align: left; font-size: 12px; color: #ccc;">상세 설명</td>
                    <td>
                        <form th:action="@{/student/chapter/class}" method="post">
                            <input type="hidden" name="chapNo" th:value="${chapter.chapNo}">
                            <button type="submit" class="pixel-btn btn-study">START</button>
                        </form>
                    </td>
                    <td>
                        <span th:if="${#lists.contains(completedChapters, chapter.chapNo)}" class="status-done">✅</span>
                        <span th:unless="${#lists.contains(completedChapters, chapter.chapNo)}" class="status-yet">❓</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${progress == 100}" style="margin-top: 15px; text-align: center;">
            <form th:action="@{/student/evaluation/write}" method="post">
                <button type="submit" class="pixel-btn" style="background: #ffca28; color: #000; width: 100%; padding: 10px;">
                    🎉 모든 챕터 완료! 수강 후기 남기기
                </button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
