<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${chapter.chapTitle}">강의 시청</title>
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; font-family: sans-serif; }
        .video-header { padding: 20px; background: #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
        .video-container { width: 90%; max-width: 1000px; margin: 30px auto; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .video-footer { text-align: center; margin-top: 20px; padding-bottom: 50px; }

        .btn { padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; margin: 0 10px; font-weight: bold; }
        .btn-complete { background-color: #4caf50; color: white; }
        .btn-back { background-color: #607d8b; color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="video-header">
    <h2 th:text="${chapter.chapTitle}">챕터 제목</h2>
    <span th:text="'과목 번호: ' + ${courseId}">코스 ID</span>
</div>

<div class="video-container">
    <video width="100%" height="100%" controls controlsList="nodownload">
        <source th:src="${chapter.chapUrl}" type="video/mp4">
        브라우저가 비디오 태그를 지원하지 않습니다.
    </video>
</div>

<div class="video-footer">
    <button class="btn btn-complete" onclick="markAsComplete()">✅ 수강 완료</button>
    <button class="btn btn-back" th:onclick="|location.href='/student/chapter?courseId=${courseId}'|">🔙 돌아가기</button>
</div>

<script th:inline="javascript">
    function markAsComplete() {
        const chapNo = [[${chapter.chapNo}]];
        const courseId = [[${courseId}]];

        // 1. 서버에 수강 완료 데이터 전송
        fetch(`/student/chapter/complete?chapNo=${chapNo}&courseId=${courseId}`, {
            method: 'POST'
        })
            .then(response => {
                if(response.ok) {
                    alert("수강 완료! 강의는 어떠셨나요? 평가 페이지로 이동합니다. 🌟");

                    // 2. 컨트롤러(@GetMapping("/createrevaluation"))에 맞춰서 이동
                    // 쿼리 스트링(?courseId=...)을 붙여줘야 컨트롤러가 @RequestParam으로 받습니다.
                    // 주소가 /student/evaluation/write 로 바뀝니다.
                    location.href = `/student/evaluation/write?courseId=${courseId}`;
                } else {
                    alert("처리 중 오류가 발생했습니다.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("서버와 통신 중 문제가 발생했습니다.");
            });
    }
</script>

</body>
</html>
