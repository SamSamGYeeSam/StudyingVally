<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${chapter.chapTitle}">강의 시청 - Valley Quest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background-image: url('/image/room-bg.png');
            background-position: center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 메인 패널 - 좀 더 꽉 차게 조절 */
        .video-panel {
            width: 94%;
            height: 92%;
            background: rgba(0, 0, 0, 0.88);
            border: 4px solid #8d6e63;
            outline: 2px solid #000;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            z-index: 100;
        }

        /* 헤더 - 더 슬림하게 */
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3e2723;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .video-title {
            color: #ffca28;
            font-size: 18px;
            margin: 0;
            text-shadow: 2px 2px 0 #000;
        }

        /* 비디오 영역 - 비율 유지하면서 최대 확장 */
        .video-wrapper {
            flex: 1; /* 남은 공간 전부 차지 */
            background: #000;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 비율 유지하며 꽉 채움 */
        }

        /* 하단 컨트롤 - 버튼 크기 최적화 */
        .video-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding-top: 15px;
        }

        .pixel-btn {
            padding: 8px 18px; /* 버튼 크기 슬림하게 조정 */
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 14px;
            color: white;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
        }

        .btn-complete { background: #4caf50; }
        .btn-back { background: #607d8b; }

        .pixel-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }
        .pixel-btn:disabled { background: #999; cursor: not-allowed; transform: none; box-shadow: none; }

    </style>

    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>

</head>
<body>

<div class="room-container">
    <div class="video-panel">

        <div class="video-header">
            <h2 class="video-title" th:text="'📺 ' + ${chapter.chapTitle}">챕터 제목</h2>
        </div>

        <!-- 비디오가 차지하는 영역을 대폭 키움 -->
        <div class="video-wrapper">
            <video id="lectureVideo" controls controlsList="nodownload">
                <source th:src="${chapter.chapUrl}" type="video/mp4">
            </video>
        </div>

        <div class="video-footer">
            <button class="pixel-btn btn-complete" onclick="markAsComplete(this)">✅ 수강 완료 도장</button>
            <button class="pixel-btn btn-back" th:onclick="|location.href='/student/course'|">🔙 뒤로가기</button>
        </div>

    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>

<script th:inline="javascript">
    function markAsComplete(btn) {
        const chapNo = [[${chapter.chapNo}]];
        const courseId = [[${courseId}]];

        //

        btn.disabled = true;
        btn.innerText = "도장 찍는 중...";

        fetch(`/student/chapter/complete/${courseId}/${chapNo}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => {
                if(response.ok) {
                    alert("훌륭해! 도장을 쾅 찍었어! 💮");
                    location.href = "/student/course";
                } else {
                    alert("오류가 났네? 다시 한번 눌러줘!");
                    btn.disabled = false;
                    btn.innerText = "✅ 수강 완료 도장";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("서버 연결 실패!");
                btn.disabled = false;
            });
    }
</script>

<script th:replace="~{modal/modal :: modalScript}"></script>


</body>
</html>
