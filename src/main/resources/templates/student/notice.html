<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - Board</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 기본 배경 및 레이아웃 */
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 메인 컨테이너 (800x600 고정) */
        .room-container {
            position: fixed;
            width: 800px;
            height: 600px;
            background: #f0f0f0;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            background-image: url('/image/board-bg.png');
            background-position: center;
            background-size: cover;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .main-title {
            color: white;
            text-shadow: 2px 2px 4px #000;
            margin: 0;
            font-size: 26px;
        }

        /* 픽셀 버튼 스타일 */
        .pixel-btn {
            padding: 10px 16px;
            background: #8d6e63;
            color: white;
            border: 2px solid #000;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            display: block;
            box-shadow: 2px 2px 0 #000;
            font-family: 'DungGeunMo';
        }

        .pixel-btn:hover {
            background: #6d4c41;
            transform: translateY(-2px);
        }

        .pixel-btn.active {
            background: #ffca28;
            color: #000;
        }

        /* 탭 그룹 */
        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            z-index: 10;
        }

        .tab-btn { flex: 1; }

        /* 게시판 본체 (흰색 반투명 + 블러) */
        .board-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.25); /* 투명도 조정으로 배경 가독성 UP */
            backdrop-filter: blur(8px);
            border: 4px solid #5d4037;
            padding: 15px;
            color: #fff;
            overflow-y: auto;
            border-radius: 4px;
            z-index: 5;
            text-shadow: 1px 1px 2px #000;
        }

        /* 테이블 스타일 */
        .course-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .course-table th {
            border-bottom: 2px solid #fff;
            padding: 12px;
            text-align: center;
            color: #ffca28;
        }

        .course-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .clickable-title {
            text-align: left;
            cursor: pointer;
            font-weight: bold;
        }

        .clickable-title:hover {
            color: #ffca28;
            text-decoration: underline;
        }

        /* 스크롤바 커스텀 */
        .board-content::-webkit-scrollbar { width: 8px; }
        .board-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        .board-content::-webkit-scrollbar-thumb { background: #5d4037; border-radius: 4px; }

        /* ---------------------------------
           [신규] 팝업(SweetAlert2) 디자인 커스텀
        ---------------------------------- */
        .swal-pixel-popup {
            background: rgba(255, 248, 225, 0.95) !important; /* 베이지색 반투명 */
            backdrop-filter: blur(10px);
            border: 6px solid #5d4037 !important; /* 두꺼운 테두리 */
            box-shadow: 10px 10px 0 rgba(0,0,0,0.2) !important; /* 픽셀 그림자 */
            border-radius: 0 !important;
            font-family: 'DungGeunMo' !important;
        }

        .swal-pixel-title {
            color: #5d4037 !important;
            font-size: 22px !important;
            border-bottom: 3px dashed #8d6e63;
            padding-bottom: 15px !important;
            margin: 0 10px !important;
        }

        .swal-pixel-content {
            color: #333 !important;
            font-size: 16px !important;
            line-height: 1.6 !important;
            background: rgba(255,255,255,0.5);
            margin: 20px 10px !important;
            padding: 15px !important;
            border: 2px solid #8d6e63;
        }
    </style>
</head>
<body>

<div class="room-container">
    <div class="header-area">
        <h3 class="main-title">📜 VALLEY BOARD</h3>
        <button class="pixel-btn" style="background: #607d8b;" onclick="location.href='/student/main'">
            🏠 메인으로
        </button>
    </div>

    <div class="tab-group">
        <button id="tab-admin" class="pixel-btn tab-btn active" onclick="switchTab('admin')">📢 공지사항</button>
        <button id="tab-course" class="pixel-btn tab-btn" onclick="switchTab('course')">🎓 강의 소식</button>
    </div>

    <div class="board-content">
        <div id="admin-section">
            <table class="course-table">
                <thead>
                <tr>
                    <th style="width: 25%;">날짜</th>
                    <th style="width: 75%;">공지 내용</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notice : ${adminNotices}">
                    <td th:text="${#strings.substring(notice.createdDate, 0, 10)}">2026-04-21</td>
                    <td class="clickable-title"
                        th:text="${notice.noticeTitle}"
                        th:data-title="${notice.noticeTitle}"
                        th:data-desc="${notice.noticeDesc}"
                        onclick="openDetail(this.getAttribute('data-title'), this.getAttribute('data-desc'))">
                        공지 제목
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(adminNotices)}">
                    <td colspan="2" style="padding:30px; opacity:0.8; text-align: center;">등록된 공지사항이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div id="course-section" style="display: none;">
            <table class="course-table">
                <thead>
                <tr>
                    <th style="width: 20%;">날짜</th>
                    <th style="width: 20%;">강사</th>
                    <th style="width: 60%;">강의 소식</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cn : ${courseNotices}">
                    <td th:text="${#strings.substring(cn.createdDate, 0, 10)}">2026-04-21</td>
                    <td th:text="${cn.userNickname}" style="color: #ffca28;">강사명</td>
                    <td class="clickable-title"
                        th:text="${cn.courseNoticeTitle}"
                        th:data-title="${cn.courseNoticeTitle}"
                        th:data-desc="${cn.courseNoticeDesc}"
                        onclick="openDetail(this.getAttribute('data-title'), this.getAttribute('data-desc'))">
                        소식 제목
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(courseNotices)}">
                    <td colspan="3" style="padding:30px; opacity:0.8; text-align: center;">참여 중인 강의 소식이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function switchTab(type) {
        const adminSec = document.getElementById('admin-section');
        const courseSec = document.getElementById('course-section');
        const tabAdmin = document.getElementById('tab-admin');
        const tabCourse = document.getElementById('tab-course');

        if (type === 'admin') {
            adminSec.style.display = 'block';
            courseSec.style.display = 'none';
            tabAdmin.classList.add('active');
            tabCourse.classList.remove('active');
        } else {
            adminSec.style.display = 'none';
            courseSec.style.display = 'block';
            tabAdmin.classList.remove('active');
            tabCourse.classList.add('active');
        }
    }

    function openDetail(title, content) {
        Swal.fire({
            title: title,
            html: content,
            confirmButtonText: '확인',
            confirmButtonColor: '#8d6e63',
            // [중요] 팝업 시 화면 꿀렁임(스크롤바 사라짐) 방지
            scrollbarPadding: false,
            allowOutsideClick: true,
            heightAuto: false,
            customClass: {
                popup: 'swal-pixel-popup',
                title: 'swal-pixel-title',
                htmlContainer: 'swal-pixel-content'
            },
            showClass: {
                popup: 'animated fadeInDown faster'
            }
        });
    }
</script>

</body>
</html>
