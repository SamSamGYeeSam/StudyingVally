<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - School</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        .room-container {
            position: fixed;
            width: 800px;
            height: 600px;
            background-image: url('/image/school-bg.png');
            background-position: center;
            background-size: cover;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        /* 헤더 영역 */
        .school-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            z-index: 10;
        }

        .pixel-title {
            color: #ffca28;
            font-size: 28px;
            text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
            margin: 0;
        }

        /* [중요] 게시판 본체 및 겹침 방지 설정 */
        .main-content-scroll {
            flex: 1;
            background: rgba(46, 34, 34, 0.85); /* 배경을 조금 더 어둡게 해서 글자 가독성 확보 */
            border: 4px solid #5d4037;
            border-radius: 2px;
            overflow-y: auto;
            position: relative;
        }

        .course-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        /* [해결] 헤더 겹침 방지: 투명도 제거 및 배경색 확실히 지정 */
        .course-table thead th {
            position: sticky;
            top: 0;
            background: #5d4037; /* 스크롤해도 뒤의 글자가 보이지 않게 불투명하게 */
            color: #ffca28;
            padding: 15px 5px;
            z-index: 20;
            border-bottom: 3px solid #ffca28;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); /* 아래쪽 경계 구분 */
        }

        .course-table td {
            padding: 15px 8px;
            text-align: center;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            vertical-align: middle;
        }

        /* 픽셀 버튼들 */
        .pixel-btn {
            padding: 8px 12px;
            background: #8d6e63;
            color: white;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 13px;
            box-shadow: 2px 2px 0 #000;
            transition: all 0.1s;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        .btn-regist { background: #4caf50; }
        .btn-view { background: #ffca28; color: #000; }
        .btn-done { background: #7f8c8d; cursor: not-allowed; opacity: 0.7; box-shadow: none; }

        .desc-link {
            color: #64b5f6;
            text-decoration: underline;
            cursor: pointer;
        }

        /* 스크롤바 디자인 */
        .main-content-scroll::-webkit-scrollbar { width: 10px; }
        .main-content-scroll::-webkit-scrollbar-track { background: #3e2723; }
        .main-content-scroll::-webkit-scrollbar-thumb { background: #8d6e63; border: 2px solid #3e2723; }

        /* [신규] 팝업 스타일 - 진짜 게임 창처럼 */
        .game-popup {
            background: #fff8e1 !important;
            border: 6px solid #5d4037 !important;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3) !important;
            border-radius: 0 !important;
        }

        .game-popup-title {
            background: #5d4037;
            color: #ffca28 !important;
            margin: 0 !important;
            padding: 10px !important;
            font-family: 'DungGeunMo' !important;
        }
    </style>
    <th:block th:replace="~{modal/modal :: modalCss}"></th:block>
</head>
<body>

<div class="room-container">
    <div class="school-header">
        <h2 class="pixel-title">🏫 VALLEY SCHOOL</h2>
        <button class="pixel-btn" style="background: #e74c3c;" onclick="location.href='/student/main'">나가기</button>
    </div>

    <div class="main-content-scroll">
        <table class="course-table">
            <thead>
            <tr>
                <th style="width: 18%;">DATE</th>
                <th style="width: 15%;">TUTOR</th>
                <th style="width: 27%;">TITLE</th>
                <th style="width: 12%;">DESC</th>
                <th style="width: 14%;">REVIEW</th>
                <th style="width: 14%;">APPLY</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.courseCreatedAt != null ? #temporals.format(course.courseCreatedAt, 'yyyy-MM-dd') : '-'}">2026-04-14</td>
                <td th:text="${course.user != null ? course.user.userNickname : '익명'}" style="color: #ffca28;">강사</td>
                <td th:text="${course.courseTitle}" style="text-align: left; padding-left: 15px;">강의 제목</td>
                <td>
                    <span class="desc-link" th:data-title="${course.courseTitle}" th:data-desc="${course.courseDescription}" onclick="openGameDesc(this)">[보기]</span>
                </td>
                <td>
                    <button class="pixel-btn btn-view" th:data-id="${course.courseId}" th:data-title="${course.courseTitle}" onclick="openGameReview(this)">조회</button>
                </td>
                <td>
                    <div th:if="${enrolledCourseIds.contains(course.courseId)}">
                        <button class="pixel-btn btn-done" disabled>수강중</button>
                    </div>
                    <div th:unless="${enrolledCourseIds.contains(course.courseId)}">
                        <form th:action="@{/student/school/regist}" method="post">
                            <input type="hidden" name="courseId" th:value="${course.courseId}">
                            <button type="submit" class="pixel-btn btn-regist">신청</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{modal/modal :: modalHtml}"></div>
<script th:replace="~{modal/modal :: modalScript}"></script>

<script th:inline="javascript">
    // 공통 게임 스타일 팝업 호출 함수
    function gameAlert(title, html) {
        Swal.fire({
            title: title,
            html: `<div style="font-family:'DungGeunMo'; padding:10px; color:#5d4037; text-align:left; line-height:1.5;">${html}</div>`,
            confirmButtonText: '확인',
            confirmButtonColor: '#8d6e63',
            scrollbarPadding: false,
            scrollbarPadding: false,
            allowOutsideClick: true,
            heightAuto: false,
            customClass: {
                popup: 'game-popup',
                title: 'game-popup-title'
            }
        });
    }

    function openGameDesc(el) {
        const title = el.getAttribute('data-title');
        const desc = el.getAttribute('data-desc');
        gameAlert(`📜 ${title}`, desc || "등록된 설명이 없습니다.");
    }

    function openGameReview(el) {
        const courseId = el.getAttribute('data-id');
        const title = el.getAttribute('data-title');

        fetch(`/student/evaluations/${courseId}`)
            .then(res => res.json())
            .then(data => {
                let html = "";
                if (!data.length) html = "<p style='text-align:center;'>아직 리뷰가 없어요!</p>";
                else {
                    data.forEach(r => {
                        html += `<div style="border-bottom:2px dashed #8d6e63; padding:10px 0;">
                                    <b style="color:#f39c12;">⭐ ${r.score.toFixed(1)}</b> | ${r.nickname || '익명'}<br>
                                    <span style="font-size:14px;">${r.content}</span>
                                 </div>`;
                    });
                }
                gameAlert(`🌟 ${title} 리뷰`, html);
            });
    }
</script>

</body>
</html>
