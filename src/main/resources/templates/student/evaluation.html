<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - Evaluation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
        }

        /* 동일한 강의실 배경 컨테이너 */
        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background-image: url('/image/room-bg.png');
            background-position: center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 강의평용 반투명 패널 */
        .eval-panel {
            width: 550px;
            background: rgba(253, 241, 213, 0.95); /* 따뜻한 양피지색 반투명 */
            border: 6px solid #5d4037;
            outline: 2px solid #000;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 100;
        }

        h2 {
            text-align: center;
            color: #3e2723;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
            border-bottom: 3px double #5d4037;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #5d4037;
            font-size: 16px;
        }

        /* 픽셀 스타일 입력창 */
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid #5d4037;
            background: #fff;
            font-family: 'DungGeunMo';
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, textarea:focus {
            border-color: #ffca28;
            background: #fffdf7;
        }

        textarea {
            height: 160px;
            resize: none;
            line-height: 1.5;
        }

        /* 하단 버튼 그룹 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .pixel-btn {
            padding: 12px 30px;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'DungGeunMo';
            font-size: 16px;
            font-weight: bold;
            color: white;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
        }

        .btn-submit { background-color: #4caf50; }
        .btn-cancel { background-color: #e74c3c; }

        .pixel-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
        .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

        /* 장식: 별 아이콘 */
        .star-deco {
            color: #ffca28;
            font-size: 20px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="room-container">
    <div class="eval-panel">
        <div class="star-deco">✨ ⭐ ✨</div>
        <h2>모험의 기록 남기기</h2>

        <form th:action="@{/student/evaluation/save}" method="post">
            <input type="hidden" name="courseId" th:value="${courseId}">

            <div class="form-group">
                <label>🎖 모험 만족도 (별점)</label>
                <select name="rating" required>
                    <option value="5">⭐⭐⭐⭐⭐ (전설적인 강의!)</option>
                    <option value="4">⭐⭐⭐⭐ (훌륭한 여정이었어)</option>
                    <option value="3">⭐⭐⭐ (무난한 수련회)</option>
                    <option value="2">⭐⭐ (조금 힘들었어)</option>
                    <option value="1">⭐ (NPC가 불친절해..)</option>
                </select>
            </div>

            <div class="form-group">
                <label>📜 수강 후기 기록</label>
                <textarea name="content" placeholder="이 강의를 통해 무엇을 배웠나요? 솔직한 후기를 남겨주세요." required></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="pixel-btn btn-submit">등록하기</button>
                <button type="button" class="pixel-btn btn-cancel" th:onclick="|location.href='/student/course'|">취소</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
