<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의평가 작성 - 스타잉밸리</title>
    <style>
        /* 기존 스타일 유지 */
        .container { width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 150px; resize: none; }
        .btn-group { text-align: center; margin-top: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-submit { background-color: #4caf50; color: white; margin-right: 10px; }
        .btn-cancel { background-color: #f44336; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 강의는 어떠셨나요?</h2>
    <form th:action="@{/student/evaluation/save}" method="post">
        <input type="hidden" name="courseId" th:value="${courseId}">

        <div class="form-group">
            <label>별점</label>
            <select name="rating" required>
                <option value="5">⭐⭐⭐⭐⭐ (최고예요!)</option>
                <option value="4">⭐⭐⭐⭐ (좋아요)</option>
                <option value="3">⭐⭐⭐ (보통이에요)</option>
                <option value="2">⭐⭐ (아쉬워요)</option>
                <option value="1">⭐ (별로예요)</option>
            </select>
        </div>

        <div class="form-group">
            <label>수강 후기</label>
            <textarea name="content" placeholder="강의에 대한 솔직한 평을 남겨주세요." required></textarea>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-submit">등록하기</button>
            <button type="button" class="btn btn-cancel" th:onclick="|location.href='/student/chapter?courseId=${courseId}'|">취소</button>
        </div>
    </form>
</div>

</body>
</html>
