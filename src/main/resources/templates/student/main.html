<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Valley - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'DungGeunMo', sans-serif; background: #2c3e50; }
        #viewport { display: flex; width: 200vw; height: 100vh; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .section { width: 100vw; height: 100vh; position: relative; flex-shrink: 0; }

        #field { background: url('/image/stardew-main2.png') no-repeat center; background-size: cover; }
        #course-zone { background: url('/image/stardew-main2.png') no-repeat center; background-size: cover; position: relative; display: flex; justify-content: center; align-items: center; }

        #character {
            position: fixed; width: 64px; height: 128px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            transform: translate(-50%, -85%);
            z-index: 1000; pointer-events: none; image-rendering: pixelated;
            transition: transform 0.1s ease-out;
        }

        @keyframes walk-bob {
            0% { margin-top: 0px; }
            50% { margin-top: -5px; }
            100% { margin-top: 0px; }
        }

        .walking {
            animation: walk-bob 0.2s infinite;
        }

        .entity { position: absolute; display: flex; flex-direction: column; align-items: center; transition: z-index 0.1s; cursor: pointer; }
        .entity img { image-rendering: pixelated; filter: drop-shadow(5px 5px 0px rgba(0,0,0,0.2)); pointer-events: none; }

        .entity-label {
            background: #fdf1d5; color: #4e342e; padding: 4px 10px; border: 3px solid #5d4037;
            border-radius: 6px; font-size: 15px; font-weight: bold; opacity: 0;
            transition: 0.2s; white-space: nowrap; pointer-events: none; margin-bottom: 2px;
            position: relative; z-index: 1002;
            order: 1; margin-bottom: 2px;
        }
        .entity:hover .entity-label { opacity: 1; transform: translateY(-2px); }

        #dungeon .entity-label,
        #school .entity-label {
            order: 3;
            margin-bottom: 0;
            margin-top: 2px;
        }

        #dungeon:hover .entity-label,
        #school:hover .entity-label {
            transform: translateY(2px);
        }

        #dungeon img { width: 630px; }
        #school img { width: 540px; }
        #notice img { width: 170px; }
        #home img { width: 260px; }
        #npc img { width: 400px; }

        .course-card { position: absolute; display: flex; flex-direction: column; align-items: center; text-decoration: none; pointer-events: auto; }
        .course-card img { width: 320px; image-rendering: pixelated; cursor: pointer; transition: 0.2s; }
        .pixel-text {
            color: #fdf1d5; margin-top: -15px; font-size: 20px;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="character"
     th:data-gender="${student.userGender == 'M' ? 'm' : 'f'}"
     th:style="|background-image: url('/image/${student.userGender == 'M' ? 'm' : 'f'}-front.png');|">
</div>

<div id="viewport">
    <div id="field" class="section">
        <div id="dungeon" class="entity" data-url="/student/quiz/room" style="top: 2%; left: -2%;">
            <div class="entity-label">💀 던전</div>
            <img src="/image/dungeon-icon.png">
        </div>
        <div id="school" class="entity" data-url="/student/school" style="top: -15%; left: 57%;">
            <div class="entity-label">🏫 학교</div>
            <img src="/image/school-icon.png">
        </div>
        <div id="notice" class="entity" data-url="/student/notice" style="top: 22%; left: 45%;">
            <div class="entity-label">📜 게시판</div>
            <img src="/image/notice-icon.png">
        </div>
        <div id="home" class="entity" data-url="/student/home" style="top: 46%; left: 20%;">
            <div class="entity-label">🏡 우리집</div>
            <img src="/image/home-icon.png">
        </div>
        <div id="npc" class="entity" data-url="/npc" style="top: 47%; left: 70%;">
            <div class="entity-label">🤖 NPC</div>
            <img src="/image/npc-icon.png">
        </div>
    </div>


    <form id="enterCourseForm" th:action="@{/student/course/enter}" method="post" style="display:none;">
        <input type="hidden" name="courseId" id="hiddenCourseId">
    </form>

    <div id="course-zone" class="section">
        <div th:each="enroll : ${enrollments}" class="course-card">
            <div th:onclick="'submitCourseEntry(' + ${enroll.course.courseId} + ')'" style="text-align: center; cursor: pointer;">
                <img src="/image/room-icon.png">
                <p class="pixel-text" th:text="${enroll.course.courseTitle}">강의명</p>
            </a>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const viewport = document.getElementById('viewport');
    const character = document.getElementById('character');
    const gender = character.dataset.gender;
    const entities = document.querySelectorAll('.entity');
    const courseCards = document.querySelectorAll('.course-card');

    let isRedirecting = false;
    let currentPage = 1;
    let isTransitioning = false;
    let keys = {};
    let lastKey = "";
    let charX = window.innerWidth * 0.5;
    let charY = window.innerHeight * 0.8;
    const speed = 5;

    window.addEventListener('pageshow', () => {
        isRedirecting = true;
        isTransitioning = false;
        keys = {};
        setTimeout(() => { isRedirecting = false; }, 1000);
    });

    entities.forEach(ent => {
        ent.addEventListener('click', () => { window.location.href = ent.dataset.url; });
    });

    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; lastKey = e.key.toLowerCase(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    function gameLoop() {
        if (!isTransitioning) {
            let dx = 0; let dy = 0;
            let direction = "front";

            if (keys['arrowleft'] || keys['a']) { dx -= speed; direction = "left"; }
            else if (keys['arrowright'] || keys['d']) { dx += speed; direction = "right"; }
            else if (keys['arrowup'] || keys['w']) { dy -= speed; direction = "back"; }
            else if (keys['arrowdown'] || keys['s']) { dy += speed; direction = "front"; }

            if (dx !== 0 || dy !== 0) {
                charX += dx; charY += dy;
                handleMapTransition();

                character.style.left = charX + 'px';
                character.style.top = charY + 'px';

                let imgDir = (direction === "left") ? "right" : direction;
                character.style.backgroundImage = `url('/image/${gender}-${imgDir}.png')`;

                if (direction === "left") {
                    character.style.transform = `translate(-50%, -85%) scaleX(-1)`;
                } else {
                    character.style.transform = `translate(-50%, -85%) scaleX(1)`;
                }

                character.classList.add('walking');

                updateZIndex();
                if (!isRedirecting) checkCollision();
            } else {
                character.classList.remove('walking');
                character.style.backgroundImage = `url('/image/${gender}-front.png')`;            }
        }
        requestAnimationFrame(gameLoop);
    }


    function handleMapTransition() {
        if (currentPage === 1 && charX > window.innerWidth - 10) {
            isTransitioning = true;
            viewport.style.transform = 'translateX(-100vw)';
            currentPage = 2; charX = 60;
            setTimeout(() => isTransitioning = false, 600);
        } else if (currentPage === 2 && charX < 10) {
            isTransitioning = true;
            viewport.style.transform = 'translateX(0)';
            currentPage = 1; charX = window.innerWidth - 60;
            setTimeout(() => isTransitioning = false, 600);
        }
    }

    function updateZIndex() {
        entities.forEach(ent => {
            const entRect = ent.getBoundingClientRect();
            const entBottom = entRect.top + entRect.height;
            ent.style.zIndex = (charY < entBottom) ? "1001" : "999";
        });
    }

    function submitCourseEntry(courseId) {
        document.getElementById('hiddenCourseId').value = courseId;
        document.getElementById('enterCourseForm').submit();
    }

    function checkCollision() {
        if (isRedirecting || isTransitioning) return;
        const charRect = character.getBoundingClientRect();
        const footX = charRect.left + (charRect.width / 2);
        const footY = charRect.bottom - 10;

        if (currentPage === 1) {
            entities.forEach(ent => {
                const rect = ent.getBoundingClientRect();

                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);

                const thresholdX = rect.width * 0.15;
                const thresholdY = rect.height * 0.15;

                if (Math.abs(footX - centerX) < thresholdX && Math.abs(footY - centerY) < thresholdY) {
                    isRedirecting = true;
                    window.location.href = ent.dataset.url;
                }
            });
        } else {
            courseCards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);

                const thresholdX = rect.width * 0.2;
                const thresholdY = rect.height * 0.2;

                if (Math.abs(footX - centerX) < thresholdX && Math.abs(footY - centerY) < thresholdY) {
                    isRedirecting = true;
                    const courseId = card.querySelector('div').getAttribute('onclick').match(/\d+/)[0];
                    submitCourseEntry(courseId);
                }
            });
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const fixedPositions = [{left:70,top:20},{left:35,top:60},{left:40,top:20},{left:75,top:60},{left:10,top:60}];
        courseCards.forEach((card, index) => {
            if (fixedPositions[index]) {
                card.style.left = fixedPositions[index].left + "%";
                card.style.top = fixedPositions[index].top + "%";
            }
        });
        requestAnimationFrame(gameLoop);
    });
</script>
</div>
</body>
</html>
