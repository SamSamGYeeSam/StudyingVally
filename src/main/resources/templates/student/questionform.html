<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Studying Valley - questionform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
  <style>
    body {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'DungGeunMo', sans-serif;
      overflow: hidden;
    }

    .form-container {
      position: relative;
      width: 500px;
      background: #fdf1d5;
      border: 6px solid #5d4037;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      padding: 40px;
      border-radius: 4px;
    }

    h2 {
      color: #4e342e;
      text-align: center;
      margin-top: 0;
      border-bottom: 3px double #5d4037;
      padding-bottom: 10px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #5d4037;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 18px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 3px solid #8d6e63;
      background: #fff;
      font-family: 'DungGeunMo', sans-serif;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #4caf50;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .pixel-btn {
      flex: 1;
      padding: 12px;
      color: white;
      border: 3px solid #000;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      font-family: 'DungGeunMo', sans-serif;
      transition: 0.2s;
    }

    .submit-btn { background: #4caf50; }
    .submit-btn:hover { background: #388e3c; transform: translateY(-3px); }

    .cancel-btn { background: #607d8b; }
    .cancel-btn:hover { background: #455a64; transform: translateY(-3px); }

    .npc-mini-icon {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

<div class="form-container">
  <img th:src="@{/image/{gender}-npc.png(gender=${instructorGender == 'M' ? 'm' : 'f'})}"
       alt="NPC" class="npc-image" id="npcImgElement">

  <h2>마법사에게 질문하기</h2>

  <form th:action="@{/student/course/question/save}" method="post" novalidate>
    <input type="hidden" name="courseId" th:value="${courseId}">

    <div class="input-group">
      <label>📜 질문 제목</label>
      <input type="text" name="title" placeholder="어떤 것이 궁금한가?" required>
    </div>

    <div class="input-group">
      <label>💬 상세 내용</label>
      <textarea name="desc" rows="8" placeholder="막히는 부분이나 에러 코드를 상세히 적어주게나!" required></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="pixel-btn submit-btn">편지 보내기</button>
      <a th:href="@{/student/course(id=${courseId})}" class="pixel-btn cancel-btn">그만두기</a>
    </div>
  </form>
</div>

</body>
</html>
