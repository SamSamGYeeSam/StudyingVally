<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Studying Valley - questionform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.css">
  <style>
    /* 배경 설정: 이전 페이지와 동일하게 */
    body {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'DungGeunMo', sans-serif;
      overflow: hidden;
    }

    /* 800x600 강의실 컨테이너와 동일한 외곽 틀 */
    .room-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #f0f0f0;
      border: 6px solid #5d4037;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      background-image: url('/image/room-bg.png'); /* 배경 이미지 유지 */
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 질문 폼 카드 */
    .form-container {
      position: relative;
      width: 480px;
      background: #fdf1d5;
      border: 6px solid #5d4037;
      padding: 40px 30px 30px 30px;
      border-radius: 4px;
      z-index: 10;
    }

    h2 {
      color: #4e342e;
      text-align: center;
      margin-top: 15px; /* 캐릭터 공간 확보 */
      border-bottom: 3px double #5d4037;
      padding-bottom: 10px;
      font-size: 22px;
    }

    /* 캐릭터 이미지: 폼 상단 정중앙 */
    .npc-mini-icon {
      position: absolute;
      top: -65px; /* 폼 위로 절반쯤 튀어나오게 */
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
    }

    .input-group { margin-bottom: 18px; }

    label {
      display: block;
      color: #5d4037;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 17px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 3px solid #8d6e63;
      background: #fff;
      font-family: 'DungGeunMo', sans-serif;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus { border-color: #4caf50; }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .pixel-btn {
      flex: 1;
      padding: 10px;
      color: white;
      border: 3px solid #000;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      font-family: 'DungGeunMo', sans-serif;
      transition: 0.2s;
    }

    .submit-btn { background: #4caf50; }
    .submit-btn:hover { background: #388e3c; transform: translateY(-3px); }

    .cancel-btn { background: #607d8b; }
    .cancel-btn:hover { background: #455a64; transform: translateY(-3px); }
  </style>
</head>
<body>

<div class="room-container">
  <div class="form-container">
    <!-- 마법사 캐릭터 이미지 -->
    <img th:src="@{/image/{gender}-npc.png(gender=${instructorGender == 'M' ? 'm' : 'f'})}"
         alt="NPC" class="npc-mini-icon">

    <h2 th:text="|${instructorNickname} 마법사에게 질문|">마법사에게 질문</h2>

    <form th:action="@{/student/course/question/save}" method="post" novalidate>
      <input type="hidden" name="courseId" th:value="${courseId}">

      <div class="input-group">
        <label>📜 질문 제목</label>
        <input type="text" name="title" placeholder="어떤 것이 궁금한가?" required>
      </div>

      <div class="input-group">
        <label>💬 상세 내용</label>
        <textarea name="desc" rows="6" placeholder="막히는 부분이나 에러 코드를 상세히 적어주게나!" required></textarea>
      </div>

      <div class="btn-group">
        <button type="submit" class="pixel-btn submit-btn">편지 보내기</button>
        <a th:href="@{/student/course}" class="pixel-btn cancel-btn">그만두기</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
