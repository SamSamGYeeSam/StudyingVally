<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스터딩밸리 공지사항</title>
    <style>
        body {
            font-family: 'NanumSquareRound', sans-serif;
            background-color: #F5F5F0;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #4A6F5A;
            text-align: center;
            margin-bottom: 30px;
        }

        /* 탭 스타일 */
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #A3C18D;
        }

        .tab-btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: #4A6F5A;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
            transition: background-color 0.3s;
        }

        .tab-btn.active {
            background-color: #4A6F5A;
            color: #fff;
        }

        .tab-btn:hover:not(.active) {
            background-color: #E6EFEC;
        }

        /* 공지사항 목록 스타일 */
        .notice-list {
            list-style: none;
            padding: 0;
        }

        .notice-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
        }

        .notice-item:hover {
            background-color: #F9FCFB;
        }

        .notice-icon {
            margin-right: 15px;
            font-size: 1.2em;
        }

        .notice-title {
            flex-grow: 1;
            font-weight: bold;
        }

        .notice-date {
            color: #888;
            font-size: 0.9em;
        }

        .new-icon {
            color: #A3C18D;
            font-weight: bold;
            margin-left: 5px;
        }

        /* 테이블 스타일 (필요시 사용) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #A3C18D;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #F9FCFB;
        }

        .clickable-title {
            cursor: pointer;
            color: #4A6F5A;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 스터딩밸리 소식통</h1>

    <div class="tabs">
        <button class="tab-btn active">전체 공지</button>
        <button class="tab-btn">강의 공지</button>
    </div>

    <ul class="notice-list">
        <li class="notice-item">
            <span class="notice-icon">🌿</span>
            <span class="notice-title">스터딩밸리 이용 가이드 (필독!)</span>
            <span class="notice-date">2026.04.16</span>
        </li>
        <li class="notice-item">
            <span class="notice-icon">📢</span>
            <span class="notice-title">자바 프로그래밍 입문 강의 개설 안내</span>
            <span class="notice-date">2026.04.15</span>
            <span class="new-icon">N</span>
        </li>
        <li class="notice-item">
            <span class="notice-icon">🔧</span>
            <span class="notice-title">시스템 점검 안내 (4/20 새벽 2시~6시)</span>
            <span class="notice-date">2026.04.14</span>
        </li>
    </ul>

</div>

</body>
</html>
