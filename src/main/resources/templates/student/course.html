<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의실 - 스타잉밸리</title>
    <style>
        /* 기본 레이아웃 */
        .room-container { position: relative; width: 800px; height: 600px; margin: 0 auto; background: #f0f0f0; border: 4px solid #5d4037; }

        /* 진행률 바 스타일 */
        .progress-container { position: absolute; top: 20px; left: 20px; width: 300px; z-index: 10; }
        .progress-bar-background { background-color: #e0e0e0; border: 2px solid #000; height: 20px; width: 100%; }
        .progress-bar-fill { background-color: #4caf50; height: 100%; transition: width 0.5s ease-in-out; }

        /* 메뉴 버튼들 */
        .menu-container { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; }
        .pixel-btn { padding: 10px 20px; background: #8d6e63; color: white; border: 2px solid #000; cursor: pointer; text-decoration: none; font-size: 14px; }
        .pixel-btn:hover { background: #6d4c41; }

        /* NPC 대화창 영역 (이미지의 브로콜리 NPC 자리) */
        .npc-section { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); text-align: center; }
        .npc-dialog { background: white; border: 3px solid #000; padding: 15px; border-radius: 10px; margin-bottom: 10px; min-width: 200px; }
    </style>
</head>
<body>

<div class="room-container">
    <div class="progress-container">
        <p>학습 진행률: <span th:text="${progress}">0</span>%</p>
        <div class="progress-bar-background">
            <div class="progress-bar-fill" th:style="'width: ' + ${progress} + '%;'"></div>
        </div>
    </div>

    <div class="npc-section">
        <div class="npc-dialog">
            <p>안녕하세요! 오늘 공부는 어디까지 하실 건가요?</p>
        </div>
        <div class="npc-sprite">🥦</div>
    </div>

    <div class="menu-container">
        <a th:href="@{/student/chapter(courseId=${courseId})}" class="pixel-btn">챕터 목록</a>

        <a th:href="@{/student/createreview(courseId=${courseId})}" class="pixel-btn">강의평 쓰기</a>

        <a th:href="@{/student/home/courses}" class="pixel-btn">나가기</a>
    </div>
</div>

</body>
</html>
