<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studying Vally - home</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .room-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #f0f0f0;
            border: 6px solid #5d4037;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            background-image: url('/image/home_bg.png');
            background-position: center;
            background-size: cover;
            overflow: hidden;
        }

        #player-character {
            position: absolute;
            width: 128px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: left 2s linear, top 2s linear;
            image-rendering: pixelated;
        }

        #player-character .char-image {
            width: 70%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .char-image {
            width: 100px;
            height: auto;
        }

        .char-label {
            margin-top: 5px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .main-content {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 500px;
            display: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border: 4px solid #5d4037;
            padding: 20px;
            z-index: 100;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        .menu-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .pixel-btn {
            padding: 10px 16px;
            background: #8d6e63;
            color: white;
            border: 2px solid #000;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            display: block;
            box-shadow: 2px 2px 0 #000;
        }

        .pixel-btn:hover {
            background: #6d4c41;
            transform: translateY(-2px);
        }

        .pixel-btn.active {
            background: #ffca28;
            color: #000;
        }

        .pixel-btn.danger {
            background: #e74c3c;
        }

        .course-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .course-table th {
            border-bottom: 2px solid #fff;
            padding: 8px;
        }

        .course-table td {
            padding: 8px;
            text-align: center;
        }

        #welcome-msg {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        /* ── 비밀번호 모달 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1001;
        }
        .modal-overlay.active { display: block; }

        .common-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 248, 225, 0.97);
            padding: 30px 30px 24px;
            border: 6px solid #5d4037;
            border-radius: 0;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.25);
            z-index: 1002;
            width: 420px;
            text-align: center;
            font-family: 'DungGeunMo', sans-serif;
        }
        .common-modal.active { display: block; }

        .common-modal h3 {
            margin: 0 10px 0;
            padding-bottom: 14px;
            font-size: 20px;
            color: #5d4037;
            border-bottom: 3px dashed #8d6e63;
        }

        .common-modal p {
            margin: 18px 10px;
            padding: 14px;
            font-size: 15px;
            line-height: 1.7;
            color: #333;
            background: rgba(255,255,255,0.55);
            border: 2px solid #8d6e63;
            text-align: left;
        }

        .common-modal button {
            padding: 10px 32px;
            border: 2px solid #000;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'DungGeunMo', sans-serif;
            font-weight: bold;
            color: white;
            box-shadow: 3px 3px 0 #000;
        }
        .common-modal button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="room-container" id="homeRoom">

    <form id="evaluationForm" method="post" style="display:none;">
        <input type="hidden" name="courseId" id="evalCourseId">
    </form>

    <div id="welcome-msg">
        <h3 style="margin:0;">👨‍🌾 <span th:text="${student.userNickname}">학생</span>님의 방</h3>
    </div>

    <div id="player-character" th:data-gender="${student.userGender == 'M' ? 'm' : 'f'}">
        <img th:src="@{/image/{gender}-front.png(gender=${student.userGender == 'M' ? 'm' : 'f'})}"
             class="char-image" id="target-char-img" alt="My Character">
        <div class="char-label">나</div>
    </div>

    <div class="menu-container">
        <button class="pixel-btn" id="course-btn" onclick="showSection('course-section', this)">📚 수강 강의 조회</button>
        <button class="pixel-btn" onclick="openInfoPasswordPopup()">👤 정보 수정</button>
        <button class="pixel-btn danger" onclick="confirmWithdraw()">🚪 회원 탈퇴</button>
        <button class="pixel-btn" style="background: #607d8b; margin-top: 10px;"
                onclick="location.href='/student/main'">
            🏠 메인으로
        </button>
    </div>

    <div id="course-section" class="main-content">
        <h3 style="text-align: center; margin-top:0;">📚 나의 수강 현황</h3>
        <table class="course-table">
            <thead>
            <tr>
                <th>강의명</th>
                <th>진행률</th>
                <th>성적</th>
                <th>평가</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courseList}">
                <td th:text="${course.courseTitle}">자바 기초</td>
                <td th:text="${course.progress} + '%'">80%</td>
                <td th:text="${course.score != null ? course.score : '-'}">A+</td>
                <td>
                     <span th:if="${course.score != null}"
                           th:text="${course.score} + ' / 100'"
                           style="font-weight: bold; color: #ffca28;">
                             85 / 100
                    </span>
                </td>
                <td th:with="s=${course.score}"
                    th:text="${s != null ? s + '점' : '미응시'}"
                    th:style="${s != null} ?
              (${s >= 90} ? 'color:#2ecc71;' : (${s >= 60} ? 'color:#f1c40f;' : 'color:#e74c3c;')) :
              'opacity: 0.5;'">
                    미응시
                </td>
                <td>
                    <button th:if="${course.progress == 100 and course.hasEvaluation}"
                            class="pixel-btn"
                            style="padding: 5px 10px; font-size: 11px; width: auto; background-color: #4caf50;"
                            th:onclick="'openEvaluation(' + ${course.courseId} + ')'">
                        📖 내 수강평 보기
                    </button>

                    <button th:if="${course.progress == 100 and !course.hasEvaluation}"
                            class="pixel-btn"
                            style="padding: 5px 10px; font-size: 11px; width: auto; background-color: #7f8c8d; color: #fff;"
                            onclick="alert('수강평 작성은 해당 강의의 [강의실]에서 가능합니다!')">
                        📝 작성 필요
                    </button>

                    <span th:if="${course.progress < 100}"
                          style="font-size: 11px; opacity: 0.6; color: #fff;">
            🔨 수강 중...
        </span>
                </td>
            </tr>
            </tbody>
        </table>
        <button class="pixel-btn" style="margin-top:20px; width:100%;" onclick="hideSection()">닫기</button>
    </div>

    <div id="evalModal"
         style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:200; justify-content:center; align-items:center;">
        <div style="background:#fff; width:350px; padding:20px; border:4px solid #5d4037; color:#333; text-shadow:none;">
            <h3 style="text-align:center; margin-top:0;">🌟 나의 수강평</h3>
            <hr border="1" style="border-color:#5d4037;">
            <div style="margin:15px 0;">
                <label style="font-weight:bold;">[별점]</label>
                <div id="modalRating" style="color:#ffca28; font-size:1.2rem; margin-top:5px;"></div>
            </div>
            <div style="margin:15px 0;">
                <label style="font-weight:bold;">[후기]</label>
                <p id="modalContent"
                   style="background:#f9f9f9; padding:10px; border-radius:5px; min-height:80px; white-space:pre-wrap;"></p>
            </div>
            <button class="pixel-btn" style="width:100%; background:#8d6e63;" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <!-- 비밀번호 확인용 숨은 form -->
    <form id="infoPasswordForm" action="/student/home/check-password" method="post" style="display:none;">        <input type="hidden" name="userPassword" id="infoPasswordInput">
    </form>
</div>

<!-- 비밀번호 입력 모달 -->
<div class="modal-overlay" id="pwModalOverlay" onclick="closePwModal()"></div>
<div class="common-modal" id="pwModal">
    <h3>🔒 비밀번호 확인</h3>
    <p>내 정보 조회를 위해<br>비밀번호를 입력해주세요.</p>
    <input type="password" id="pwModalInput"
           style="width:100%; padding:10px; margin-bottom:6px;
                  border:2px solid #8d6e63; background:rgba(255,255,255,0.7);
                  font-family:'DungGeunMo',sans-serif; font-size:14px;
                  box-sizing:border-box; outline:none;"
           placeholder="비밀번호 입력"
           onkeydown="if(event.key==='Enter') confirmPwModal()">
    <p id="pwErrorMsg"
       style="display:none; margin:0 0 12px; padding:0;
              color:#f44336; font-size:13px; text-align:left;
              background:none; border:none;">
        ⚠ 비밀번호가 일치하지 않습니다.
    </p>
    <div style="display:flex; gap:10px; justify-content:center;">
        <button onclick="confirmPwModal()" style="background:#8d6e63;">확인</button>
        <button onclick="closePwModal()" style="background:#607d8b;">취소</button>
    </div>
</div>

<script>
    const char = document.getElementById('player-character');
    const room = document.getElementById('homeRoom');
    const charImg = document.getElementById('target-char-img');
    const gender = char.dataset.gender

    const roomWidth = 800;
    const roomHeight = 600;
    const charWidth = 100;
    const charHeight = 120;

    function openEvaluation(courseId) {
        fetch(`/student/evaluation/api/detail?courseId=${courseId}`)
            .then(response => {
                if (!response.ok) {
                    if (response.status === 404) alert('작성된 수강평이 없습니다.');
                    throw new Error('데이터를 가져오지 못했습니다.');
                }
                return response.json();
            })
            .then(data => {
                const stars = '⭐'.repeat(Math.floor(data.rating));
                document.getElementById('modalRating').innerText = stars + " (" + data.rating + ")";
                document.getElementById('modalContent').innerText = data.content;
                document.getElementById('evalModal').style.display = 'flex';
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    function closeModal() {
        document.getElementById('evalModal').style.display = 'none';
    }

    function showSection(id, btn) {
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.pixel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function hideSection() {
        document.getElementById('course-section').style.display = 'none';
        document.getElementById('course-btn').classList.remove('active');
    }

    function moveCharRandomly() {
        const minX = 50;
        const maxX = roomWidth - charWidth - 50;
        const minY = 50;
        const maxY = roomHeight - charHeight - 50;

        const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
        const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        char.style.left = randomX + 'px';
        char.style.top = randomY + 'px';

        charImg.src = `/image/${gender}-front.png`;
        charImg.style.transform = 'scaleX(1)';
    }

    setInterval(moveCharRandomly, 3000);
    moveCharRandomly();

    function confirmWithdraw() {
        if (confirm("정말 탈퇴하시겠습니까? 모든 정보가 사라집니다.")) {
            location.href = "/student/withdraw";
        }
    }

    // ── 비밀번호 모달 ──
    function openInfoPasswordPopup() {
        document.getElementById("pwModalInput").value = "";
        document.getElementById("pwErrorMsg").style.display = "none";
        document.getElementById("pwModal").classList.add("active");
        document.getElementById("pwModalOverlay").classList.add("active");
        setTimeout(() => document.getElementById("pwModalInput").focus(), 100);
    }

    function closePwModal() {
        document.getElementById("pwModal").classList.remove("active");
        document.getElementById("pwModalOverlay").classList.remove("active");
        const url = new URL(window.location);
        url.searchParams.delete("passwordError");
        window.history.replaceState({}, '', url);
    }

    function confirmPwModal() {
        const password = document.getElementById("pwModalInput").value;
        if (password.trim() === "") {
            document.getElementById("pwErrorMsg").textContent = "⚠ 비밀번호를 입력해주세요.";
            document.getElementById("pwErrorMsg").style.display = "block";
            return;
        }
        closePwModal();
        document.getElementById("infoPasswordInput").value = password;
        document.getElementById("infoPasswordForm").submit();
    }

    window.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get("passwordError") === "true") {
            openInfoPasswordPopup();
            document.getElementById("pwErrorMsg").style.display = "block";
        }
    });
</script>

</body>
</html>
