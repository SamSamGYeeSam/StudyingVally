<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 문자 인코딩 -->
  <meta charset="UTF-8" />

  <!-- 반응형 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 브라우저 탭 제목 -->
  <title>강의 마을 - 로그인</title>

  <!-- auth 화면 공통 CSS -->
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
  <!-- 배경 요소 -->
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="mountains"></div>
  <div class="far-trees"></div>

  <div class="ground"></div>
  <div class="path"></div>
  <div class="fence"></div>

  <div class="house">
    <div class="roof"></div>
    <div class="body"></div>
    <div class="window left"></div>
    <div class="window right"></div>
    <div class="door"></div>
  </div>

  <div class="panel-wrap">
    <div class="panel">

      <!-- 로그인 화면 -->
      <section id="loginScreen" class="form-screen active">
        <h1 class="title">로그인</h1>

        <!-- 로그인 처리 form
             POST /auth/login 은 Controller가 직접 처리하는 것이 아니라
             Spring Security가 가로채서 인증을 진행한다. -->
        <form class="form-box" th:action="@{/auth/login}" method="post">

          <!-- 로그인 아이디 -->
          <div class="field">
            <label for="loginId">아이디</label>
            <input type="text"
                   id="loginId"
                   name="loginId"
                   placeholder="아이디 입력"
                   required />
          </div>

          <!-- 로그인 비밀번호 -->
          <div class="field">
            <label for="password">비밀번호</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="비밀번호 입력"
                   required />
          </div>

          <!-- 버튼 영역 -->
          <div class="bottom-row">
            <!-- 메인 화면으로 이동 -->
            <button type="button"
                    onclick="location.href='/main'"
                    class="pixel-btn secondary"
                    id="backFromLoginBtn">
              이전으로
            </button>

            <!-- 로그인 요청 -->
            <button type="submit"
                    class="pixel-btn"
                    id="loginSubmitBtn">
              로그인
            </button>
          </div>

          <!-- 로그인 실패 메시지 출력
               AuthFailHandler -> /auth/login?error=true&message=...
               AuthController.login() -> model에 loginErrorMessage 전달 -->
          <div id="loginMsg"
               class="msg show error"
               th:if="${loginErrorMessage != null}">
                        <span th:text="${loginErrorMessage}">
                            아이디 또는 비밀번호를 확인해주세요.
                        </span>
          </div>

        </form>

        <!-- 아이디 / 비밀번호 찾기 -->
        <div class="helper-links">
          <a th:href="@{/auth/find}">아이디 / 비밀번호를 잊으셨나요?</a>
        </div>
      </section>

    </div>
  </div>
</div>
</body>
</html>
