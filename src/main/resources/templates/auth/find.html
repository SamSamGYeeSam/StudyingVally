<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 문자 인코딩 -->
    <meta charset="UTF-8" />

    <!-- 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭 제목 -->
    <title>강의 마을 - 아이디/비밀번호 찾기</title>

    <!-- 기존 auth 화면 CSS 재사용 -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
    <!-- 배경 요소 -->
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">

            <!-- 아이디/비밀번호 찾기 선택 화면 -->
            <section id="findScreen" class="form-screen active">
                <h1 class="title">아이디 / 비밀번호를<br>잊으셨나요 ?</h1>

                <div class="form-box find-box">
                    <div class="find-button-row">
                        <!-- 아이디 찾기 화면 이동 -->
                        <form th:action="@{/auth/findid}" method="get">
                            <button type="submit" class="pixel-btn" id="goFindIdBtn">
                                아이디 찾기
                            </button>
                        </form>

                        <!-- 비밀번호 찾기 화면 이동 -->
                        <form th:action="@{/auth/findpw1}" method="get">
                            <button type="submit" class="pixel-btn" id="goFindPwBtn">
                                비밀번호 재설정
                            </button>
                        </form>
                    </div>

                    <div class="bottom-row single-row">
                        <!-- 첫 화면으로 이동 -->
                        <button type="button"
                                onclick="location.href='/main'"
                                class="pixel-btn secondary"
                                id="backFromFindBtn">
                            이전으로
                        </button>
                    </div>
                </div>
            </section>

        </div>
    </div>
</div>
</body>
</html>
