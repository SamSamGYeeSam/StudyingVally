<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 탈퇴</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<div class="room-container">
    <h1 class="pixel-title">🚪 회원 탈퇴</h1>

    <div class="main-wrapper">
        <div class="scroll-content">
            <h3 class="section-title">계정 탈퇴</h3>

            <div class="info-card">
                <p class="pixel-text-small">탈퇴를 진행하려면 현재 비밀번호를 입력해주세요.</p>

                <!-- 에러 메시지 -->
                <div th:if="${deleteError != null}"
                     th:text="${deleteError}"
                     style="color:#e74c3c; text-align:center; margin-bottom:15px; font-size:13px;">
                </div>

                <form th:if="${formActionUrl != null}" th:action="${formActionUrl}" method="post">
                    <div class="settings-item">
                        <div class="item-desc">
                            <strong>비밀번호</strong>
                            <span class="danger-text">탈퇴 시 모든 데이터가 삭제됩니다.</span>
                        </div>
                        <input type="password"
                               id="userPassword"
                               name="userPassword"
                               th:value="${deleteUserDTO != null ? deleteUserDTO.userPassword : ''}"
                               required
                               placeholder="비밀번호 입력"
                               style="background:rgba(255,255,255,0.1); border:2px solid #5d4037;
                                      color:#fff; font-family:'DungGeunMo'; font-size:14px;
                                      padding:6px 10px; outline:none; width:200px;">
                    </div>

                    <div class="footer-area" style="display:flex; gap:10px;">
                        <button type="submit" class="pixel-btn danger">🚪 탈퇴하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
