<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 문자 인코딩 -->
    <meta charset="UTF-8" />

    <!-- 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭 제목 -->
    <title>강의 마을 - 아이디 찾기 결과</title>

    <!-- auth 공통 CSS 사용 -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
    <!-- 배경 요소 -->
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">

            <!-- 아이디 찾기 결과 화면 -->
            <section id="findIdResultScreen" class="form-screen active">
                <h1 class="title">아이디 찾기 결과</h1>

                <div class="form-box result-box">
                    <!-- 안내 문구 -->
                    <p class="result-text">아이디는</p>

                    <!-- 찾은 아이디 출력 -->
                    <p class="result-value" th:text="${foundUserId}">sooyoung</p>

                    <!-- 안내 문구 -->
                    <p class="result-text">입니다</p>

                    <div class="bottom-row single-row">
                        <!-- 확인 버튼 클릭 시 첫 화면으로 이동 -->
                        <button type="button"
                                onclick="location.href='/main'"
                                class="pixel-btn"
                                id="confirmFindIdBtn">
                            확인
                        </button>
                    </div>
                </div>
            </section>

        </div>
    </div>
</div>
</body>
</html>
