<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 문자 인코딩 -->
    <meta charset="UTF-8" />

    <!-- 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭 제목 -->
    <title>강의 마을 - 비밀번호 찾기</title>

    <!-- auth 화면 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
    <!-- 배경 요소 -->
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">

            <!-- 비밀번호 찾기 화면 -->
            <section id="findPwScreen" class="form-screen active">
                <h1 class="title">비밀번호 찾기</h1>

                <form class="form-box" th:action="@{/auth/findpw2}" method="get">

                    <div class="field">
                        <label for="userId">아이디</label>
                        <input type="text"
                               id="userId"
                               name="userId"
                               placeholder="아이디 입력"
                               required />
                    </div>

                    <div class="field">
                        <label for="phoneNumber">전화번호</label>
                        <input type="text"
                               id="phoneNumber"
                               name="phoneNumber"
                               placeholder="전화번호 입력"
                               required />
                    </div>

                    <div class="bottom-row">
                        <!-- 첫 화면으로 이동 -->
                        <button type="button"
                                onclick="location.href='/main'"
                                class="pixel-btn secondary"
                                id="backFromFindPwBtn">
                            뒤로가기
                        </button>

                        <!-- 비밀번호 찾기 결과 화면으로 이동 -->
                        <button type="submit"
                                class="pixel-btn"
                                id="findPwSubmitBtn">
                            비밀번호 찾기
                        </button>
                    </div>

                    <div id="findPwMsg" class="msg show error" th:if="${findPwError}">
                        <span th:text="${findPwError}">일치하는 회원 정보를 찾을 수 없습니다.</span>
                    </div>
                </form>
            </section>

        </div>
    </div>
</div>
</body>
</html>
