<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강의 마을 - 비밀번호 재설정</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">
            <section id="resetPwScreen" class="form-screen active">
                <h1 class="title">비밀번호 재설정</h1>

                <form class="form-box" th:action="@{/auth/resetpw}" method="post">
                    <input type="hidden" name="userId" th:value="${userId}">
                    <input type="hidden" name="phoneNumber" th:value="${phoneNumber}">

                    <div class="field">
                        <label for="newPassword">새 비밀번호</label>
                        <input type="password"
                               id="newPassword"
                               name="newPassword"
                               placeholder="새 비밀번호 입력"
                               required>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="비밀번호를 다시 입력"
                               required>
                    </div>

                    <div class="bottom-row">
                        <button type="button"
                                onclick="history.back()"
                                class="pixel-btn secondary"
                                id="backFromResetPwBtn">
                            이전으로
                        </button>

                        <button type="submit"
                                class="pixel-btn"
                                id="resetPwSubmitBtn">
                            비밀번호 재설정
                        </button>
                    </div>

                    <div class="msg show error"
                         th:if="${resetPwError != null}">
                        <span th:text="${resetPwError}">
                            비밀번호 재설정 중 오류가 발생했습니다.
                        </span>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>
</body>
</html>
