<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 문자 인코딩 -->
    <meta charset="UTF-8" />

    <!-- 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭 제목 -->
    <title>강의 마을 - 회원가입</title>

    <!-- auth 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="game-screen">
    <!-- 배경 요소 -->
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">

            <!-- 회원가입 1단계 화면 -->
            <section id="signup1Screen" class="form-screen active">
                <h1 class="title">회원가입</h1>

                <!--
                    회원가입 1단계 입력 폼
                    다음으로 버튼 클릭 시 /auth/signup2 로 이동하며,
                    입력한 값을 다음 단계 화면으로 전달한다.
                -->
                <form th:action="@{/auth/signup2}" method="post">

                    <!-- 이름 입력 -->
                    <div class="field">
                        <label for="userName">이름</label>
                        <input type="text"
                               id="userName"
                               name="userName"
                               placeholder="이름 입력"
                               th:value="${signupDTO != null ? signupDTO.userName : ''}"
                               required />
                    </div>

                    <!-- 아이디 입력 -->
                    <div class="field">
                        <label for="userId">아이디</label>
                        <input type="text"
                               id="userId"
                               name="userId"
                               placeholder="아이디 입력"
                               th:value="${signupDTO != null ? signupDTO.userId : ''}"
                               required />
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div class="field">
                        <label for="userPassword">비밀번호</label>
                        <input type="password"
                               id="userPassword"
                               name="userPassword"
                               placeholder="비밀번호 입력"
                               th:value="${signupDTO != null ? signupDTO.userPassword : ''}"
                               required />
                    </div>

                    <!-- 전화번호 입력 -->
                    <div class="field">
                        <label for="userPhoneNumber">전화번호</label>
                        <input type="text"
                               id="userPhoneNumber"
                               name="userPhoneNumber"
                               placeholder="전화번호 입력"
                               th:value="${signupDTO != null ? signupDTO.userPhoneNumber : ''}"
                               required />
                    </div>

                    <!-- 이메일 입력 -->
                    <div class="field">
                        <label for="userEmail">이메일</label>
                        <input type="email"
                               id="userEmail"
                               name="userEmail"
                               placeholder="이메일 입력"
                               th:value="${signupDTO != null ? signupDTO.userEmail : ''}"
                               required />
                    </div>

                    <!-- 회원가입 1단계 에러 메시지 -->
                    <div th:if="${signup1Error != null}" class="error-message" th:text="${signup1Error}">
                        회원가입 정보를 모두 입력해주세요.
                    </div>

                    <div class="bottom-row">
                        <!-- 메인 화면으로 이동 -->
                        <button type="button"
                                onclick="location.href='/main'"
                                class="pixel-btn secondary"
                                id="backFromSignup1Btn">
                            뒤로가기
                        </button>

                        <!-- signup2 화면으로 이동 -->
                        <button type="submit"
                                class="pixel-btn primary"
                                id="goToSignup2Btn">
                            다음으로
                        </button>
                    </div>
                </form>
            </section>

        </div>
    </div>
</div>
</body>
</html>
