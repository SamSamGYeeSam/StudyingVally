<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강의 마을 - 회원가입</title>
    <link rel="stylesheet" href="/css/auth.css">

</head>
<body>
<div class="game-screen">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains"></div>
    <div class="far-trees"></div>

    <div class="ground"></div>
    <div class="path"></div>
    <div class="fence"></div>

    <div class="house">
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
    </div>

    <div class="panel-wrap">
        <div class="panel">

            <!-- 회원가입 화면 -->
            <section id="signupScreen" class="form-screen active">
                <h1 class="title">회원가입</h1>

                <div class="form-box">

                    <div class="field">
                        <label for="signupName">이름</label>
                        <input type="text" id="signupName" placeholder="이름 입력" />
                    </div>

                    <div class="field">
                        <label for="signupId">아이디</label>
                        <input type="text" id="signupId" placeholder="아이디 입력" />
                    </div>

                    <div class="field">
                        <label for="signupPwd">비밀번호</label>
                        <input type="password" id="signupPwd" placeholder="비밀번호 입력" />
                    </div>

                    <div class="field">
                        <label for="signupName">닉네임</label>
                        <input type="text" id="signupName" placeholder="닉네임 입력" />
                    </div>
                    <!--  -->

                    <div class="field">
                        <label for="signupPhone">전화번호</label>
                        <input type="text" id="signupPhone" placeholder="전화번호 입력" />
                    </div>

                    <div class="field">
                        <label for="signupEmail">이메일</label>
                        <input type="email" id="signupEmail" placeholder="이메일 입력" />
                    </div>


                    <div class="bottom-row">
                        <button onclick="location.href='/main'" class="pixel-btn secondary" id="backFromSignupBtn">뒤로가기</button>
                        <button onclick="location.href='/auth/signup2'" class="pixel-btn" id="signupSubmitBtn">다음으로</button>
                    </div>

                    <div id="signupMsg" class="msg"></div>
                </div>
            </section>


        </div>
    </div>
</div>


<!-- <script src="demo.js" defer></script> -->
</body>
</html>
