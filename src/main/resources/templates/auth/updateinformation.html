<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보 수정</title>
</head>
<body>

<h1>내 정보 수정</h1>

<form th:action="${formActionUrl}" method="post">

    <div>
        <label>이름</label>
        <input type="text" th:value="${userInfo.userName}" readonly>
    </div>

    <div>
        <label for="userPhoneNumber">전화번호</label>
        <input type="text"
               id="userPhoneNumber"
               name="userPhoneNumber"
               th:value="${updateDTO.userPhoneNumber}"
               required>
    </div>

    <div>
        <label for="userEmail">이메일</label>
        <input type="text"
               id="userEmail"
               name="userEmail"
               th:value="${updateDTO.userEmail}"
               required>
    </div>

    <div>
        <label for="userPassword">비밀번호</label>
        <input type="password"
               id="userPassword"
               name="userPassword"
               th:value="${updateDTO.userPassword}"
               required>
    </div>

    <div th:if="${updateError != null}" th:text="${updateError}">
        수정 에러 메시지
    </div>

    <div>
        <button type="button"
                th:onclick="|location.href='${showPageUrl}'|">
            뒤로가기
        </button>

        <button type="submit">
            확인
        </button>
    </div>

</form>

</body>
</html>
