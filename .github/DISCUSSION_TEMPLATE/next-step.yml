title: "[Next Step] "
labels: ["next-step", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        # 🚀 Next Step: 삼삼그이삼
        > **우리가 다음에 나아갈 방향을 명확하고 큼직하게 기록해 주세요.**
        ---

  - type: textarea
    id: main_goal
    attributes:
      label: "🎯 핵심 목표"
      description: "이번 단계에서 달성해야 할 가장 큰 목표를 작성해 주세요."
      value: "## "
    validations:
      required: true

  - type: textarea
    id: plan_details
    attributes:
      label: "📝 상세 실행 계획"
      description: "목표를 이루기 위한 세부 내용을 작성해 주세요. (글머리 기호 사용 권장)"
      value: |
        ### 
        - 
    validations:
      required: true

  - type: textarea
    id: extra_notes
    attributes:
      label: "📎 추가 참고 및 주의 사항"
      description: "팀원들이 알아야 할 제약 사항이나 링크가 있다면 적어주세요."
      placeholder: "자유롭게 내용을 입력하거나 마크다운으로 꾸며주세요."
    validations:
      required: false
