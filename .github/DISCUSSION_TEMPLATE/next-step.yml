title: "[Next Step] "
labels: ["next-step", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        **TEAM 삼삼그이삼 | NEXT STEP**
        ---

  - type: textarea
    id: goal
    attributes:
      label: "📌 이번 단계 목표"
      description: "달성하고자 하는 결과를 명확히 작성해 주세요."
      value: "**[목표]** "
    validations:
      required: true

  - type: textarea
    id: list
    attributes:
      label: "🏃 실행 항목"
      description: "진행할 작업을 순서대로 나열해 주세요."
      value: |
        • 
        • 
        • 
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: "📝 비고"
      description: "참고 사항 및 특이 사항을 기록합니다."
    validations:
      required: false
