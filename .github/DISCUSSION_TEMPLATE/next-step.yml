name: "🚀 Next Step"
description: "팀 AtwoBthree의 다음 도약을 위한 계획을 수립합니다."
title: "[Next Step] "
labels: ["next-step", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🏁 Next Step: 새로운 도전
        > **"작은 발걸음이 모여 큰 변화를 만듭니다."** > 오늘 논의할 다음 단계의 핵심을 명확하게 기록해 주세요.
        ---

  - type: textarea
    id: goal
    attributes:
      label: "🎯 이번 단계의 핵심 목표"
      description: "무엇을 달성하려고 하나요? (가장 중요한 한 문장)"
      placeholder: "예: 로그인 프로세스 이탈률 5% 감소를 위한 UI 개선"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📝 세부 실행 계획"
      description: "목표 달성을 위해 필요한 구체적인 할 일들입니다."
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "💥 기대 효과 및 임팩트"
      options:
        - "🌟 혁신적 (서비스의 핵심 가치를 변화시킴)"
        - "⚡ 효율적 (기존 프로세스를 크게 개선함)"
        - "🛠 안정적 (시스템의 기반을 견고히 함)"
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: "📎 참고 자료 및 링크"
      placeholder: "Figma 시안, 관련 이슈 번호, 혹은 벤치마킹 자료"
