title: "[Next Step] "
labels: ["next-step", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        **TEAM 삼삼그이삼 | NEXT STEP**
        ---

  - type: textarea
    id: goal
    attributes:
      label: "🎯 핵심 목표"
      description: "이번 단계의 가장 중요한 목적을 작성해 주세요."
      value: "**[목표]** "
    validations:
      required: true

  - type: textarea
    id: roadmap
    attributes:
      label: "🏃 실행 순서"
      description: "번호 뒤에 다음 할 일들을 작성해 주세요."
      value: |
        **1. **
        **2. **
        **3. **
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: "📝 추가 참고"
      description: "필요한 경우에만 작성합니다."
      placeholder: "자유롭게 내용을 입력하세요."
    validations:
      required: false
