title: "[Next Step] "
labels: ["next-step", "planning"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Next Step 계획
        > **삼삼그이삼**의 다음 작업 방향을 간결하게 공유해 주세요.

  - type: textarea
    id: checklist
    attributes:
      label: "✅ 세부 할 일 목록"
      description: "다음에 진행할 작업들을 체크박스(- [ ])로 작성해 주세요."
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: "📝 추가 내용"
      description: "필요한 경우 참고 자료, 링크, 혹은 주의 사항을 자유롭게 적어주세요."
      placeholder: "기타 참고 사항이 없다면 비워두셔도 됩니다."
    validations:
      required: false
