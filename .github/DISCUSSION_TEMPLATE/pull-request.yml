title: "[PR] "
labels: ["pr", "review-needed"]
body:
  - type: markdown
    attributes:
      value: |
        # 🔗 Pull Request Link
        > [!IMPORTANT]
        > **Team 삼삼그이삼 작업 가이드**
        > 리뷰어가 변경 사항을 즉시 확인할 수 있도록 아래에 PR 링크를 가장 먼저 첨부해 주세요.

  - type: textarea
    id: pr_url
    attributes:
      label: "🔗 연결된 PR 링크"
      description: "리뷰할 Pull Request의 URL을 입력해 주세요."
      placeholder: "https://github.com/삼삼그이삼/repository/pull/..."
    validations:
      required: true

  - type: textarea
    id: pr_summary
    attributes:
      label: "📌 변경 요약"
      description: "이번 작업을 통해 무엇이 변했는지 간단히 적어주세요."
      placeholder: "예: 로그인 페이지 레이아웃 수정 및 API 연동"
    validations:
      required: true

  - type: textarea
    id: pr_checklist
    attributes:
      label: "✅ 리뷰 포인트 및 체크리스트"
      description: "리뷰어가 중점적으로 봐주었으면 하는 부분이나 본인이 확인한 사항입니다."
      value: |
        - [ ] 핵심 로직에 대한 단위 테스트를 완료했나요?
        - [ ] 코드 컨벤션을 준수했나요?
        - [ ] 특별히 리뷰가 필요한 부분이 있나요? (있다면 아래에 작성)
    validations:
      required: true

  - type: textarea
    id: additional_note
    attributes:
      label: "📝 추가 참고 사항 (선택)"
      description: "스크린샷, 참고 문서 링크, 혹은 기타 의견을 적어주세요."
      placeholder: "이미지를 드래그해서 넣거나 설명을 추가하세요."
    validations:
      required: false
