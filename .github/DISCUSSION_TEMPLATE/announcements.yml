name: "회의록 (Meeting Minutes)"
description: "새로운 디스커션/이슈 회의록을 작성합니다."
title: "[Meeting] "
labels: ["meeting", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > **회의록 작성 가이드**
        > 회의에서 논의된 주요 내용과 결정된 사항을 명확하게 기록하고 공유해 주세요.

  - type: checkboxes
    id: attendees
    attributes:
      label: "👥 참석자"
      description: "오늘 회의에 참석한 팀원을 모두 체크해 주세요."
      options:
        - label: "김진도"
        - label: "전지원"
        - label: "지석범"
        - label: "모성진"
        - label: "임수영"
    validations:
      required: false

  - type: textarea
    id: discussion_summary
    attributes:
      label: "📌 회의 요약"
      description: "오늘 어떤 주제로 회의를 진행했는지 핵심만 간략히 적어주세요."
      placeholder: "예: 블로그 다중 사용자 DB 스키마 설계 및 도메인 연동 논의"
    validations:
      required: false

  - type: textarea
    id: discussions
    attributes:
      label: "💬 상세 논의 내용"
      description: "회의 중 오고 간 주요 의견이나 상세한 내용을 자유롭게 기록하세요."
      value: |
        - 
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: action_items
    attributes:
      label: "✅ 결정 사항 및 할 일 (Action Items)"
      description: "회의 결과로 결정된 사항과 향후 진행할 작업을 할 일 목록으로 작성하세요."
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
