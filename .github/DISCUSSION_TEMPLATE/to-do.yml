name: 🗓️ TO DO 작성 양식
description: 새로운 할 일을 등록하고 우선순위를 정합니다.
title: "[TODO]: " # 글 제목 앞에 자동으로 붙는 접두어
labels: ["todo", "enhancement"] # 자동으로 붙을 라벨 (선택 사항)
body:
  - type: markdown
    attributes:
      value: |
        ## 📌 Task Checklist
        새로운 작업을 등록할 때 아래 정보를 상세히 적어주세요.

  - type: input
    id: task_title
    attributes:
      label: 🛠 작업 명칭
      placeholder: "예: Flutter 로그인 페이지 UI 수정"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 우선순위
      options:
        - 긴급 (Critical)
        - 높음 (High)
        - 보통 (Medium)
        - 낮음 (Low)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📖 상세 내용
      description: 무엇을 해야 하는지 구체적으로 적어주세요.
      placeholder: "기능 정의 및 구현 범위 등..."
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: 🔗 관련 링크 및 자료
      description: 참고할 문서나 API 명세서가 있다면 링크를 남겨주세요.
      placeholder: "Groq API 문서, 피그마 디자인 링크 등"

  - type: checkboxes
    id: steps
    attributes:
      label: ✅ 하위 작업 (Sub-tasks)
      options:
        - [ ] 환경 설정 및 의존성 추가
        - [ ] 로직 구현
        - [ ] 단위 테스트 완료
        - [ ] PR 및 코드 리뷰 요청
