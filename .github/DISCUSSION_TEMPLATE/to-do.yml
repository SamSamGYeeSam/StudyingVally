title: "[TO DO] "
labels: ["todo", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Team 삼삼그이삼 작업 가이드
        오늘 진행할 작업을 기록해 주세요. (글씨는 자동으로 굵게 표시됩니다.)

  - type: textarea
    id: task_list
    attributes:
      label: "✅ 상세 할 일"
      description: "할 일을 작성해 주세요. 체크박스 뒤에 내용을 적으면 됩니다."
      value: |
        **- [ ] **
        **- [ ] **
        **- [ ] **
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "🚨 우선순위"
      options:
        - "🔴 High (즉시 처리)"
        - "🟡 Medium (일반 작업)"
        - "🔵 Low (여유 있을 때)"
    validations:
      required: true

  - type: textarea
    id: goal_condition
    attributes:
      label: "🏁 완료 조건"
      description: "무엇을 달성하면 이 작업이 끝나는지 한 문장으로 적어주세요."
      placeholder: "예: 모든 테스트 케이스 통과 및 코드 병합 완료"
    validations:
      required: true
