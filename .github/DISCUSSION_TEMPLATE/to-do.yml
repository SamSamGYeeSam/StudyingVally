title: "[TO DO] "
labels: ["todo", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Team 삼삼그이삼 작업 가이드**
        > 오늘 할 일을 명확하게 기록하고 공유해 주세요.

  - type: textarea
    id: big_todo_list
    attributes:
      label: "✅ 상세 할 일 (크게 보기)"
      description: "체크박스 뒤에 내용을 작성하면 글씨가 큼직하게 보입니다."
      value: |
        ### - [ ] 
        ### - [ ] 
        ### - [ ] 
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "🚨 우선순위"
      options:
        - "🔴 High (즉시 처리)"
        - "🟡 Medium (일반 작업)"
        - "🔵 Low (여유 있을 때)"
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: "🏁 완료 조건 (Definition of Done)"
      description: "이 작업이 끝났다고 판단하는 기준을 크게 작성해 주세요."
      value: "## "
    validations:
      required: true
